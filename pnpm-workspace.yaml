packages:
  - 'packages/*'
  - 'apps/*'
  - 'tools/*'
  - 'docs'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - vue-demi

# EINE h3-Version im Baum. Nicht Kosmetik, sondern die Bedingung dafür, dass
# der Typecheck überhaupt reproduzierbar ist:
# nitropack 2.13.4 bringt h3 1.15.11, und über Vite 8 kommt
# `@vitejs/devtools` → devtools-kit → devframe → h3 2.0.1-rc dazu. Bei ZWEI
# Kopien entscheidet pnpms Hoisting, welche unter `.pnpm/node_modules/h3`
# landet; `nuxi prepare` schreibt GENAU DIE in die `paths` der generierten
# tsconfigs, während nitros eigene Typen bei h3 1 bleiben. Gewinnt h3 2, ist
# jedes Event, das eine Route an einen geteilten Helfer weiterreicht, ein
# Typfehler — gemessen platform 1102, control 944, comments 1261. Das Hoisting
# steht NICHT im Lockfile: dieselbe Lockfile war auf einer Maschine grün und
# auf der anderen rot (nachgestellt, indem nur der Hoist-Symlink umgehängt
# wurde). Ein Override auf `vite: ^7` beseitigt das NICHT — Vite 8 hängt als
# auto-installierter Peer (`autoInstallPeers`) mit drin und der Baum wird
# dadurch nur noch gemischter (zwei @nuxt/vite-builder-Varianten).
# Deshalb direkt an h3. Preis, bewusst bezahlt: devframe importiert `H3`,
# `defineHandler` und `toNodeHandler` — h3-2-APIs, die h3 1 nicht hat. devframe
# ist Vite-DEVTOOLS-Zubehör (über @unhead/bundler → @vitejs/devtools-kit); der
# Einstiegspunkt `@vitejs/devtools` ist gar nicht installiert, es wird also nie
# geladen — Dev-Server, alle vier Prod-Builds und der Browser bleiben sauber.
# Sollte Vite-Devtools je wirklich gebraucht werden, ist das der Moment, den
# Vite-8-Sprung als EIGENE Entscheidung anzugehen (Vite 7 kennt devframe nicht).
# Wächter: `pnpm check:single-copy`.
overrides:
  h3: ^1.15.11
  # EINE Tiptap-Linie im ganzen Baum — auf 3.27.1 gehalten (2026-08-31
  # live erwischt): der @nuxt/ui-Bump 4.10→4.11 brachte NEUE Tiptap-Peers
  # mit, die pnpm frisch als 3.30.5 auflöste, während die festgeklebten
  # Alt-Peers auf 3.27.1 blieben. Der Mix ist der Schaden:
  # extension-list@3.30.5 importiert getPreviousBlockSibling, das
  # @tiptap/core@3.27.1 nicht exportiert — SSR-500 auf JEDER
  # UEditor-Seite (Changelog-Admin, Seiten-Dashboard, Composer), CI-E2E
  # auth-guard drei Läufe rot. Hochzwingen der Alt-Peers scheitert
  # (Auto-Install-Peer-Instanzen re-resolven weder per update/dedupe noch
  # per Override), also werden die NEUEN Pakete auf die Alt-Linie
  # gehalten — Version-Overrides greifen (h3-Muster). Der Katalog-Pin
  # `@tiptap/extension-mention: 3.27.1` und DIESE Liste nennen dieselbe
  # Version; bei einem künftigen Tiptap-Linien-Wechsel wandern beide
  # GEMEINSAM (und y-tiptap bleibt draussen, eigene Versionierung).
  '@tiptap/core': 3.27.1
  '@tiptap/extension-blockquote': 3.27.1
  '@tiptap/extension-bold': 3.27.1
  '@tiptap/extension-bubble-menu': 3.27.1
  '@tiptap/extension-bullet-list': 3.27.1
  '@tiptap/extension-code': 3.27.1
  '@tiptap/extension-code-block': 3.27.1
  '@tiptap/extension-collaboration': 3.27.1
  '@tiptap/extension-document': 3.27.1
  '@tiptap/extension-drag-handle': 3.27.1
  '@tiptap/extension-drag-handle-vue-3': 3.27.1
  '@tiptap/extension-dropcursor': 3.27.1
  '@tiptap/extension-floating-menu': 3.27.1
  '@tiptap/extension-gapcursor': 3.27.1
  '@tiptap/extension-hard-break': 3.27.1
  '@tiptap/extension-heading': 3.27.1
  '@tiptap/extension-horizontal-rule': 3.27.1
  '@tiptap/extension-image': 3.27.1
  '@tiptap/extension-italic': 3.27.1
  '@tiptap/extension-link': 3.27.1
  '@tiptap/extension-list': 3.27.1
  '@tiptap/extension-list-item': 3.27.1
  '@tiptap/extension-list-keymap': 3.27.1
  '@tiptap/extension-mention': 3.27.1
  '@tiptap/extension-node-range': 3.27.1
  '@tiptap/extension-ordered-list': 3.27.1
  '@tiptap/extension-paragraph': 3.27.1
  '@tiptap/extension-placeholder': 3.27.1
  '@tiptap/extension-strike': 3.27.1
  '@tiptap/extension-text': 3.27.1
  '@tiptap/extension-underline': 3.27.1
  '@tiptap/extensions': 3.27.1
  '@tiptap/markdown': 3.27.1
  '@tiptap/pm': 3.27.1
  '@tiptap/starter-kit': 3.27.1
  '@tiptap/suggestion': 3.27.1
  '@tiptap/vue-3': 3.27.1

# `ipx` ist eine OPTIONALE Abhängigkeit von @nuxt/image und wird ausschliesslich
# vom eingebauten `ipx`-Anbieter gebraucht — also von dem, der die Bilder AUF DEM
# APP-SERVER rechnet. Genau das will dieses Repo nicht (C14): transformiert wird
# in Appwrite (`/preview`), der eigene Anbieter `appwrite` baut nur URLs.
# Ohne diesen Ausschluss zieht ipx `sharp` mit — und sharp bringt die ganze
# `@img/sharp-*`-Plattform-Matrix (26 Pakete, ~1.400 Lockfile-Zeilen und
# libvips-Binaries) in einen Baum, der sie nie ausführt.
# WICHTIG: Wer je den ipx-Anbieter will, muss diesen Eintrag zuerst entfernen —
# @nuxt/image meldet sonst zur Build-Zeit ein fehlendes Modul.
ignoredOptionalDependencies:
  - ipx

catalog:
  '@iconify-json/ph': ^1.2.2
  '@iconify-json/circle-flags': ^1.2.5
  '@iconify-json/lucide': ^1.2.118
  '@nuxt/content': ^3.15.1
  '@nuxt/eslint-config': ^1.15.2
  # MUSS zur Nuxt-Generation passen: 10.4 gehört zu Nuxt 4.4 und zieht
  # @unhead/vue 2 + vue-router 5.1 (und darüber pinia 3) in den Baum, während
  # Nuxt 4.5 auf unhead 3 + vue-router 5.2 steht. 10.6 verlangt @nuxt/kit
  # ^4.5.1, unhead ^3.2.3, vue-router ^5.2.0, h3 ^1.15.11 — dieselbe Linie.
  '@nuxtjs/i18n': ^10.6.0
  eslint: ^10.8.0
  # In-Memory-Zip für das Brand-Kit-Bündel (BK1 K6, Konzept §2.17). Pur, ohne
  # Abhängigkeiten, läuft in Node und im Browser — gebraucht wird nur
  # `zipSync`/`strToU8` in `packages/brand/shared/brandKitZip.ts` (Server).
  fflate: ^0.8.3
  # Web-SDK auf 27 (AW2 Stufe 4): setzt Response-Format 2.0.0 voraus, also
  # Appwrite-Server 2.0 — dev läuft dort, prod zieht nach. Aufgefangene
  # Brüche: `presences.list/get/upsert/update` sind nicht mehr generisch
  # (`Models.DefaultPresence` entfällt — wir casten ohnehin selbst) und das
  # `Theme`-Enum heißt `BrowserTheme` (avatars.getScreenshot, ungenutzt).
  appwrite: ^27.0.0
  # Server-SDK auf 29 (AW2 Stufe 4): sendet Response-Format 2.0.0, setzt also
  # ebenfalls Appwrite-Server 2.0 voraus. Aufgefangene Brüche über alle
  # Stufen: der `Health`-Service ist seit 27 weg (Ersatz: REST-Helfer in
  # core/server/utils/appwriteHealth.ts — dessen RESPONSE_FORMAT zieht mit),
  # `account.createJWT` seit 28 (Ersatz: `users.createJWT` am Admin-Client),
  # und seit 29 heißt `Execution.functionId` `resourceId`/`resourceType`
  # sowie `tablesDB.cutoverMigration` `createCutover` (beide ungenutzt).
  node-appwrite: ^29.0.0
  '@types/node': ^22.18.0
  nuxt: ^4.5.2
  # 4.11.1 (Patch: Link-Prefetch unter Nuxt 4.5, Table-colspan, Form-method) — 4.11.0 bringt USplitter (Werkstatt-Zonen im brand-Layer).
  '@nuxt/ui': ^4.11.1
  # EXAKT gepinnt, ohne Caret — und das ist hier keine Vorsicht, sondern die
  # Bedingung. Tiptap liegt bereits als auto-installierter optionaler Peer von
  # @nuxt/ui im Baum (3.27.1, genau eine Kopie je Paket). Wir nehmen NUR
  # `extension-mention` direkt auf, weil `UEditorMentionMenu` einen
  # Mention-Knoten einfügt und der von Haus aus zu `[@ id="…" label="…"]`
  # serialisiert — unser Parser reicht das roh durch. Der eigene
  # `renderMarkdown`-Handler (PostBodyEditor.vue) macht `@handle` daraus, und
  # `renderMarkdown` ist ein EXTENSION-FELD: `.configure()` erreicht es nicht,
  # nur `.extend()`. Darum die direkte Abhängigkeit.
  # EINE Caret-Range würde hier alles kaputt machen: `^3.27.1` erlaubt 3.28,
  # @nuxt/ui bliebe bei 3.27.1, und ZWEI Kopien von `@tiptap/core` heißen,
  # dass Tiptap Extensions aus der fremden Kopie nicht mehr erkennt. Bei einem
  # @nuxt/ui-Bump gehört diese Zeile mitgezogen — `pnpm check:single-copy`
  # (Liste enthält `@tiptap/core`) ist der Wächter.
  '@tiptap/extension-mention': 3.27.1
  # Bild-Naht Schritt 2 (C14). 2.2.1 (2026-11-06, GHSA-p5vf-pjf5-ggj3: Speicher-
  # fehler in der /_ipx-Route) haengt an h3 ^1.15.11 — die Linie, die
  # `overrides.h3` festhaelt — und an @nuxt/kit ^4.6.3, also EINE Kit-Linie
  # ueber unserem nuxt (4.5.x): das Modul bringt sein Kit als zweite Kopie
  # mit (Kompatibilitaet laut Modul-Meta `nuxt >=3.1.0`, Build + Provider-
  # Test gruen; `@nuxt/kit` steht bewusst nicht in check:single-copy). Die
  # Luecke selbst trifft dieses Repo nicht: `ipx` (und darueber `sharp`) ist
  # eine OPTIONALE Abhaengigkeit, unten ausgeschlossen, und wird nur vom
  # ipx-Anbieter gebraucht — dieses Repo transformiert in Appwrite, nicht
  # auf dem App-Server (Anbieter `appwrite` global in core/nuxt.config.ts).
  '@nuxt/image': ^2.2.1
  # MUSS zur Range von @nuxt/ui passen (4.11.0 verlangt ^4.3.2), sonst liegen
  # zwei Tailwind-Kopien im Baum. Steht hier, weil `tailwindcss` DIREKT gebraucht
  # wird: packages/core/app/assets/css/main.css und docs/app/assets/css/main.css
  # machen `@import "tailwindcss"`, und ein CSS-Import löst relativ zur DATEI auf
  # — also gegen packages/core/node_modules bzw. docs/node_modules. Nur transitiv
  # über @nuxt/ui reicht dafür nicht: je nach Hoisting landet tailwindcss allein
  # unter `.pnpm/node_modules/`, und dann wirft JEDER lokale Dev-Server auf JEDER
  # SSR-Seite 500 „Can't resolve 'tailwindcss'". Prod-Builds trifft es nicht —
  # der Defekt ist also nur lokal sichtbar und deshalb doppelt tückisch.
  tailwindcss: ^4.3.2
  '@nuxtjs/mdc': ^0.22.2
  # Fest gekoppelt: @pinia/nuxt 0.11.x verlangt pinia ^3, 1.0.x verlangt ^4 —
  # einzeln bewegt sich keines von beiden ohne unerfuellten Peer.
  '@pinia/nuxt': ^1.0.2
  pinia: ^4.0.3
  # MUSS zu dem mitwandern, was nuxt intern verlangt (4.5.1 → @vue/shared
  # ^3.5.40). Bleibt der Katalog darunter, hält pnpm für die Workspace-Pakete
  # die alte vue-Version und nuxt zieht daneben die neue: mit ZWEI vue-Kopien
  # läuft der Nitro-Externals-Tracer im Zyklus vue → @vue/server-renderer → vue
  # und der Prod-Build stirbt an ENAMETOOLONG.
  vue: ^3.5.42
  typescript: ^5.9.3
  vitest: ^4.1.11
  # GENAU GEPINNT, NICHT `^3.3.11` (2026-11-08, CI rot erwischt): 3.3.14
  # erzeugt für `reactive()`-Objekte im Template stellenweise `form.value.x`
  # und meldet dann TS2339 „Property 'value' does not exist" — sechsmal in
  # EventFormModal.vue, bei unverändertem Quelltext. Eine Caret-Range PINNT
  # NICHTS: Dependabot hob den Katalog auf `^3.3.11`, der nächste Lockfile-Lauf
  # zog 3.3.14, und damit war `main` rot, ohne dass jemand etwas am Code
  # geändert hatte. Beim nächsten Bump prüfen, ob der Fehler weg ist.
  vue-tsc: 3.3.11
  zod: ^4.5.4
  jiti: ^2.7.0
  nodemailer: ^10.3.1
  ioredis: ^6.0.0
  '@types/nodemailer': ^7.0.0
  stripe: ^18.0.0
  '@playwright/test': ^1.50.0
  # MMDB-Leser für die City-Auflösung der Session-IPs (server/utils/geoCity.ts).
  # Bewusst `mmdb-lib` und nicht `maxmind`: reines JavaScript, keine nativen
  # Abhängigkeiten und kein eigenes Datei-Handling — wir laden den Puffer
  # selbst und behalten damit die Kontrolle über Lazy-Load und Neu-Einlesen
  # nach dem monatlichen Datei-Tausch.
  mmdb-lib: ^3.0.3
  # Karten-Overlay der Sessions-Seite (SessionDetailsModal): ein Pin auf die
  # Koordinaten der Session-IP, Kacheln von OpenStreetMap — kein API-Key, kein
  # Konto, keine Abrechnung. Geladen wird Leaflet AUSSCHLIESSLICH per
  # dynamischem Import beim Öffnen des Dialogs: die Liste selbst bleibt damit
  # drittanbieterfrei, Kachel-Abrufe passieren erst nach einem bewussten Klick.
  leaflet: ^1.9.4
  '@types/leaflet': ^1.9.20
