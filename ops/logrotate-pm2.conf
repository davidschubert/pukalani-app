# Umlauf für die pm2-Logs der Apps (SE1 c, 2026-11-17) — VORLAGE.
#
# STAND: liegt im Repo, läuft auf dem Server noch NICHT. Einschalten ist ein
# Handgriff am Server (docs/runbooks/PRODUKTIONS-ALARM.md, „Umlauf der
# pm2-Logs") und braucht Davids Ja.
#
# Wozu: pm2 dreht seine Logs nicht selbst. Die zwei Dateien je Prozess
# (`<name>-out-<nr>.log`, `<name>-error-<nr>.log`) wachsen ohne Grenze, und
# daneben liegen die Dateien früherer Prozess-Nummern.
#
# 14 Tage: der laufende Tag und 13 ältere Dateien. Läuft als Benutzer `ploi`
# aus dessen crontab, wie der Umlauf des Zugriffs-Logs
# (ops/logrotate-admin-access.conf) — kein root, kein neues Paket.
#
# `copytruncate` statt Umbenennen: pm2 hält die Dateien offen (angehängt
# wird weiter an dieselbe Datei). Der Preis ist ein Augenblick, in dem eine
# Zeile verloren gehen kann.
#
# `delaycompress`: die gestrige Datei bleibt ungepackt (`.1`), ältere werden
# gepackt (`.2.gz` …). Das Zähl-Skript (ops/app-watch-counts.mjs) liest beide
# Formen — ohne das gälte nach dem ersten Umlauf jeder Tages-Lauf als „nie
# gelaufen".
#
# Das Muster trifft auch die Dateien früherer Prozess-Nummern: sie laufen
# einmal um, ihre Kopie fällt nach 14 Tagen weg (`maxage`); die leere Datei
# selbst bleibt liegen.
/home/ploi/.pm2/logs/*.log {
    daily
    rotate 13
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
