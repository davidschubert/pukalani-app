# DIE ERWARTETEN ZEITPLÄNE JE SERVER (OPS-003, 2026-11-16).
#
# Wozu: was auf den Servern nach Plan läuft, stand bis dahin nur dort — im
# crontab des Benutzers und in /etc/crontab (dorthin schreibt Ploi seine
# „Cronjobs"). Ein Zeitplan, der still verschwindet (das Backup), oder einer,
# den niemand mehr kennt, fiel keinem auf. ops/cron-check.sh vergleicht täglich
# beide Quellen mit dieser Liste: jeder erwartete Eintrag ist da, kein
# unbekannter dazu.
#
# Je Zeile, mit ` | ` getrennt:
#   <server> | <quelle> | <kennung> | <zeitplan> | <muster>
#   server    app-prod | appwrite-prod
#   quelle    benutzer  crontab von `ploi` (`crontab -l`)
#             system    /etc/crontab (von Ploi gepflegt; das Muster beginnt
#                       dort mit dem Benutzer, unter dem der Eintrag läuft)
#   kennung   kurzer Name, [a-z0-9-] — nur er erscheint in der Ausgabe
#   zeitplan  die fünf Felder oder `@reboot`, wörtlich — oder `beliebig`, wo
#             Ploi die Minute selbst würfelt
#   muster    erweiterter regulärer Ausdruck auf den Rest der Zeile (Befehl)
#
# KEINE WERTE: Umgebungs-Zuweisungen vor einem Befehl (Ordner, Ziel der
# Sicherung) stehen nicht hier, das Muster prüft nur Skript und Schalter.
#
# NEUER ZEITPLAN ⇒ erst hier eintragen und ausliefern, dann auf dem Server
# anlegen. ENTFERNTER ZEITPLAN ⇒ erst auf dem Server entfernen, dann hier.
# Sonst meldet der tägliche Blick einen Tag lang „unbekannt" oder „fehlt".

# ── App-Server ──────────────────────────────────────────────────────────────
# pm2 startet die sechs Apps nach einem Neustart des Rechners wieder.
app-prod | benutzer | pm2-resurrect | @reboot | pm2 resurrect$
# Zugriffs-Log der Betreiber-Seite und (seit 2026-11-17) die pm2-Logs der Apps: täglicher Umlauf, 14 Tage (ops/logrotate-admin-access.conf).
app-prod | benutzer | admin-log-umlauf | 12 3 * * * | /usr/sbin/logrotate --state /home/ploi/logs/nginx/logrotate\.state /home/ploi/admin\.pukalani\.app/ops/logrotate-admin-access\.conf$
# Ubuntu-Standard.
app-prod | system | cron-hourly | 17 * * * * | ^root cd / && run-parts --report /etc/cron\.hourly$
app-prod | system | cron-daily | 25 6 * * * | ^root test -x /usr/sbin/anacron \|\| \{ cd / && run-parts --report /etc/cron\.daily; \}$
app-prod | system | cron-weekly | 47 6 * * 7 | ^root test -x /usr/sbin/anacron \|\| \{ cd / && run-parts --report /etc/cron\.weekly; \}$
app-prod | system | cron-monthly | 52 6 1 * * | ^root test -x /usr/sbin/anacron \|\| \{ cd / && run-parts --report /etc/cron\.monthly; \}$
# Von Ploi angelegt.
app-prod | system | certbot-renew | beliebig | ^root /snap/bin/certbot renew > /home/ploi/\.ploi/certbot-renew\.log 2>&1$
app-prod | system | composer-self-update | beliebig | ^root /usr/local/bin/composer self-update > /home/ploi/\.ploi/composer-self-update\.log 2>&1$
app-prod | system | ploi-monitor | beliebig | ^ploi ploi-monitor > /home/ploi/\.ploi/scheduled-[0-9]+\.log 2>&1$
# Geo-Datenbank für den Standort einer Sitzung, monatlich (Skript liegt nur auf dem Server).
app-prod | system | geodb-update | 17 4 5 * * | ^ploi /home/ploi/geodb/update-geodb\.sh > /home/ploi/\.ploi/scheduled-[0-9]+\.log 2>&1$

# ── Appwrite-Server ─────────────────────────────────────────────────────────
# Realtime-Wächter (ops/realtime-watchdog.sh) und nächtliches Backup
# (ops/appwrite-backup.sh — OHNE `--run` sichert der Zeitplan nichts).
appwrite-prod | benutzer | realtime-watchdog | */5 * * * * | /home/ploi/ops/realtime-watchdog\.sh >> /home/ploi/ops/logs/realtime-watchdog\.log 2>&1$
appwrite-prod | benutzer | appwrite-backup | 30 3 * * * | /home/ploi/ops/appwrite-backup\.sh --run >> /home/ploi/ops/logs/appwrite-backup\.log 2>&1$
appwrite-prod | system | cron-hourly | 17 * * * * | ^root cd / && run-parts --report /etc/cron\.hourly$
appwrite-prod | system | cron-daily | 25 6 * * * | ^root test -x /usr/sbin/anacron \|\| \{ cd / && run-parts --report /etc/cron\.daily; \}$
appwrite-prod | system | cron-weekly | 47 6 * * 7 | ^root test -x /usr/sbin/anacron \|\| \{ cd / && run-parts --report /etc/cron\.weekly; \}$
appwrite-prod | system | cron-monthly | 52 6 1 * * | ^root test -x /usr/sbin/anacron \|\| \{ cd / && run-parts --report /etc/cron\.monthly; \}$
appwrite-prod | system | certbot-renew | beliebig | ^root /snap/bin/certbot renew > /home/ploi/\.ploi/certbot-renew\.log 2>&1$
appwrite-prod | system | composer-self-update | beliebig | ^root /usr/local/bin/composer self-update > /home/ploi/\.ploi/composer-self-update\.log 2>&1$
appwrite-prod | system | ploi-monitor | beliebig | ^ploi ploi-monitor > /home/ploi/\.ploi/scheduled-[0-9]+\.log 2>&1$
