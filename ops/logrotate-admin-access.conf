# Umlauf für das Zugriffs-Log der Betreiber-Seite (OPS-003, 2026-11-16).
#
# 14 Tage: der laufende Tag und 13 ältere Dateien. Läuft als Benutzer `ploi`
# aus dessen crontab (ops/cron.conf, Eintrag `admin-log-umlauf`) — der Umlauf
# des Systems unter /etc/logrotate.d braucht root und hebt 52 Tage auf.
#
# `copytruncate` statt Umbenennen: nginx hält die Datei offen, und das Signal
# zum Neu-Öffnen dürfte nur root schicken. Der Preis ist ein Augenblick, in
# dem eine Zeile verloren gehen kann — für eine Spur bei einem Vorfall ohne
# Belang.
/home/ploi/logs/nginx/admin.pukalani.app-access.log {
    daily
    rotate 13
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}

# Umlauf für die pm2-Logs der Apps (SE1 c, eingeschaltet am 2026-11-17 mit
# Davids Ja). Derselbe Lauf, derselbe Zeitplan (`admin-log-umlauf`), dieselbe
# Zustands-Datei — deshalb steht der Block in DIESER Datei: sie wird schon
# ausgeliefert und schon jede Nacht gefahren.
#
# Wozu: pm2 dreht seine Logs nicht selbst. Die zwei Dateien je Prozess
# (`<name>-out-<nr>.log`, `<name>-error-<nr>.log`) wuchsen ohne Grenze.
#
# 14 Tage: der laufende Tag und 13 ältere Dateien. `copytruncate`, weil pm2
# die Dateien offen hält und weiter an dieselbe Datei anhängt.
#
# `delaycompress`: die gestrige Datei bleibt ungepackt (`.1`), ältere werden
# gepackt (`.2.gz` …). Das Zähl-Skript (ops/app-watch-counts.mjs) liest beide
# Formen — ohne das gälte nach dem ersten Umlauf jeder Tages-Lauf als „nie
# gelaufen".
#
# Das Muster trifft auch die Dateien früherer Prozess-Nummern: sie laufen
# einmal um (`notifempty` lässt die leere Datei danach in Ruhe). Ihre Kopie
# `.1` bleibt liegen, weil `maxage` nur beim nächsten Umlauf derselben Datei
# greift — von Hand löschen, wenn sie stört.
/home/ploi/.pm2/logs/*.log {
    daily
    rotate 13
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
