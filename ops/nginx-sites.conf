# DIE SITES DES APP-SERVERS, WIE DER WEBSERVER SIE KENNEN SOLL (OPS-003, 2026-11-16).
#
# Wozu: ops/nginx-check.mjs vergleicht täglich jede nginx-Datei auf dem Server
# mit den Pflicht-Zeilen der Vorlagen (ops/nginx/). Dafür muss irgendwo stehen,
# welche Sites es geben soll, auf welchen Port sie zeigen und ob ein
# Zugriffs-Log gewollt ist — hier.
#
# Je Zeile: <site> <art> <port> <zugriffs-log>
#   site          Name der nginx-Datei = Name der Ploi-Site (ops/apps.conf)
#   art           pool           Wildcard-Site mit Kundendomains (Vorlage pool-site)
#                 einzel         eine App, feste Namen (Vorlage einzel-site)
#                 lange-routen   wie einzel, dazu ein Block mit längerer Frist
#   port          der Port der App (ops/ecosystem-<app>.config.cjs)
#   zugriffs-log  aus  `access_log off` (Standard)
#                 an   eigenes Log im Format pukalani_kurz, 14 Tage (nur die
#                      Betreiber-Seite — Davids Entscheidung 2026-11-16)
#
# NEUE SITE ⇒ erst hier eintragen, dann aus der Vorlage anlegen
# (docs/runbooks/NEUE-SITE.md). Ein Test hält Liste, ops/apps.conf und die
# Ports der Ecosystem-Dateien zusammen (packages/core/tests/nginxCheck.test.ts).

portfolio.pukalani.app   einzel         3002   aus
admin.pukalani.app       einzel         3003   an
platform.pukalani.app    pool           3004   aus
pukalani.app             einzel         3005   aus
help.pukalani.app        einzel         3006   aus
branding.supply          lange-routen   3007   aus
