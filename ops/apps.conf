# DIE EINE APP-LISTE DES AUSLIEFERNS (OPS-007, 2026-11-15).
#
# Zwei Leser, eine Quelle:
#   .github/workflows/deploy.yml   Job `plan` liest sie und reicht sie an
#                                  `build` und `deliver` weiter
#   ops/rollback.sh                der Rückweg vom eigenen Rechner aus
#
# Warum eine Datei: der Rückweg stand bis dahin als Satz im Runbook und
# nannte einen Prozess, den es seit drei Monaten nicht mehr gab. Der Weg nach
# vorn war nach jeder Umbenennung nachgezogen worden, der Weg zurück nie —
# weil seine Namen woanders standen. Was hier steht, gilt für beide.
#
# Je Zeile: <app> <site>
#   app   Ordner unter apps/ UND Verzeichnis der Stände auf dem Server
#         (/home/ploi/releases/<app>/<commit>, Verweis `current`) UND Teil des
#         Dateinamens ops/ecosystem-<app>.config.cjs
#   site  Verzeichnis auf dem Server (/home/ploi/<site>) UND der Host, unter
#         dem die App auf /api/health antwortet
#
# Der pm2-Prozess heißt IMMER wie die Site ohne Punkte (admin.pukalani.app →
# adminpukalaniapp). Das ist eine Regel, kein drittes Feld: so heißt er auch
# als `name:` in der Ecosystem-Datei. Der Test
# packages/core/tests/deployApps.test.ts hält Liste, Ecosystem-Dateien,
# deploy.yml und den Health-Wächter zusammen.
#
# Die Reihenfolge ist die Reihenfolge des Auslieferns. Neue App ⇒ HIER
# eintragen, nirgends sonst. Nur Kleinbuchstaben, Ziffern, Punkt, Bindestrich.

portfolio  portfolio.pukalani.app
control    admin.pukalani.app
platform   platform.pukalani.app
marketing  pukalani.app
help       help.pukalani.app
branding   branding.supply
