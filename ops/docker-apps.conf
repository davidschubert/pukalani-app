# Was das Backup des Docker-Servers sichert (ops/docker-apps-backup.sh).
#
# Eine Zeile je Abzug:
#   <name> <art> <compose-ordner> <compose-dienst|-> [angaben…]
#
# Arten:
#   postgres       `pg_dumpall` aus dem Dienst (alle Datenbanken und Rollen)
#   clickhouse     je Tabelle Bauanleitung und Daten aus dem Dienst
#   sqlite         Abzug einer SQLite-Datei; Angabe: Pfad vom Compose-Ordner aus
#   dateien        ein Ordner AUS dem Container des Dienstes; Angabe: der Pfad dort
#   einstellungen  Dateien aus dem Compose-Ordner (Dienst: -); `.env` und
#                  `docker-compose.yml` sind Pflicht, dazu alles, was der Stack
#                  aus seinem Ordner einbindet
#   ohne           Dienste dieses Ordners, die bewusst KEINEN eigenen Abzug
#                  bekommen (Dienst: -, danach die Namen) — mit Grund als
#                  Kommentar darüber
#
# JEDER Compose-Ordner auf dem Server und JEDER Dienst darin braucht hier eine
# Zeile; sonst bricht das Backup ab, statt etwas still auszulassen. Der <name>
# ist die Vorsilbe der Datei im Lauf (`<name>-<art>…`), je Name und Art eine Zeile.

# Plausible (Pukalani Analytics): Konten und Sites in Postgres, die Besuche in
# ClickHouse. Die Anwendung selbst hält nur einen Zwischenspeicher (Zeitzonen).
plausible einstellungen plausible_analytics - .env docker-compose.yml plausible-conf.env clickhouse-init.sql clickhouse
plausible postgres      plausible_analytics plausible_db
plausible clickhouse    plausible_analytics plausible_events_db
plausible ohne          plausible_analytics - plausible

# Chatwoot: alles in Postgres, hochgeladene Dateien im Ordner der Anwendung.
# sidekiq teilt sich diesen Ordner mit rails, `base` ist nur die gemeinsame
# Vorlage der beiden in der Compose-Datei; Redis hält nur Warteschlange und
# Zwischenspeicher.
chatwoot einstellungen chatwoot - .env docker-compose.yml
chatwoot postgres      chatwoot postgres
chatwoot dateien       chatwoot rails /app/storage
chatwoot ohne          chatwoot - base sidekiq redis

# Umami: alles in Postgres.
umami einstellungen umami_analytics - .env docker-compose.yml
umami postgres      umami_analytics postgres
umami ohne          umami_analytics - umami

# Shlink: eine SQLite-Datei im Ordner des Stacks. Die Geo-Datenbank daneben
# lädt Shlink selbst neu.
shlink einstellungen shlink_official - .env docker-compose.yml
shlink sqlite        shlink_official shlink data/database.sqlite
