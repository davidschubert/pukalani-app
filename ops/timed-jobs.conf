# DIE ERWARTETEN ZEIT-LÄUFE JE AUSGEROLLTER APP (OPS-011, 2026-11-16).
#
# Wozu: der tägliche Blick „In die App hinein" (scripts/ops/verify-app-signals.mjs)
# zählt auf dem Server die Zeilen `job.run` jedes Zeit-Laufs. Dass ein Lauf
# ÜBERFÄLLIG ist oder scheitert, sieht er an diesen Zeilen. Dass ein Lauf sich
# GAR NICHT MEHR MELDET (Plugin fällt aus dem Build, eine Env-Variable fehlt,
# ein Schalter steht auf `off`), sieht er nur, wenn irgendwo steht, dass es
# ihn geben sollte — hier.
#
# Je Zeile: <app> <kennung>
#   app      wie in ops/apps.conf — oder das Wort `nirgends` für einen Lauf,
#            den es im Code gibt, der aber heute in keiner ausgerollten App
#            fährt (sein Tor ist überall zu). So bleibt die Entscheidung
#            sichtbar, statt dass der Lauf einfach fehlt.
#   kennung  der `name` aus `defineTimedJob({ name: '…' })`
#
# Was hier steht, ist am 2026-11-16 an Production ABGELESEN (welche Läufe sich
# nach dem Start wirklich anmelden), nicht aus dem Code geraten: ob ein Lauf in
# einer App fährt, hängt an Toren, die nur der Server kennt (Mailer
# eingerichtet? Ablage gesetzt? Adresse für die Berechtigungen?).
#
# NEUER ZEIT-LAUF ⇒ hier eintragen, für jede App, in der er fahren soll. Zwei
# Tests halten die Liste: jede Kennung im Code steht hier und umgekehrt
# (packages/core/tests/verifyAppSignals.test.ts), und der Wächter-Test der
# Kennungen (packages/core/tests/timedJobGuard.test.ts). Ein Lauf, der läuft,
# aber hier fehlt, wird im täglichen Lauf berichtet, nicht rot.
#
# LAUF BEWUSST ABGESTELLT (Schalter auf `off`, Produkt aus einer App genommen)
# ⇒ die Zeile hier löschen, sonst meldet der Wächter ihn täglich als fehlend.

# Betreiber-Konsole (admin.pukalani.app)
control    trial-sweep
control    invite-request-prune
control    past-due-sweep
control    reporter-email-prune
control    health-sweep
control    run-retention
control    email-digest
control    gdpr-export-prune

# Pool-App (platform, account, alle Communities)
platform   label-reconcile
platform   past-due-notice
platform   guest-author-prune
platform   email-digest
platform   gdpr-export-prune
platform   event-reminders

# branding.supply
branding   guest-author-prune
branding   brand-events-sweep
branding   brand-check-erasure
branding   market-raw-text-sweep
branding   insights-radar
branding   insights-corrections-sweep
branding   insights-subscribers-sweep
branding   email-digest
# (kein gdpr-export-prune: branding.supply hat keine Ablage für Kopien
# gelöschter Konten, dort wird keine Kopie geschrieben)

# pukalani.studio (portfolio)
portfolio  email-digest
portfolio  gdpr-export-prune

# Landing (marketing) und Hilfe (help): kein Zeit-Lauf.

# Im Code, aber in keiner ausgerollten App angemeldet:
# die Adresse für die Berechtigungen (`entitlementsUrl`) ist nirgends gesetzt.
nirgends   entitlements-pull
