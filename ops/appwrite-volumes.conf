# DIE EINE VOLUME-LISTE DER APPWRITE-INSTANZ (OPS-001, 2026-11-15).
#
# Drei Leser, eine Quelle:
#   ops/appwrite-backup.sh                         sichert, was hier `ja` trägt
#   ops/appwrite-restore.sh                        spielt genau das zurück
#   scripts/ops/appwrite-mirror-prod-to-local.mjs  holt die Spalte `spiegeln`
#
# Warum eine Datei: bis dahin sicherte das Backup `uploads`, `config`,
# `functions`, der Spiegel holte `uploads`, `functions`, `builds`, `sites` —
# zwei Listen, keine vollständig, und niemand hatte entschieden, welche gilt.
#
# Je Zeile: <schlüssel> <sichern> <spiegeln>
#   schlüssel  der Name unter `volumes:` in der docker-compose.yml. Der ECHTE
#              Name des Volumes kommt aus `docker compose config` — nie aus
#              einer geratenen Vorsilbe: `appwrite-builds` heißt seit 2.7 auch
#              als Volume so, daneben liegt auf dem Server noch der alte Rest
#              `appwrite_appwrite-builds`.
#   sichern    ja | nein — gehört es ins nächtliche Backup?
#   spiegeln   ja | nein — holt es der Spiegel in die lokale Instanz?
#
# JEDES Volume der Compose-Datei steht hier, auch die mit `nein`: das
# Backup-Skript bricht ab, wenn die Compose-Datei ein Volume nennt, das diese
# Liste nicht kennt. Bringt eine neue Appwrite-Version ein Volume mit, wird das
# Backup rot, bis hier jemand entschieden hat — statt dass Daten still fehlen.
# Ein Eintrag mit `ja`, den es auf dem Server nicht gibt, ist ebenfalls ein
# Fehler; einer mit `nein` darf fehlen.
#
# Begründung je Zeile im Runbook docs/runbooks/APPWRITE-WIEDERHERSTELLUNG.md,
# Abschnitt „Was im Backup liegt". Kurzfassung als Kommentar:

# Hochgeladene Dateien aller Buckets (Avatare, Bilder, Exporte). Nicht neu erzeugbar.
appwrite-uploads        ja    ja
# Code von Functions und Sites, dazu die fertigen Builds (ohne sie müsste
# nach dem Zurückspielen alles neu gebaut werden).
appwrite-functions      ja    ja
appwrite-sites          ja    ja
appwrite-builds         ja    ja
# Zertifikat von api.pukalani.app samt Let's-Encrypt-Konto und die Traefik-
# Einstellungen dazu: damit antwortet ein neuer Server sofort per https,
# sobald die Adresse auf ihn zeigt. Lokal NICHT spiegeln — die lokale Instanz
# würde sonst eine Erneuerung für die Production-Adresse versuchen.
appwrite-certificates   ja    nein
appwrite-config         ja    nein

# Die Datenbank kommt als Dump ins Backup (in sich stimmig); das Volume einer
# laufenden Datenbank abzuziehen wäre es nicht.
appwrite-mariadb        nein  nein
# Zwischenspeicher und Warteschlangen — entstehen neu.
appwrite-redis          nein  nein
appwrite-cache          nein  nein
appwrite-imports        nein  nein
# Nutzungs-Statistik (Zähler für die Konsole). Kein Bestand: nach einer
# Wiederherstellung beginnen die Kurven neu.
appwrite-clickhouse     nein  nein
# Nur mit eingeschalteten Zusatzdiensten vorhanden (Embeddings, Runtimes);
# heruntergeladene Modelle und Paket-Cache, beides wiederholbar.
appwrite-models                  nein  nein
openruntimes-node-modules-cache  nein  nein
