# GEHEIMNIS-PRÜFUNG ÜBER ALLE ZWEIGE — einmal am Tag, als Hinweis.
#
# Die Pflicht-Prüfung `secrets` (lint.yml) liest seit dem 2026-11-18 nur noch
# die Historie des geprüften Zweigs (CW1 b, Davids Entscheidung): ein Fund in
# einem fremden Zweig soll nicht jeden Pull Request und jedes Ausliefern
# aufhalten. Damit ein Zweig, der nie ein Pull Request wird, trotzdem gelesen
# wird, liest dieser Lauf einmal am Tag ALLE Zweige und Tags.
#
# Er ist KEINE Pflicht-Prüfung und kein Tor: rot heißt ein Issue
# `geheimnis-alarm` (offen = Fund, der nächste grüne Lauf schließt es).
# Das Repo ist öffentlich — ein Wert, der hier gefunden wird, gilt als
# veröffentlicht: ein echtes Geheimnis wird ROTIERT, nicht nur gelöscht
# (docs/runbooks/CI-SCHLUESSEL-TAUSCHEN.md). Ein erfundener Testwert: Zweig
# auf origin löschen und sauber neu aufsetzen.
#
# Version und Prüfsumme von gitleaks stehen wortgleich in lint.yml; der Test
# `packages/core/tests/secretsWatchWorkflow.test.ts` hält beide zusammen.
#
# Von Hand: gh workflow run secrets-watch.yml
# Probealarm (nichts ist gefunden): gh workflow run secrets-watch.yml -f alarm_drill=true
name: Geheimnis-Prüfung (alle Zweige)

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      alarm_drill:
        description: 'Probealarm: tut so, als gäbe es einen Fund (öffnet oder bestätigt das Issue)'
        type: boolean
        default: false

# Rechte stehen je Job (SEC-041): ohne eigene Angabe hat ein Job keine.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # fetch-depth 0 holt die ganze Historie ALLER Zweige und Tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks holen (gepinnt, Prüfsumme)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Ohne --log-opts liest gitleaks `--all`: jeden Zweig, jedes Tag.
      # `--redact` ist Pflicht: auch dieses Protokoll ist öffentlich.
      - name: gitleaks (alle Zweige und Tags)
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 .'

  alarm:
    runs-on: ubuntu-latest
    needs: [scan]
    if: always() && !cancelled() && github.event.repository.fork == false
    # Kein Checkout, kein Secret: nur Issues lesen und schreiben.
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: geheimnis-alarm
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.scan.result }}
      DRILL: ${{ inputs.alarm_drill && 'ja' || 'nein' }}
      ALARM_ASSIGNEE: ${{ github.repository_owner }}
    steps:
      - name: Issue öffnen, bestätigen oder schließen
        run: |
          # STRENG: bricht dieser Schritt ab, ist der Lauf rot — ein kaputter
          # Alarmweg darf nicht grün aussehen.
          set -euo pipefail
          stand=$(date -u '+%Y-%m-%d %H:%M UTC')
          case "$RESULT" in
            success) zustand=gruen ;;
            failure) zustand=rot ;;
            *) zustand=unklar ;;
          esac
          if [ "$DRILL" = "ja" ]; then zustand=rot; fi
          if [ "$zustand" = "unklar" ]; then
            echo "Ergebnis des Laufs: $RESULT — kein Alarm, keine Entwarnung."
            exit 0
          fi
          gh label create "$LABEL" --color B60205 --description 'Die Geheimnis-Prüfung über alle Zweige ist rot' >/dev/null 2>&1 || true
          nummer=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          hinweis=''
          if [ "$DRILL" = "ja" ]; then hinweis=' (PROBEALARM — nichts ist gefunden)'; fi
          if [ "$zustand" = "rot" ]; then
            if [ -z "$nummer" ]; then
              {
                echo "Die tägliche Geheimnis-Prüfung über alle Zweige ist rot$hinweis."
                echo
                echo "- Lauf: $RUN_URL"
                echo "- Stand: $stand"
                echo
                echo 'Was zu tun ist: den Lauf öffnen. Er nennt Datei, Zeile, Regel und Commit; der Wert selbst ist geschwärzt. Zuerst klären, ob es ein echtes Geheimnis ist. Ein echtes wird ROTIERT (das Repo ist öffentlich, der Wert gilt als bekannt) — erst danach wird aufgeräumt. Ein erfundener Testwert: den Zweig auf origin löschen und sauber neu aufsetzen.'
                echo
                echo 'Die Pflicht-Prüfung je Pull Request liest nur den eigenen Zweig; dieser Lauf hält nichts auf. Das Issue schließt sich von selbst, sobald der Lauf wieder grün ist.'
              } > /tmp/issue-body.md
              gh issue create --title "Geheimnis-Prüfung rot: Fund in einem Zweig$hinweis" --label "$LABEL" --assignee "$ALARM_ASSIGNEE" --body-file /tmp/issue-body.md
            else
              gh issue comment "$nummer" --body "Weiter rot$hinweis ($stand). Lauf: $RUN_URL" >/dev/null
              echo "Alarm-Issue #$nummer bestätigt."
            fi
          elif [ -n "$nummer" ]; then
            gh issue comment "$nummer" --body "✅ Entwarnung ($stand): die Geheimnis-Prüfung über alle Zweige ist wieder grün. Lauf: $RUN_URL" >/dev/null
            gh issue close "$nummer" --reason completed >/dev/null
            echo "Alarm-Issue #$nummer geschlossen."
          else
            echo 'Grün, kein offenes Alarm-Issue.'
          fi
