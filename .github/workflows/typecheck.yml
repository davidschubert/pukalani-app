name: Typecheck

on:
  push:
    branches: [main, dev]
  pull_request:

# Rechte stehen je Job (SEC-041): ohne eigene Angabe hat ein Job keine.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Auf `main` nicht abbrechen — Begründung steht in e2e.yml (dort ist es am
  # 2026-08-18 aufgeschlagen: fünf abgeräumte Läufe hintereinander, das Gate
  # war nicht rot, sondern stumm).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Workspace-Filter: läuft rekursiv in allen Packages mit typecheck-Script
      - run: pnpm -r typecheck
