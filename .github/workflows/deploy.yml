# Deploy nach PHASE-17-Plan (A.5), seit 2026-07-23 als CI-BUILD-DEPLOY:
# GitHub Actions BAUT alle Apps und schiebt nur das fertige .output per
# rsync auf den Server (Symlink-Flip + pm2 reload wie bei ZDT Stufe 2).
# Der App-Server (CX23, 2 Cores / 3,7 GB) baut damit NICHTS mehr — die
# frühere RAM-Regel (nie zwei Nuxt-Builds parallel, OOM-Kill 137, 3584-MB-
# Heap für platform) betrifft nur noch den ploi-Webhook-FALLBACK (s. u.).
#
# Liefert NUR aus, wenn Test, Lint, Typecheck UND E2E für denselben Commit
# auf main grün sind. Seit 2026-11-13 ersetzt das den Beschluss A.10 #9
# („lint/typecheck bleiben Warnlampen"; Davids Entscheidung 2026-11-12,
# DECISION-LOG): im Lint-Lauf fahren inzwischen die Wächter des Projekts
# (Manifeste, Datentür-Regel, eine Kopie je Kernabhängigkeit, …) — eine
# Prüfung, die eine Projektregel sichert, muss das Ausliefern aufhalten,
# nicht nur melden. `workflow_dispatch` als manueller Hebel bleibt.
#
# Zugang: dedizierter SSH-Deploy-Key (Repo-Secret PLOI_SSH_KEY, ploi-User,
# authorized_keys auf app-prod); Host-Key ist unten GEPINNT (kein blindes
# ssh-keyscan zur Laufzeit). Ohne Secret ist der Deploy ein no-op.
#
# FALLBACK (Server baut selbst): die ploi-Deploy-Scripts der 4 Sites sind
# unverändert funktionsfähig — im Notfall (Actions down) in ploi den
# Deploy-Button drücken oder die Webhooks feuern
# (Secrets PLOI_DEPLOY_WEBHOOK_* existieren weiter, werden hier aber
# nicht mehr benutzt).
#
# Env Vars (NUXT_APPWRITE_KEY etc.) leben als Server-.env je Site —
# NIE im Repo; ploi „Quick Deploy" bleibt AUS.
#
# TLS der Landing (geloest 2026-07-27): der Apex braucht auf diesem Server
# KEIN Zertifikat mehr. Er laeuft als EINZIGER Host der Zone proxied ueber
# Cloudflare (Browser sieht das Cloudflare-Zertifikat), der Zonen-Modus ist
# fest auf "Full" gepinnt. Damit fasst ein Landing-Deploy die geteilte
# certbot-Lineage /etc/letsencrypt/live/pukalani.app (= das Wildcard-
# Zertifikat ALLER Kundenhosts) nie an. Regel: auf der ploi-Site pukalani.app
# NIEMALS "Add certificate"/"Force-renew" druecken — Details in
# docs/content/2.architektur/6.hosts-und-ports.md.
#
# Doku-Skip: ein main-Push mit AUSSCHLIESSLICH Doku-/CI-/Meta-Änderungen
# (docs/**, spikes/**, .github/**, *.md, …) baut identischen App-Output —
# der changes-Step vergleicht den auf Prod deployten Commit gegen den neuen
# Stand und überspringt dann. FAIL-SAFE: bei unbekanntem Prod-SHA, nicht
# auflösbarem Diff oder workflow_dispatch wird IMMER deployt.

name: Deploy

on:
  # Feuert, wenn Test ODER E2E fertig ist — deployt aber erst, wenn ALLE VIER
  # Prüfungen (Test, Lint, Typecheck, E2E) für denselben Commit grün sind
  # (Vorprüfung im Job `gate`). Vorher hing der Deploy nur an `Test`: am
  # 2026-07-30 ging Etappe A der Umbenennung damit live, obwohl der E2E zwei
  # Läufe lang rot war (das Embed-Widget fand sein iframe nicht). Ein
  # Sicherheitsnetz, das man umgehen kann, ist keins.
  # Lint und Typecheck sind BEWUSST keine Auslöser (2026-11-13): die
  # Vorprüfung pollt alle vier, ein Auslöser reicht — zwei weitere brächten
  # je Push nur zwei weitere „cancelled"-Läufe. Folge: wird eine rote Prüfung
  # nachträglich per „Re-run" grün, feuert hier nichts neu. Dann den
  # zugehörigen Deploy-Lauf per „Re-run all jobs" neu starten (die
  # Vorprüfung liest den neuen Stand) — oder den manuellen Hebel nehmen.
  workflow_run:
    workflows: [Test, 'E2E (Appwrite)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Für die Vorprüfung: den Ausgang der ANDEREN Workflows desselben Commits
  # nachschlagen.
  actions: read

concurrency:
  group: deploy-sites
  cancel-in-progress: false

env:
  SERVER: 49.13.211.173
  SERVER_HOSTKEY: '49.13.211.173 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAVud82T4BSPvg5wH84jnRuP+JdG2hP52FAf+h9ckcCe'

jobs:
  # ── Vorprüfung: ALLE VIER Prüf-Workflows müssen für DIESEN Commit grün sein ─
  # (Test, Lint, Typecheck, E2E; bis 2026-11-13 nur Test UND E2E.)
  # Der Auslöser feuert zweimal (einmal je Test/E2E). Jeder der beiden Läufe
  # WARTET hier, bis alle vier fertig sind (s. u.); der erste liefert aus, der
  # zweite wird von der concurrency-Gruppe verdrängt („cancelled") oder findet
  # im Job `deploy` denselben Build schon live und überspringt. Deshalb ist
  # das hier idempotent und deployt trotzdem nur EINMAL.
  gate:
    runs-on: ubuntu-latest
    # ÖFFENTLICHES REPO (seit 2026-08-03): `workflow_run` feuert AUCH für
    # Prüfläufe fremder Pull Requests, und der Filter `branches: [main]` greift
    # dabei auf den HEAD-Branch des Auslösers — ein Fork, dessen Branch „main"
    # heißt, passiert ihn. Der Deploy läuft aber im Kontext DIESES Repos, also
    # MIT `PLOI_SSH_KEY`. Ohne die beiden Zusatzbedingungen könnte ein Fremder
    # damit eigenen Code auf den Produktionsserver schieben.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push')
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Sind Test, Lint, Typecheck UND E2E grün?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # Der manuelle Hebel bleibt bewusst ohne Vorprüfung — er ist der
          # Notausgang, wenn die CI selbst klemmt.
          if [ "$MANUAL" = "true" ]; then
            echo "Manueller Start — Vorprüfung übersprungen."
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # WARTEN STATT EINMAL SCHAUEN (2026-08-13, nach VIER stillen Skips —
          # AH-3, AH-7, AH-4, AP2): der Auslöser feuert je Prüf-Workflow einmal.
          # Der FRÜHE Trigger sah den anderen Lauf „läuft-noch" und stieg mit
          # go=false aus; der SPÄTE Trigger kam gar nicht erst an, sobald der
          # überholte Prüflauf von einem schnellen Folge-Push CANCELLED wurde —
          # die if-Bedingung des Jobs verlangt conclusion == success. Ergebnis:
          # NIEMAND deployte, und „Deploy: success" im Lauf-Fazit sah trotzdem
          # grün aus (der Job war nur geskippt). Deshalb POLLT die Vorprüfung
          # jetzt bis zu 30 Minuten: ein einziger Trigger reicht, egal in
          # welcher Reihenfolge die Prüfungen fertig werden. Ein CANCELLED
          # bleibt ein ehrliches Nein — dieser Commit wurde überholt, der
          # Nachfolger bringt seinen eigenen Deploy mit.
          go=false
          for versuch in $(seq 1 60); do
            offen=false; rot=false
            for wf in "Test" "Lint" "Typecheck" "E2E (Appwrite)"; do
              concl=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                --jq "[.workflow_runs[] | select(.name==\"$wf\")] | sort_by(.created_at) | last | .conclusion // \"läuft-noch\"")
              echo "  [$versuch] $wf: $concl"
              case "$concl" in
                success) ;;
                läuft-noch) offen=true ;;
                *) rot=true ;;
              esac
            done
            if [ "$rot" = "true" ]; then break; fi
            if [ "$offen" = "false" ]; then go=true; break; fi
            sleep 30
          done
          if [ "$go" = "true" ]; then
            echo "✔ Alle vier grün für $SHA — Deploy startet."
          else
            echo "⏸ Nicht alle vier grün für $SHA (rot/abgebrochen/Timeout) — kein Deploy."
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.go == 'true'
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # DIE EINE APP→HOST-LISTE (2026-09-01). Sie speist BEIDE Schritte, die
      # Hosts kennen muessen: die Change-Detection („welcher Build laeuft wo?")
      # und die Auslieferung („wohin rsyncen, wen fragen?"). Genau eine zweite,
      # getrennt gepflegte Liste war die Luecke, durch die branding gefallen
      # ist: die Auslieferung kannte den Host, die Diff-Basis nicht — und was
      # keine Diff-Basis ist, kann auch nie als „haengt zurueck" auffallen.
      # Neue App ⇒ HIER eintragen, nirgends sonst.
      APP_HOSTS: 'portfolio=portfolio.pukalani.app control=admin.pukalani.app platform=platform.pukalani.app marketing=pukalani.app help=help.pukalani.app branding=branding.supply'
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      # Zweiter, unabhängiger Riegel: egal wie der Lauf zustande kam — was
      # nicht auf origin/main liegt, wird nicht ausgeliefert. Das hält auch
      # dann, wenn jemand die Auslöser-Bedingung oben später aufweicht.
      - name: Gehört dieser Commit zu main?
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "::error::$EXPECTED_SHA liegt NICHT auf origin/main — Deploy abgebrochen."
            exit 1
          fi
          echo "✔ $EXPECTED_SHA ist Teil von origin/main."

      # Nur-Doku/CI/Meta-Änderungen erkennen → Deploy überspringen.
      - name: Deploy nötig?
        id: changes
        run: |
          set -u
          IGNORE='^(docs/|spikes/|\.github/|\.claude/|\.codex/|.*\.md$|LICENSE$|\.gitignore$|\.editorconfig$)'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manueller Trigger — deploye immer."
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # DIE DIFF-BASIS IST DER ÄLTESTE LEBENDE BUILD, NICHT EIN HOST
          # (2026-09-01, beim Erst-Deploy von branding.supply live erwischt).
          # Vorgeschichte: hier stand bis F3 (2026-08-12) comments.pukalani.app,
          # danach platform.pukalani.app — immer EIN Host, der stellvertretend
          # für „was läuft auf Prod?" befragt wurde.
          # Der Vorfall: der Schritt „Ausliefern + verifizieren" deployt die Apps
          # SEQUENZIELL (portfolio control platform marketing help branding). Der
          # Lauf starb bei der LETZTEN App an einem rsync-Fehler (fehlender
          # Release-Slot, inzwischen per --mkpath gefixt) — NACHDEM platform
          # schon auf den neuen SHA geflippt war. Ab da meldete die Diff-Basis
          # den neuen Stand, jeder Folge-Push sah „nur Doku geändert" und
          # übersprang: branding blieb dauerhaft 502, bis ein manueller
          # workflow_dispatch nachhalf. Die concurrency ist NICHT die Ursache
          # (cancel-in-progress: false — ein laufender Deploy wird nie gekippt);
          # jeder Abbruch mitten in der Schleife reicht, rot ODER Runner-Ausfall.
          # Die Regel deshalb: JEDER Host aus APP_HOSTS wird gefragt, und der
          # ÄLTESTE gemeldete Build ist die Basis — eine zurückgebliebene App
          # zieht den Vergleich damit selbst zurück. Meldet ein Host gar keinen
          # im Repo auflösbaren Commit (leer, 502, Timeout, Erst-Deploy einer
          # neuen App), wird sofort deployt statt gerätselt (fail-open).
          BASE=''
          FAIL=''
          for pair in $APP_HOSTS; do
            app="${pair%%=*}"; host="${pair#*=}"
            BUILD=$(curl -fsS -m 15 "https://$host/api/health" | jq -r '.build // empty' || true)
            echo "  $app ($host): ${BUILD:-n/a}"
            if [ -z "$BUILD" ] || ! git cat-file -e "${BUILD}^{commit}" 2>/dev/null; then
              FAIL="$app meldet keinen im Repo auflösbaren Build ('${BUILD:-n/a}')"
              break
            fi
            if [ -z "$BASE" ]; then
              BASE="$BUILD"
            elif git merge-base --is-ancestor "$BUILD" "$BASE"; then
              BASE="$BUILD"
            elif git merge-base --is-ancestor "$BASE" "$BUILD"; then
              : # BASE ist schon der ältere — nichts zu tun.
            else
              # Zwei Builds ohne Vorfahren-Beziehung. Auf main kann das nicht
              # vorkommen; wenn doch, ist die Annahme kaputt und nicht der Diff.
              FAIL="$app meldet $BUILD, das mit $BASE nicht vergleichbar ist"
              break
            fi
          done
          if [ -n "$FAIL" ]; then
            echo "$FAIL — deploye sicherheitshalber."
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Älteste lebende Diff-Basis: $BASE"
          FILES=$(git diff --name-only "$BASE" "$EXPECTED_SHA" || true)
          if [ -z "$FILES" ]; then
            echo "Keine Datei-Änderungen ggü. der Basis ($BASE) — nichts zu deployen."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RELEVANT=$(echo "$FILES" | grep -vE "$IGNORE" || true)
          # AUSNAHME von der docs/-Ignorierung: docs/content/ ist seit control/docs
          # (2026-07-28) Teil des control-BUILDS (Nuxt Content bettet die interne
          # Doku ins Server-Bundle ein) — Aenderungen dort MUESSEN deployen, sonst
          # bleibt admin.pukalani.app/docs veraltet. grep -E kennt keine
          # Lookaheads, deshalb hier explizit zurueckgeholt statt im IGNORE-Regex.
          DOCS_CONTENT=$(echo "$FILES" | grep -E '^docs/content/' || true)
          RELEVANT=$(printf '%s\n%s\n' "$RELEVANT" "$DOCS_CONTENT" | grep -v '^$' || true)
          if [ -z "$RELEVANT" ]; then
            echo "Nur Doku/CI/Meta geändert — Deploy übersprungen:"; echo "$FILES" | sed 's/^/  /'
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "App-relevante Änderungen — deploye:"; echo "$RELEVANT" | sed 's/^/  /'
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH einrichten (gepinnter Host-Key)
        if: steps.changes.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.PLOI_SSH_KEY }}
        run: |
          set -u
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret PLOI_SSH_KEY fehlt — CI-Build-Deploy kann nicht ausliefern."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_HOSTKEY" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User ploi\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' "$SERVER" >> ~/.ssh/config

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.changes.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # FONT-CACHE VOM SERVER (2026-08-11, vier rote Deploys an einem Tag):
      # @nuxt/fonts löst Google-Font-URLs beim Build LIVE auf, und Googles
      # CDN/Metadaten liefen auseinander — die Runner bekamen tote URLs
      # (FetchError 404 auf fonts.gstatic), während dieselbe Auflösung von
      # anderswo funktionierte. Der Cache (…/node_modules/.cache/nuxt/fonts)
      # trägt BEIDES: die WOFF2s UND die aufgelösten Metadaten (meta/*-data
      # .json) — gesät ist der Build für bekannte Familien komplett offline.
      # Gespeist wird er vom Prod-Server (~/fonts-cache), NICHT von
      # actions/cache: das Seed kam von einer Maschine mit gesunder Auflösung,
      # und genau das darf ein Runner nie überschreiben — deshalb unten das
      # RÜCKSCHREIBEN NUR ADDITIV (--ignore-existing): neue Familien kommen
      # dazu, eine vom Runner stale aufgelöste Datei ersetzt nie eine gute.
      # Fail-soft (|| true): ohne Cache baut es wie bisher — nur eben mit
      # Google-Risiko.
      - name: Font-Cache herstellen
        if: steps.changes.outputs.skip != 'true'
        run: |
          set -eu
          for app in portfolio control platform marketing help branding; do
            mkdir -p "apps/$app/node_modules/.cache/nuxt/fonts"
            rsync -a "prod:/home/ploi/fonts-cache/" "apps/$app/node_modules/.cache/nuxt/fonts/" || true
          done

      # Alle Apps auf DIESEM Runner bauen (sequenziell, 4c/16GB — kein
      # Server-RAM-Druck mehr), dann je App ausliefern + verifizieren.
      - name: Apps bauen
        if: steps.changes.outputs.skip != 'true'
        run: |
          set -eu
          for app in portfolio control platform marketing help branding; do
            echo "::group::Build $app"
            pnpm --filter "$app" build
            echo "::endgroup::"
          done

      # ZWEI Durchgänge mit Grund (Krümel vom 2026-08-12 — der Seed wäre am
      # 2026-08-18 still verfallen): die unifont-METADATEN tragen eine
      # 7-Tage-TTL (`expires`), und --ignore-existing erneuert sie nie — nach
      # Ablauf löste jeder Build wieder LIVE gegen Google auf, das
      # gstatic-404-Risiko wäre zurück. Deshalb dürfen NUR die Metadaten
      # (meta/**-data.json) aktualisieren; die WOFF2-Blobs bleiben strikt
      # additiv (eine stale Runner-Auflösung ersetzt nie eine gute Datei).
      # Gefahrlos, weil dieser Schritt NACH einem GRÜNEN Build läuft — wessen
      # Auflösung scheiterte, dessen Deploy stirbt vorher.
      - name: Font-Cache zurückschreiben (Blobs additiv, Metadaten aktualisierend)
        if: steps.changes.outputs.skip != 'true'
        run: |
          for app in portfolio control platform marketing help branding; do
            rsync -a --ignore-existing "apps/$app/node_modules/.cache/nuxt/fonts/" "prod:/home/ploi/fonts-cache/" || true
            rsync -a --include='meta/' --include='meta/**' --exclude='*' "apps/$app/node_modules/.cache/nuxt/fonts/" "prod:/home/ploi/fonts-cache/" || true
          done

      - name: Ausliefern + verifizieren (rsync → Symlink-Flip → pm2 reload)
        if: steps.changes.outputs.skip != 'true'
        run: |
          set -eu
          # SITE  = ploi-Site: VERZEICHNIS auf dem Server (/home/ploi/$site/ops)
          #         und Quelle des pm2-Prozessnamens.
          # SLOT  = Release-Verzeichnis unter /home/ploi/releases.
          # PROBE = der HOST, unter dem die App oeffentlich antwortet.
          #
          # Die App→Host-Zuordnung kommt aus $APP_HOSTS (Job-env, ganz oben) —
          # DIESELBE Liste, die auch die Change-Detection abfragt. Nie eine
          # zweite hier anlegen: genau daran ist branding am 2026-09-01
          # unsichtbar zurueckgeblieben. Die Reihenfolge der Auslieferung ist
          # die Reihenfolge der Liste.
          #
          # CONTROL heisst seit 2026-08-18 auch als ploi-SITE `admin.pukalani.app`
          # (Davids Panel-Umbenennung; ploi benennt dabei das Server-Verzeichnis
          # mit um) — SITE und PROBE sind damit wieder fuer ALLE Apps identisch.
          # Der SLOT bleibt `control` (Release-Verzeichnisse wechseln beim Rename
          # nicht mit), ebenso das Appwrite-Projekt. Den pm2-Prozess hat der
          # Rename mitgezogen (Name = Site ohne Punkte): die Ecosystem-Datei
          # heisst jetzt `adminpukalaniapp`, und pm2-heal.sh loescht den
          # Vorgaenger `controlpukalaniapp` EINMALIG vor dem startOrReload —
          # ohne das starteten zwei Prozesse auf einem Port (studio→control-
          # Falle, gemessen 6:4 bei 10 Aufrufen; die Serien-Probe unten ist
          # dafuer der Beweis). Der 301-Altname `control.pukalani.app` ist seit
          # demselben Tag BEWUSST aufgegeben: der Host faellt in die Wildcard-
          # Site platform und antwortet 404 (Davids Entscheidung, s. CLAUDE.md
          # AH-4b und DECISION-LOG).
          #
          # BRANDING (2026-08-31) ist die erste App AUSSERHALB der Zone
          # pukalani.app: Site, Slot und Probe heissen `branding.supply` bzw.
          # `branding`, der pm2-Prozess `brandingsupply` (Site ohne Punkte, wie
          # ueberall). Ihr nginx proxyt auf Port 3007 — NICHT auf den DEV-Port
          # 3006 der App: das ist die Portkarte des SERVERS, und dort haelt
          # help seit 2026-07-28 die 3006 (Begruendung in
          # ops/ecosystem-branding.config.cjs).
          declare -A SLOT=( [portfolio]=portfolio [control]=control [platform]=platform [marketing]=marketing [help]=help [branding]=branding )
          for pair in $APP_HOSTS; do
            app="${pair%%=*}"
            site="${pair#*=}"
            # Seit AH-4b (s. o.) ist der PROBE-Host fuer JEDE App identisch mit
            # ihrer Site — kein eigenes Array mehr, das auseinanderlaufen kann.
            probe="$site"
            echo "::group::Deploy $app → $site"
            RELEASES="/home/ploi/releases/${SLOT[$app]}"
            RELEASE="$RELEASES/$EXPECTED_SHA"
            # --mkpath, weil rsync sonst nur die LETZTE Pfadebene anlegt: beim
            # Erst-Deploy einer neuen App existiert /home/ploi/releases/<slot>
            # noch nicht und der Lauf stirbt mit "mkdir … failed: No such file
            # or directory" (branding, 2026-09-01 live erwischt — die Slots der
            # Alt-Apps existieren nur historisch).
            rsync -az --delete --mkpath "apps/$app/.output/" "prod:$RELEASE/"
            # ops-Configs liefert die CI selbst aus (rsync) — frueher hielt ein
            # `git pull` im Site-Checkout sie aktuell, aber ein voller Monorepo-
            # Checkout auf dem Server nur fuer zwei Config-Dateien ist keiner
            # mehr wert: die control-Site hat seit dem Cutover bewusst keinen,
            # die help-Site (2026-07-28) genauso.
            # (Die uebrigen Sites behalten ihre Checkouts fuer den ploi-
            # FALLBACK-Deploy — der macht sein eigenes git pull. Fuer control,
            # help und branding gibt es diesen Fallback bewusst nicht; Ersatz
            # sind die Runbooks docs/runbooks/CONTROL-CUTOVER.md,
            # HELP-GO-LIVE.md bzw. BRANDING-SUPPLY-SETUP.md.)
            rsync -az ops/ "prod:/home/ploi/$site/ops/"
            # Flip + Reload (ZDT Stufe 2). pm2 startOrReload findet den Prozess
            # ueber den NAMEN in der Ecosystem-Datei — bei einer Umbenennung
            # ersetzt es also NICHT, sondern startet daneben (zwei Prozesse,
            # ein Port, gemischte Builds — passiert beim studio→control-Rename,
            # gemessen 6:4 bei 10 Aufrufen). Darum unten die Serien-Probe.
            # MERKE fuer kuenftige Umzuege: pm2 reload behaelt den GESPEICHERTEN
            # Script-Pfad — ein Pfadwechsel in der Ecosystem-Datei kommt per
            # reload nie an (der Prozess serviert weiter den alten Build, die
            # Serien-Probe unten faengt es). Dann braucht es EINMALIG
            # `pm2 delete <name>` vor dem startOrReload.
            PROC=$(echo "$site" | tr -d .)
            # Der pm2-Prozessname ist IMMER die Site ohne Punkte (so heissen
            # sie in den Ecosystem-Dateien: portfolio.pukalani.app →
            # portfoliopukalaniapp, pukalani.app → pukalaniapp). Nicht aus dem
            # App-Namen zusammensetzen — bei marketing waere daraus
            # "marketingpukalaniapp" geworden und der Heiler haette still
            # nichts gefunden.
            # pm2-heal.sh (3. Falle, 2026-07-26): loescht den Prozess vorab,
            # wenn er errored ist oder sein eingefrorener cwd nicht mehr
            # existiert (Erststart-Shell-cwd zeigte auf die geloeschte
            # studio-Site → spawn-ENOENT, portfolio down). Ecosystem-Dateien
            # setzen seitdem cwd: CURRENT — der Heiler bleibt als Backstop.
            ssh prod "set -eu
              # certbot-Webroot sicherstellen (2026-08-13, erster Pool-Tenant):
              # Tenant-/Alias-Zertifikate legen ihre ACME-Prüfdatei in
              # /home/ploi/<site>/public — das Verzeichnis existiert bei
              # CI-deployten Sites sonst nie, und ploi meldet nur
              # 'does not exist or is not a directory' im Site-Log.
              mkdir -p '/home/ploi/$site/public'
              ln -s '$RELEASE' '$RELEASES/current.tmp'
              mv -Tf '$RELEASES/current.tmp' '$RELEASES/current'
              bash /home/ploi/$site/ops/pm2-heal.sh $PROC
              pm2 startOrReload /home/ploi/$site/ops/ecosystem-$app.config.cjs --update-env
              pm2 save
              ls -1dt $RELEASES/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
              echo '$app geflippt auf $EXPECTED_SHA'"
            echo "::endgroup::"

            # DREI Treffer in Folge, nicht einer. Eine einzelne Abfrage beweist
            # nur, dass IRGENDEIN Prozess hinter dem Host den neuen Build hat —
            # nicht, dass alle ihn haben. Genau daran ist der Rename-Deploy
            # vorbeigelaufen: zwei Prozesse auf einem Port, einer alt, und die
            # erste Abfrage traf zufaellig den neuen.
            echo "[$app] Erwarte Commit $EXPECTED_SHA auf https://$probe/api/health (3x in Folge) …"
            ok=""; streak=0
            for i in $(seq 1 20); do
              BUILD=$(curl -fsS -m 15 "https://$probe/api/health" | jq -r '.build // empty' || true)
              if [ "$BUILD" = "$EXPECTED_SHA" ]; then
                streak=$((streak + 1))
                if [ "$streak" -ge 3 ]; then
                  echo "[$app] ✔ Prod läuft durchgängig auf $BUILD"; ok=1; break
                fi
                echo "[$app]   ($i/20) Treffer $streak/3 …"
              else
                [ "$streak" -gt 0 ] && echo "[$app]   ($i/20) Serie gerissen — '$BUILD' statt $EXPECTED_SHA (mehrere Prozesse am Port?)"
                streak=0
                echo "[$app]   ($i/20) Prod meldet '${BUILD:-n/a}' — warte 5 s …"
              fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "::error::[$app] Prod hat $EXPECTED_SHA nicht stabil erreicht — pm2 list prüfen (verwaister Prozess am selben Port?)."
              exit 1
            fi
          done

      # TLS-Nachkontrolle: liefert JEDER Host noch ein passendes Zertifikat?
      # Die Health-Probe oben prüft nur die Hosts, die gerade deployt wurden —
      # ein zerschossenes Zertifikat auf einem ANDEREN Host (geteilte
      # certbot-Lineage, Vorfall 2026-07-27) bliebe sonst unentdeckt.
      # Läuft auch, wenn ein App-Schritt vorher rot war: dann ist die
      # TLS-Aussage besonders wichtig.
      - name: TLS aller Hosts prüfen
        if: always() && steps.changes.outputs.skip != 'true'
        run: node scripts/ops/verify-tls.mjs
