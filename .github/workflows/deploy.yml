# Deploy nach PHASE-17-Plan (A.5), seit 2026-07-23 als CI-BUILD-DEPLOY:
# GitHub Actions BAUT alle Apps und schickt nur das fertige .output auf den
# Server (Symlink-Flip + pm2 reload wie bei ZDT Stufe 2). Die Handgriffe dort
# macht seit 2026-11-18 EIN Skript, `ops/app-release.sh` (CI1 b) — der
# Workflow schickt nur noch dessen Worte, keine freien Befehle und kein rsync.
# Der App-Server (CX23, 2 Cores / 3,7 GB) baut damit NICHTS mehr — die
# frühere RAM-Regel (nie zwei Nuxt-Builds parallel, OOM-Kill 137, 3584-MB-
# Heap für platform) betrifft nur noch den ploi-Webhook-FALLBACK (s. u.).
#
# Liefert NUR aus, wenn Test, Lint, Typecheck UND E2E für denselben Commit
# auf main grün sind. Seit 2026-11-13 ersetzt das den Beschluss A.10 #9
# („lint/typecheck bleiben Warnlampen"; Davids Entscheidung 2026-11-12,
# DECISION-LOG): im Lint-Lauf fahren inzwischen die Wächter des Projekts
# (Manifeste, Datentür-Regel, eine Kopie je Kernabhängigkeit, …) — eine
# Prüfung, die eine Projektregel sichert, muss das Ausliefern aufhalten,
# nicht nur melden. `workflow_dispatch` als manueller Hebel bleibt.
#
# Zugang: eigener SSH-Schlüssel NUR für das Ausliefern (Secret
# DEPLOY_SSH_KEY in der Umgebung `production`, die nur den Zweig `main`
# zulässt; auf app-prod als ploi-User mit `restrict` in authorized_keys). Die
# Wächter haben einen anderen (production-watch.yml). Der Host-Key ist unten
# GEPINNT (kein blindes ssh-keyscan zur Laufzeit). Ohne Secret wird der Lauf
# rot. Schlüssel tauschen: docs/runbooks/CI-SCHLUESSEL-TAUSCHEN.md
#
# SCHLECHTER STAND LIVE (OPS-007, 2026-11-15) — drei Wege, in dieser Reihenfolge:
#   1. `ops/rollback.sh <app> <commit> --apply` vom eigenen Rechner: stellt eine
#      App auf einen Stand zurück, der noch auf dem Server liegt. Ohne GitHub.
#   2. Manueller Start MIT der Eingabe `sha` (s. `workflow_dispatch` unten):
#      baut und liefert einen älteren Commit von main auf alle Apps aus.
#   3. `git revert` auf main — sonst liefert der nächste Push (auch ein reiner
#      Doku-Push) wieder den schlechten Stand aus.
# Anleitung, Grenzen und das Protokoll der Übung:
# docs/runbooks/DEPLOYMENT.md, Abschnitt „Schlechter Stand live".
#
# FALLBACK (Server baut selbst, wenn GitHub Actions ausfällt): nur für die
# zwei Sites, die auf dem Server noch einen Checkout haben (portfolio,
# platform — Deploy-Knopf im ploi-Panel; nachgesehen 2026-11-15, Stand der
# Checkouts 2026-07-26, seit Juli nicht mehr benutzt). Für control,
# marketing, help und branding gibt es ihn nicht — dort bleibt der Rückweg
# aus Punkt 1.
#
# Env Vars (NUXT_APPWRITE_KEY etc.) leben als Server-.env je Site —
# NIE im Repo; ploi „Quick Deploy" bleibt AUS.
#
# TLS der Landing (geloest 2026-07-27): der Apex braucht auf diesem Server
# KEIN Zertifikat mehr. Er laeuft als EINZIGER Host der Zone proxied ueber
# Cloudflare (Browser sieht das Cloudflare-Zertifikat), der Zonen-Modus ist
# fest auf "Full" gepinnt. Damit fasst ein Landing-Deploy die geteilte
# certbot-Lineage /etc/letsencrypt/live/pukalani.app (= das Wildcard-
# Zertifikat ALLER Kundenhosts) nie an. Regel: auf der ploi-Site pukalani.app
# NIEMALS "Add certificate"/"Force-renew" druecken — Details in
# docs/content/2.architektur/6.hosts-und-ports.md.
#
# Doku-Skip: ein main-Push mit AUSSCHLIESSLICH Doku-/CI-/Meta-Änderungen
# (docs/**, .github/**, *.md, …) baut identischen App-Output —
# der changes-Step vergleicht den auf Prod deployten Commit gegen den neuen
# Stand und überspringt dann. FAIL-SAFE: bei unbekanntem Prod-SHA, nicht
# auflösbarem Diff oder workflow_dispatch wird IMMER deployt.

name: Deploy

on:
  # Feuert, wenn Test ODER E2E fertig ist — deployt aber erst, wenn ALLE VIER
  # Prüfungen (Test, Lint, Typecheck, E2E) für denselben Commit grün sind
  # (Vorprüfung im Job `gate`). Vorher hing der Deploy nur an `Test`: am
  # 2026-07-30 ging Etappe A der Umbenennung damit live, obwohl der E2E zwei
  # Läufe lang rot war (das Embed-Widget fand sein iframe nicht). Ein
  # Sicherheitsnetz, das man umgehen kann, ist keins.
  # Lint und Typecheck sind BEWUSST keine Auslöser (2026-11-13): die
  # Vorprüfung pollt alle vier, ein Auslöser reicht — zwei weitere brächten
  # je Push nur zwei weitere „cancelled"-Läufe. Folge: wird eine rote Prüfung
  # nachträglich per „Re-run" grün, feuert hier nichts neu. Dann den
  # zugehörigen Deploy-Lauf per „Re-run all jobs" neu starten (die
  # Vorprüfung liest den neuen Stand) — oder den manuellen Hebel nehmen.
  workflow_run:
    workflows: [Test, 'E2E (Appwrite)']
    types: [completed]
    branches: [main]
  # MANUELLER START. Ohne Eingabe: die Spitze des gewählten Zweigs (wie
  # bisher). Mit `sha`: genau dieser Commit — der Weg zu einem ÄLTEREN Stand
  # (OPS-007). Der Riegel im Job `plan` bleibt: was nicht auf main liegt, wird
  # nicht ausgeliefert. Die Vorprüfung entfällt beim manuellen Start (Notausgang).
  #   gh workflow run deploy.yml -f sha="$(git rev-parse <commit>)"
  workflow_dispatch:
    inputs:
      sha:
        description: 'Älteren Stand ausliefern: vollständiger Commit von main (40 Zeichen). Leer = Spitze von main.'
        required: false
        type: string
        default: ''

# Rechte stehen je Job (SEC-041): ohne eigene Angabe hat ein Job keine.
permissions: {}

concurrency:
  group: deploy-sites
  cancel-in-progress: false

env:
  SERVER: 49.13.211.173
  SERVER_HOSTKEY: '49.13.211.173 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAVud82T4BSPvg5wH84jnRuP+JdG2hP52FAf+h9ckcCe'
  # WAS ausgeliefert wird: der Commit des auslösenden Prüflaufs, beim
  # manuellen Start die Eingabe `sha`, sonst die Spitze des Zweigs.
  EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha || github.sha }}
  # WIE DER SERVER GEBAUT IST (App-Liste, ops/, TLS-Liste): derselbe Commit —
  # AUSSER beim manuellen Start mit einem älteren `sha`. Dann kommt nur das
  # PROGRAMM vom alten Commit; Site-Namen, Prozessnamen und Ecosystem-Dateien
  # kommen von der Spitze von main. Ein alter Commit kennt womöglich noch
  # einen Prozess, den es nicht mehr gibt — pm2 startete ihn DANEBEN (zwei
  # Prozesse, ein Port). Genau so war der Rückweg schon einmal abgehängt.
  OPS_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # DAS FESTE SKRIPT AUF DEM SERVER (CI1 b, 2026-11-18): Quelle
  # `ops/app-release.sh`, von Hand eingespielt (docs/runbooks/
  # CI-SCHLUESSEL-TAUSCHEN.md, „Feste Befehle auf app-prod"). Es trägt die
  # Handgriffe des Auslieferns (Stand empfangen, Verweis umlegen, pm2 neu
  # laden, aufräumen) — dieselbe Datei, die der Rückweg `ops/rollback.sh`
  # mitschickt. Der Workflow ruft es MIT seinem Pfad auf: so ist die
  # Befehlszeile dieselbe, ob der Schlüssel frei ist oder das Skript sein
  # fester Befehl (dann steht sie in SSH_ORIGINAL_COMMAND).
  RELEASE_SCRIPT: /home/ploi/ops/app-release.sh
  # Was je Site nach <site>/ops geht, neben `ecosystem-<app>.config.cjs`. Das
  # Skript nimmt nur Namen von seiner eigenen Liste an (`OPS_FILES` dort) —
  # NEUE DATEI ⇒ dort eintragen und das Skript neu einspielen, sonst lehnt der
  # Server die Lieferung ab (Test: packages/core/tests/appReleaseScript.test.ts).
  OPS_FILES: 'pm2-heal.sh app-watch-counts.mjs nginx-check.mjs nginx-sites.conf cron-check.sh cron.conf logrotate-admin-access.conf'
  # Dazu zwei Prüf-Skripte des täglichen Wächters aus scripts/ops/ (CI1 a):
  # sie lesen nur und geben nur Namen und Zahlen aus. Bis dahin kopierten sie
  # sich bei jedem Wächter-Lauf selbst auf den Server.
  WATCH_FILES: 'verify-stale-keys.mjs verify-instance-admins.mjs'
  # DIE EINE APP→HOST-LISTE steht seit 2026-11-15 in `ops/apps.conf` (vorher
  # hier als Workflow-Variable). Der Job `plan` liest sie und reicht sie als
  # `APP_HOSTS` (Paare `app=site`) an `build` und `deliver` weiter; der
  # Rückweg `ops/rollback.sh` liest dieselbe Datei. Sie speist ALLE Schritte,
  # die Hosts kennen müssen — auch die Change-Detection: eine zweite,
  # getrennt gepflegte Liste war die Lücke, durch die branding am 2026-09-01
  # gefallen ist (die Auslieferung kannte den Host, die Diff-Basis nicht).
  # Neue App ⇒ in ops/apps.conf eintragen, nirgends sonst.

jobs:
  # ── Vorprüfung: ALLE VIER Prüf-Workflows müssen für DIESEN Commit grün sein ─
  # (Test, Lint, Typecheck, E2E; bis 2026-11-13 nur Test UND E2E.)
  # Der Auslöser feuert zweimal (einmal je Test/E2E). Jeder der beiden Läufe
  # WARTET hier, bis alle vier fertig sind (s. u.); der erste liefert aus, der
  # zweite wird von der concurrency-Gruppe verdrängt („cancelled") oder findet
  # im Job `deploy` denselben Build schon live und überspringt. Deshalb ist
  # das hier idempotent und deployt trotzdem nur EINMAL.
  gate:
    runs-on: ubuntu-latest
    # Nur lesen, was die ANDEREN Workflows desselben Commits ergeben haben.
    permissions:
      actions: read
    # ÖFFENTLICHES REPO (seit 2026-08-03): `workflow_run` feuert AUCH für
    # Prüfläufe fremder Pull Requests, und der Filter `branches: [main]` greift
    # dabei auf den HEAD-Branch des Auslösers — ein Fork, dessen Branch „main"
    # heißt, passiert ihn. Der Deploy läuft aber im Kontext DIESES Repos, also
    # MIT dem Ausliefer-Schlüssel. Ohne die beiden Zusatzbedingungen könnte ein
    # Fremder damit eigenen Code auf den Produktionsserver schieben.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push')
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Sind Test, Lint, Typecheck UND E2E grün?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # Der manuelle Hebel bleibt bewusst ohne Vorprüfung — er ist der
          # Notausgang, wenn die CI selbst klemmt.
          if [ "$MANUAL" = "true" ]; then
            echo "Manueller Start — Vorprüfung übersprungen."
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # WARTEN STATT EINMAL SCHAUEN (2026-08-13, nach VIER stillen Skips —
          # AH-3, AH-7, AH-4, AP2): der Auslöser feuert je Prüf-Workflow einmal.
          # Der FRÜHE Trigger sah den anderen Lauf „läuft-noch" und stieg mit
          # go=false aus; der SPÄTE Trigger kam gar nicht erst an, sobald der
          # überholte Prüflauf von einem schnellen Folge-Push CANCELLED wurde —
          # die if-Bedingung des Jobs verlangt conclusion == success. Ergebnis:
          # NIEMAND deployte, und „Deploy: success" im Lauf-Fazit sah trotzdem
          # grün aus (der Job war nur geskippt). Deshalb POLLT die Vorprüfung
          # jetzt bis zu 30 Minuten: ein einziger Trigger reicht, egal in
          # welcher Reihenfolge die Prüfungen fertig werden. Ein CANCELLED
          # bleibt ein ehrliches Nein — dieser Commit wurde überholt, der
          # Nachfolger bringt seinen eigenen Deploy mit.
          go=false
          for versuch in $(seq 1 60); do
            offen=false; rot=false
            for wf in "Test" "Lint" "Typecheck" "E2E (Appwrite)"; do
              concl=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                --jq "[.workflow_runs[] | select(.name==\"$wf\")] | sort_by(.created_at) | last | .conclusion // \"läuft-noch\"")
              echo "  [$versuch] $wf: $concl"
              case "$concl" in
                success) ;;
                läuft-noch) offen=true ;;
                *) rot=true ;;
              esac
            done
            if [ "$rot" = "true" ]; then break; fi
            if [ "$offen" = "false" ]; then go=true; break; fi
            sleep 30
          done
          if [ "$go" = "true" ]; then
            echo "✔ Alle vier grün für $SHA — Deploy startet."
          else
            echo "⏸ Nicht alle vier grün für $SHA (rot/abgebrochen/Timeout) — kein Deploy."
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  # ── Plan: gehört der Commit zu main, und gibt es etwas auszuliefern? ─────
  # Ohne Secret. Entscheidet für ALLE folgenden Jobs, ob sie laufen.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: gate
    if: needs.gate.outputs.go == 'true'
    outputs:
      skip: ${{ steps.changes.outputs.skip }}
      app_hosts: ${{ steps.apps.outputs.app_hosts }}
    steps:
      # VOR dem Checkout: die Eingabe ist freier Text. Nur ein vollständiger
      # Commit kommt weiter — kein Zweigname, kein Kürzel (die Build-Kennung
      # in /api/health ist der vollständige Commit, ein Kürzel träfe nie).
      - name: Eingabe prüfen (manueller Start)
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_SHA" ]; then
            echo "Keine Eingabe — ausgeliefert wird die Spitze des Zweigs ($GITHUB_SHA)."
            exit 0
          fi
          if ! printf '%s' "$INPUT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Die Eingabe sha muss ein vollständiger Commit sein (40 Zeichen aus 0-9 a-f): git rev-parse <commit>"
            exit 1
          fi
          echo "Eingabe: ausgeliefert wird $INPUT_SHA (ops/ und App-Liste von $GITHUB_SHA)."

      - name: Repo auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0


      # Zweiter, unabhängiger Riegel: egal wie der Lauf zustande kam — was
      # nicht auf origin/main liegt, wird nicht ausgeliefert. Das hält auch
      # dann, wenn jemand die Auslöser-Bedingung oben später aufweicht.
      - name: Gehört dieser Commit zu main?
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          # Beide: der Commit, der ausgeliefert wird, UND der, von dem ops/
          # und die App-Liste kommen (beim manuellen Start die Spitze des
          # gewählten Zweigs — ein Arbeitszweig fällt hier durch).
          for sha in "$EXPECTED_SHA" "$OPS_REF"; do
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::$sha liegt NICHT auf origin/main — Deploy abgebrochen."
              exit 1
            fi
            echo "✔ $sha ist Teil von origin/main."
          done

      # DIE EINE APP-LISTE (ops/apps.conf, je Zeile `<app> <site>`) → Paare
      # `app=site`. Gelesen aus OPS_REF (s. Kopf), nicht aus dem Arbeitsbaum:
      # beim Ausliefern eines älteren Commits gilt die Liste von HEUTE.
      - name: App-Liste lesen (ops/apps.conf)
        id: apps
        run: |
          set -euo pipefail
          LIST=$(git show "$OPS_REF:ops/apps.conf" | sed -e 's/#.*//' | awk '
            NF == 0 { next }
            NF != 2 { bad = 1; exit }
            { printf "%s%s=%s", sep, $1, $2; sep = " " }
            END { if (bad) exit 3 }') || LIST=''
          if ! printf '%s' "$LIST" | grep -Eq '^[a-z0-9-]+=[a-z0-9.-]+( [a-z0-9-]+=[a-z0-9.-]+)*$'; then
            echo "::error::ops/apps.conf ist nicht lesbar (erwartet je Zeile: <app> <site>)."
            exit 1
          fi
          echo "Apps: $LIST"
          echo "app_hosts=$LIST" >> "$GITHUB_OUTPUT"
          echo "APP_HOSTS=$LIST" >> "$GITHUB_ENV"

      # Nur-Doku/CI/Meta-Änderungen erkennen → Deploy überspringen.
      - name: Deploy nötig?
        id: changes
        run: |
          set -u
          IGNORE='^(docs/|\.github/|\.claude/|\.codex/|.*\.md$|LICENSE$|\.gitignore$|\.editorconfig$)'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manueller Trigger — deploye immer."
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # DIE DIFF-BASIS IST DER ÄLTESTE LEBENDE BUILD, NICHT EIN HOST
          # (2026-09-01, beim Erst-Deploy von branding.supply live erwischt).
          # Vorgeschichte: hier stand bis F3 (2026-08-12) comments.pukalani.app,
          # danach platform.pukalani.app — immer EIN Host, der stellvertretend
          # für „was läuft auf Prod?" befragt wurde.
          # Der Vorfall: der Schritt „Ausliefern + verifizieren" deployt die Apps
          # SEQUENZIELL (portfolio control platform marketing help branding). Der
          # Lauf starb bei der LETZTEN App an einem rsync-Fehler (fehlender
          # Release-Slot, inzwischen per --mkpath gefixt) — NACHDEM platform
          # schon auf den neuen SHA geflippt war. Ab da meldete die Diff-Basis
          # den neuen Stand, jeder Folge-Push sah „nur Doku geändert" und
          # übersprang: branding blieb dauerhaft 502, bis ein manueller
          # workflow_dispatch nachhalf. Die concurrency ist NICHT die Ursache
          # (cancel-in-progress: false — ein laufender Deploy wird nie gekippt);
          # jeder Abbruch mitten in der Schleife reicht, rot ODER Runner-Ausfall.
          # Die Regel deshalb: JEDER Host aus APP_HOSTS wird gefragt, und der
          # ÄLTESTE gemeldete Build ist die Basis — eine zurückgebliebene App
          # zieht den Vergleich damit selbst zurück. Meldet ein Host gar keinen
          # im Repo auflösbaren Commit (leer, 502, Timeout, Erst-Deploy einer
          # neuen App), wird sofort deployt statt gerätselt (fail-open).
          BASE=''
          FAIL=''
          for pair in $APP_HOSTS; do
            app="${pair%%=*}"; host="${pair#*=}"
            BUILD=$(curl -fsS -m 15 "https://$host/api/health" | jq -r '.build // empty' || true)
            echo "  $app ($host): ${BUILD:-n/a}"
            if [ -z "$BUILD" ] || ! git cat-file -e "${BUILD}^{commit}" 2>/dev/null; then
              FAIL="$app meldet keinen im Repo auflösbaren Build ('${BUILD:-n/a}')"
              break
            fi
            if [ -z "$BASE" ]; then
              BASE="$BUILD"
            elif git merge-base --is-ancestor "$BUILD" "$BASE"; then
              BASE="$BUILD"
            elif git merge-base --is-ancestor "$BASE" "$BUILD"; then
              : # BASE ist schon der ältere — nichts zu tun.
            else
              # Zwei Builds ohne Vorfahren-Beziehung. Auf main kann das nicht
              # vorkommen; wenn doch, ist die Annahme kaputt und nicht der Diff.
              FAIL="$app meldet $BUILD, das mit $BASE nicht vergleichbar ist"
              break
            fi
          done
          if [ -n "$FAIL" ]; then
            echo "$FAIL — deploye sicherheitshalber."
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Älteste lebende Diff-Basis: $BASE"
          FILES=$(git diff --name-only "$BASE" "$EXPECTED_SHA" || true)
          if [ -z "$FILES" ]; then
            echo "Keine Datei-Änderungen ggü. der Basis ($BASE) — nichts zu deployen."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RELEVANT=$(echo "$FILES" | grep -vE "$IGNORE" || true)
          # AUSNAHME von der docs/-Ignorierung: docs/content/ ist seit control/docs
          # (2026-07-28) Teil des control-BUILDS (Nuxt Content bettet die interne
          # Doku ins Server-Bundle ein) — Aenderungen dort MUESSEN deployen, sonst
          # bleibt admin.pukalani.app/docs veraltet. grep -E kennt keine
          # Lookaheads, deshalb hier explizit zurueckgeholt statt im IGNORE-Regex.
          DOCS_CONTENT=$(echo "$FILES" | grep -E '^docs/content/' || true)
          RELEVANT=$(printf '%s\n%s\n' "$RELEVANT" "$DOCS_CONTENT" | grep -v '^$' || true)
          if [ -z "$RELEVANT" ]; then
            echo "Nur Doku/CI/Meta geändert — Deploy übersprungen:"; echo "$FILES" | sed 's/^/  /'
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "App-relevante Änderungen — deploye:"; echo "$RELEVANT" | sed 's/^/  /'
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ── DER SCHLÜSSEL LIEGT NIE NEBEN FREMDEM CODE (SEC-042, 2026-11-14) ─────
  # Bis dahin war das EIN Job: der Schlüssel zum Server lag auf der Platte,
  # während `pnpm install` und sechs Builds liefen — alles, was dabei
  # ausgeführt wird (Build-Werkzeuge, Module, deren Abhängigkeiten), konnte ihn
  # lesen. Jetzt sind es drei Jobs auf drei frischen Maschinen:
  #   fonts    MIT Schlüssel, ohne Checkout und ohne Installieren: holt nur den
  #            Font-Cache vom Server und reicht ihn als Artefakt weiter.
  #   build    OHNE jedes Secret: installiert, baut, packt die sechs `.output`.
  #   deliver  MIT Schlüssel, ohne `pnpm` und ohne `node_modules`: entpackt
  #            und liefert aus.
  # Der Schlüssel steht in der Umgebung `production`; die lässt nur den Zweig
  # `main` zu (SEC-041). Ein Lauf von einem anderen Zweig bekommt ihn nicht.
  # Die Artefakte eines öffentlichen Repos sind für jedes angemeldete
  # GitHub-Konto abrufbar: sie enthalten nur, was sich aus dem öffentlichen
  # Repo ohnehin bauen lässt (der Build läuft ohne `.env`, die Geheimnisse der
  # Apps liegen ausschließlich auf dem Server). Deshalb darf hier NIE ein
  # Secret oder eine `.env` in den Build-Job wandern.
  #
  # FONT-CACHE VOM SERVER (2026-08-11, vier rote Deploys an einem Tag):
  # @nuxt/fonts löst Google-Font-URLs beim Build LIVE auf, und Googles
  # CDN/Metadaten liefen auseinander — die Runner bekamen tote URLs
  # (FetchError 404 auf fonts.gstatic), während dieselbe Auflösung von
  # anderswo funktionierte. Der Cache (…/node_modules/.cache/nuxt/fonts)
  # trägt BEIDES: die WOFF2s UND die aufgelösten Metadaten (meta/*-data
  # .json) — gesät ist der Build für bekannte Familien komplett offline.
  # Gespeist wird er vom Prod-Server (~/fonts-cache), NICHT von
  # actions/cache: das Seed kam von einer Maschine mit gesunder Auflösung,
  # und genau das darf ein Runner nie überschreiben — deshalb unten das
  # RÜCKSCHREIBEN NUR ADDITIV (--ignore-existing): neue Familien kommen
  # dazu, eine vom Runner stale aufgelöste Datei ersetzt nie eine gute.
  # Fail-soft (|| true): ohne Cache baut es wie bisher — nur eben mit
  # Google-Risiko.
  fonts:
    runs-on: ubuntu-latest
    permissions: {}
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    environment:
      name: production
      # Nur die Secrets der Umgebung, kein Eintrag in der Deployment-Liste —
      # den schreibt der Job `deliver`.
      deployment: false
    steps:
      - name: SSH einrichten (gepinnter Host-Key)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -u
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY fehlt in der Umgebung production — CI-Build-Deploy kann nicht ausliefern."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_HOSTKEY" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User ploi\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' "$SERVER" >> ~/.ssh/config

      # Fail-soft (|| true): ohne Cache baut es wie bisher — nur eben mit
      # Google-Risiko. Das Archiv entsteht IMMER (notfalls leer), sonst fände
      # der Build-Job kein Artefakt und der Deploy stünde.
      - name: Font-Cache vom Server holen
        run: |
          set -eu
          ssh prod "$RELEASE_SCRIPT fonts-get" </dev/null > fonts-seed.tar || true
          # Kein lesbares Archiv ⇒ ein leeres: der Build läuft dann ohne Cache.
          tar -tf fonts-seed.tar >/dev/null 2>&1 || tar -cf fonts-seed.tar -T /dev/null

      # Der Schlüssel verlässt die Platte, bevor der nächste fremde Baustein
      # (hier: die Artefakt-Action) läuft — und auch dann, wenn ein Schritt
      # davor rot wurde.
      - name: Schlüssel von der Platte nehmen
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fonts-seed
          path: fonts-seed.tar
          retention-days: 1
          overwrite: true

  build:
    runs-on: ubuntu-latest
    # KEIN `environment`, KEIN `secrets.` — siehe Kopf oben.
    permissions:
      contents: read
    needs: [plan, fonts]
    if: needs.plan.outputs.skip != 'true'
    env:
      APP_HOSTS: ${{ needs.plan.outputs.app_hosts }}
    steps:
      # Ohne `fetch-depth: 0`: der Build liest nur `git rev-parse HEAD` (die
      # Build-Kennung in /api/health), und HEAD ist genau dieser Commit.
      - name: Repo auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fonts-seed
          path: ${{ runner.temp }}/fonts-seed

      - name: Font-Cache herstellen
        run: |
          set -eu
          for pair in $APP_HOSTS; do
            app="${pair%%=*}"
            mkdir -p "apps/$app/node_modules/.cache/nuxt/fonts"
            tar -C "apps/$app/node_modules/.cache/nuxt/fonts" -xf "$RUNNER_TEMP/fonts-seed/fonts-seed.tar"
          done

      # Alle Apps auf DIESEM Runner bauen (sequenziell, 4c/16GB — kein
      # Server-RAM-Druck mehr), dann je App ausliefern + verifizieren.
      - name: Apps bauen
        run: |
          set -eu
          for pair in $APP_HOSTS; do
            app="${pair%%=*}"
            echo "::group::Build $app"
            pnpm --filter "$app" build
            echo "::endgroup::"
          done

      # Je App EIN tar: die Artefakt-Ablage behält weder Dateirechte noch
      # Symlinks, ein tar schon — auf dem Server kommt damit byte-genau an,
      # was vorher direkt aus dem Build-Verzeichnis rsynct wurde. Der
      # Font-Cache reist mit, damit `deliver` ihn zurückschreiben kann.
      - name: Ergebnis packen
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          for pair in $APP_HOSTS; do
            app="${pair%%=*}"
            test -f "apps/$app/.output/server/index.mjs" || { echo "::error::apps/$app/.output fehlt nach dem Build."; exit 1; }
            tar -C "apps/$app" -cf - .output | zstd -T0 -3 -q -o "$RUNNER_TEMP/out/$app.tar.zst"
            tar -C "apps/$app/node_modules/.cache/nuxt" -cf "$RUNNER_TEMP/out/$app.fonts.tar" fonts
          done
          ls -lh "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: ${{ runner.temp }}/out
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    environment: production
    env:
      APP_HOSTS: ${{ needs.plan.outputs.app_hosts }}
    steps:
      # Nur `ops/` (Ecosystem-Dateien, pm2-heal.sh) — aus git, nicht aus dem
      # Build-Artefakt: was auf dem Server AUSGEFÜHRT wird, kommt nicht durch
      # den Job, der fremden Code laufen lässt. Aus OPS_REF (s. Kopf): beim
      # Ausliefern eines älteren Commits bleiben die Ecosystem-Dateien die
      # von heute.
      - name: ops/ auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.OPS_REF }}
          # Ohne Kegel-Modus, mit Anker: `ops` allein träfe auch scripts/ops/.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ops/
            /scripts/ops/verify-stale-keys.mjs
            /scripts/ops/verify-instance-admins.mjs
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: ${{ runner.temp }}/out

      # Entpackt wird hier nichts mehr: die Archive gehen so, wie der Build sie
      # gepackt hat, an das Skript auf dem Server (`release-put`, `fonts-put`).
      - name: Sind alle Archive da?
        run: |
          set -euo pipefail
          for pair in $APP_HOSTS; do
            app="${pair%%=*}"
            test -s "$RUNNER_TEMP/out/$app.tar.zst" || { echo "::error::Das Archiv von $app fehlt im Build-Ergebnis."; exit 1; }
            test -s "$RUNNER_TEMP/out/$app.fonts.tar" || { echo "::error::Der Font-Cache von $app fehlt im Build-Ergebnis."; exit 1; }
          done
          for file in $OPS_FILES; do test -f "ops/$file" || { echo "::error::ops/$file fehlt."; exit 1; }; done
          for file in $WATCH_FILES; do test -f "scripts/ops/$file" || { echo "::error::scripts/ops/$file fehlt."; exit 1; }; done

      # AB HIER liegt der Schlüssel auf der Platte — und ab hier läuft nur
      # noch ssh, tar, curl und jq. Kein `pnpm`, kein `node`, keine weitere
      # Action.
      - name: SSH einrichten (gepinnter Host-Key)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -u
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY fehlt in der Umgebung production — CI-Build-Deploy kann nicht ausliefern."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_HOSTKEY" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User ploi\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' "$SERVER" >> ~/.ssh/config

      # ZWEI Durchgänge mit Grund (Krümel vom 2026-08-12 — der Seed wäre am
      # 2026-08-18 still verfallen): die unifont-METADATEN tragen eine
      # 7-Tage-TTL (`expires`), und --ignore-existing erneuert sie nie — nach
      # Ablauf löste jeder Build wieder LIVE gegen Google auf, das
      # gstatic-404-Risiko wäre zurück. Deshalb dürfen NUR die Metadaten
      # (meta/**-data.json) aktualisieren; die WOFF2-Blobs bleiben strikt
      # additiv (eine stale Runner-Auflösung ersetzt nie eine gute Datei).
      # Gefahrlos, weil dieser Schritt NACH einem GRÜNEN Build läuft — wessen
      # Auflösung scheiterte, dessen Deploy stirbt vorher.
      - name: Font-Cache zurückschreiben (Blobs additiv, Metadaten aktualisierend)
        run: |
          for pair in $APP_HOSTS; do
            app="${pair%%=*}"
            # Die zwei Durchgänge macht das Skript auf dem Server (Wort `fonts-put`).
            ssh prod "$RELEASE_SCRIPT fonts-put" < "$RUNNER_TEMP/out/$app.fonts.tar" || true
          done

      - name: Ausliefern + verifizieren (Stand schicken → Symlink-Flip → pm2 reload)
        run: |
          set -eu
          # SITE  = ploi-Site: VERZEICHNIS auf dem Server (/home/ploi/$site/ops)
          #         und Quelle des pm2-Prozessnamens.
          # SLOT  = Release-Verzeichnis unter /home/ploi/releases — heisst
          #         IMMER wie die App (Regel aus ops/apps.conf).
          # PROBE = der HOST, unter dem die App oeffentlich antwortet.
          #
          # Die App→Host-Zuordnung kommt aus $APP_HOSTS — vom Job `plan` aus
          # ops/apps.conf gelesen, DIESELBE Liste, die auch die
          # Change-Detection abfragt und die der Rueckweg ops/rollback.sh
          # liest. Nie eine zweite hier anlegen: genau daran ist branding am
          # 2026-09-01 unsichtbar zurueckgeblieben. Die Reihenfolge der
          # Auslieferung ist die Reihenfolge der Liste.
          #
          # CONTROL heisst seit 2026-08-18 auch als ploi-SITE `admin.pukalani.app`
          # (Davids Panel-Umbenennung; ploi benennt dabei das Server-Verzeichnis
          # mit um) — SITE und PROBE sind damit wieder fuer ALLE Apps identisch.
          # Der SLOT bleibt `control` (Release-Verzeichnisse wechseln beim Rename
          # nicht mit), ebenso das Appwrite-Projekt. Den pm2-Prozess hat der
          # Rename mitgezogen (Name = Site ohne Punkte): die Ecosystem-Datei
          # heisst jetzt `adminpukalaniapp`, und pm2-heal.sh loescht den
          # Vorgaenger `controlpukalaniapp` EINMALIG vor dem startOrReload —
          # ohne das starteten zwei Prozesse auf einem Port (studio→control-
          # Falle, gemessen 6:4 bei 10 Aufrufen; die Serien-Probe unten ist
          # dafuer der Beweis). Der 301-Altname `control.pukalani.app` ist seit
          # demselben Tag BEWUSST aufgegeben: der Host faellt in die Wildcard-
          # Site platform und antwortet 404 (Davids Entscheidung, s. CLAUDE.md
          # AH-4b und DECISION-LOG).
          #
          # BRANDING (2026-08-31) ist die erste App AUSSERHALB der Zone
          # pukalani.app: Site, Slot und Probe heissen `branding.supply` bzw.
          # `branding`, der pm2-Prozess `brandingsupply` (Site ohne Punkte, wie
          # ueberall). Ihr nginx proxyt auf Port 3007 — NICHT auf den DEV-Port
          # 3006 der App: das ist die Portkarte des SERVERS, und dort haelt
          # help seit 2026-07-28 die 3006 (Begruendung in
          # ops/ecosystem-branding.config.cjs).
          # Apps, die den neuen Stand tragen, aber nicht `ok:true` melden
          # (s. Probe unten) — der Lauf endet dann rot, NACHDEM alle Apps
          # ausgeliefert sind.
          UNHEALTHY=""
          # Apps, deren Datenbank nicht zum ausgelieferten Programm passt
          # (OPS-008, s. Probe unten) — ebenfalls erst NACH allen Apps rot.
          SCHEMA_BEHIND=""
          for pair in $APP_HOSTS; do
            app="${pair%%=*}"
            site="${pair#*=}"
            # Seit AH-4b (s. o.) ist der PROBE-Host fuer JEDE App identisch mit
            # ihrer Site — kein eigenes Array mehr, das auseinanderlaufen kann.
            probe="$site"
            echo "::group::Deploy $app → $site"
            # EIN STAND, VIER WORTE (ops/app-release.sh, dort stehen die
            # Begründungen der Handgriffe). Der Stand geht als das Archiv, das
            # der Build gepackt hat, in ein FRISCHES Verzeichnis unter
            # /home/ploi/releases/<app>/<commit> (ein Stand, der gerade aktiv
            # ist, wird nicht überschrieben — RW1 c); die Dateien der Site als
            # kleines tar nach <site>/ops (das Skript nimmt nur Namen von
            # seiner Liste); `activate` legt den Verweis um, lässt
            # pm2-heal.sh laufen und lädt den Prozess über die Ecosystem-Datei
            # neu — scheitert das, liegt der Verweis wieder auf dem Stand
            # davor; `prune` behält vier Stände und immer den aktiven.
            # Scheitert ein Wort, bricht `set -e` hier ab, die restlichen Apps
            # bleiben stehen (wie bisher bei einem gescheiterten Handgriff).
            #
            # ZWEI DINGE, DIE DAS SKRIPT NICHT SIEHT und die deshalb die
            # Serien-Probe unten beweist: pm2 findet den Prozess über den
            # NAMEN in der Ecosystem-Datei (Site ohne Punkte) — nach einer
            # Umbenennung startet es DANEBEN (zwei Prozesse, ein Port,
            # gemischte Builds; beim studio→control-Rename gemessen 6:4), und
            # ein `reload` behält den GESPEICHERTEN Script-Pfad — ein
            # Pfadwechsel in der Ecosystem-Datei kommt nie an (dann EINMALIG
            # `pm2 delete <name>` davor; pm2-heal.sh räumt bekannte
            # Vorgänger weg).
            ssh prod "$RELEASE_SCRIPT release-put $app $EXPECTED_SHA" < "$RUNNER_TEMP/out/$app.tar.zst"
            # Erst packen, dann schicken — zwei Befehle statt einer Pipe, damit
            # ein gescheitertes Packen den Lauf selbst beendet.
            # shellcheck disable=SC2086
            tar -cf "$RUNNER_TEMP/ops-$app.tar" -C "$GITHUB_WORKSPACE/ops" "ecosystem-$app.config.cjs" $OPS_FILES -C "$GITHUB_WORKSPACE/scripts/ops" $WATCH_FILES
            ssh prod "$RELEASE_SCRIPT ops-put $app" < "$RUNNER_TEMP/ops-$app.tar"
            ssh prod "$RELEASE_SCRIPT activate $app $EXPECTED_SHA" </dev/null
            ssh prod "$RELEASE_SCRIPT prune $app" </dev/null || echo "::warning::[$app] Aufräumen alter Stände ist gescheitert — das Ausliefern selbst ist davon nicht betroffen."
            echo "::endgroup::"

            # DREI Treffer in Folge, nicht einer. Eine einzelne Abfrage beweist
            # nur, dass IRGENDEIN Prozess hinter dem Host den neuen Build hat —
            # nicht, dass alle ihn haben. Genau daran ist der Rename-Deploy
            # vorbeigelaufen: zwei Prozesse auf einem Port, einer alt, und die
            # erste Abfrage traf zufaellig den neuen.
            #
            # BUILD UND `ok` (OPS-007, 2026-11-15; vorher nur der Build). Zwei
            # verschiedene Aussagen, zwei verschiedene Folgen:
            #   Build falsch ⇒ das Ausliefern selbst ist gescheitert. Abbruch
            #                  wie bisher, die restlichen Apps bleiben stehen.
            #   Build richtig, `ok` nicht true ⇒ der Stand ist ausgeliefert,
            #                  aber die Seite meldet sich nicht gesund (Appwrite
            #                  nicht erreichbar, Pflicht-Variable fehlt, …). Die
            #                  RESTLICHEN APPS WERDEN TROTZDEM AUSGELIEFERT —
            #                  die Ursache liegt oft nicht im Stand, und ein
            #                  Abbruch hielte auch die Korrektur fuer die
            #                  anderen Apps auf. Der Lauf endet danach ROT.
            # Zurueckgestellt wird NICHT von selbst: ob der alte Stand hilft,
            # ist eine Entscheidung (docs/runbooks/DEPLOYMENT.md, „Schlechter
            # Stand live").
            #
            # DATENBANK-STAND (OPS-008, 2026-11-16): `/api/health` meldet neben
            # `ok` das Feld `schema.state` — passt die Datenbank zum Programm?
            # Die App prueft je Layer eine Probe am wirklichen Schema. Zweimal
            # ging neues Programm live, bevor seine Migration gelaufen war, und
            # kein Lauf wurde rot.
            #   behind  ⇒ der Stand ist ausgeliefert, die uebrigen Apps werden
            #             TROTZDEM ausgeliefert, der Lauf endet ROT. Aufgehalten
            #             wird nichts (das waere eine eigene Entscheidung) —
            #             der Lauf sagt nur, dass eine Migration fehlt.
            #   unknown ⇒ nur eine Warnung: die App konnte nicht pruefen. Der
            #             Halbstunden-Waechter fragt nach und wird dann rot.
            #   kein Feld (Landing, Hilfe: eigener Health ohne Appwrite) ⇒ nichts.
            # `ok` bleibt davon unberuehrt.
            echo "[$app] Erwarte Commit $EXPECTED_SHA und ok:true auf https://$probe/api/health (3x in Folge) …"
            built=""; healthy=""; streak=0; reason=""; SCHEMA=""
            for i in $(seq 1 20); do
              RESP=$(curl -fsS -m 15 "https://$probe/api/health" || true)
              BUILD=$(printf '%s' "$RESP" | jq -r '.build // empty' 2>/dev/null || true)
              OK=$(printf '%s' "$RESP" | jq -r '.ok // false' 2>/dev/null || true)
              # `reason` landet im öffentlichen Protokoll: nur ein kurzes Kennwort
              # (z. B. tenant_resolver_missing), nie freier Text vom Server.
              reason=$(printf '%s' "$RESP" | jq -r '.reason // empty' 2>/dev/null | grep -Eox '[a-z0-9_]{1,40}' | head -n 1 || true)
              # Nur eines der drei bekannten Worte gelangt ins Protokoll.
              SCHEMA=$(printf '%s' "$RESP" | jq -r '.schema.state // empty' 2>/dev/null | grep -Eox 'ok|behind|unknown' | head -n 1 || true)
              if [ "$BUILD" = "$EXPECTED_SHA" ]; then
                streak=$((streak + 1))
                if [ "$streak" -ge 3 ]; then
                  built=1
                  if [ "$OK" = "true" ]; then
                    echo "[$app] ✔ Prod läuft durchgängig auf $BUILD und meldet ok:true"; healthy=1; break
                  fi
                  echo "[$app]   ($i/20) Build stimmt, aber ok ist '$OK'${reason:+ (reason: $reason)} — warte 5 s …"
                else
                  echo "[$app]   ($i/20) Treffer $streak/3 …"
                fi
              else
                [ "$streak" -gt 0 ] && echo "[$app]   ($i/20) Serie gerissen — '$BUILD' statt $EXPECTED_SHA (mehrere Prozesse am Port?)"
                streak=0
                echo "[$app]   ($i/20) Prod meldet '${BUILD:-n/a}' — warte 5 s …"
              fi
              sleep 5
            done
            if [ -z "$built" ]; then
              echo "::error::[$app] Prod hat $EXPECTED_SHA nicht stabil erreicht — pm2 list prüfen (verwaister Prozess am selben Port?)."
              exit 1
            fi
            if [ -z "$healthy" ]; then
              echo "::error::[$app] $EXPECTED_SHA ist ausgeliefert, aber https://$probe/api/health meldet nicht ok:true${reason:+ (reason: $reason)}."
              UNHEALTHY="$UNHEALTHY $app"
            fi
            if [ "$SCHEMA" = "behind" ]; then
              echo "::error::[$app] $EXPECTED_SHA ist ausgeliefert, aber die Datenbank passt nicht zum Programm (schema: behind) — eine Migration fehlt."
              SCHEMA_BEHIND="$SCHEMA_BEHIND $app"
            elif [ "$SCHEMA" = "unknown" ]; then
              echo "::warning::[$app] Datenbank-Stand unbekannt (schema: unknown) — die App konnte ihn nicht prüfen; der Halbstunden-Wächter fragt nach."
            elif [ "$SCHEMA" = "ok" ]; then
              echo "[$app] ✔ Datenbank passt zum Programm (schema: ok)"
            fi
          done
          if [ -n "$UNHEALTHY" ]; then
            echo "::error::Ausgeliefert, aber nicht gesund:$UNHEALTHY — docs/runbooks/DEPLOYMENT.md, Abschnitt „Schlechter Stand live“."
          fi
          if [ -n "$SCHEMA_BEHIND" ]; then
            echo "::error::Ausgeliefert, aber die Datenbank passt nicht zum Programm:$SCHEMA_BEHIND — Migration nachholen: docs/runbooks/PRODUKTIONS-ALARM.md, „Datenbank passt nicht zum Programm“."
          fi
          if [ -n "$UNHEALTHY" ] || [ -n "$SCHEMA_BEHIND" ]; then
            exit 1
          fi

      # HINWEIS, NOCH KEIN TOR (CI1 b): der Schlüssel soll auf dem Server nur
      # `ops/app-release.sh` ausführen können (fester Befehl in
      # authorized_keys). Ob das so ist, sagt nur ein Versuch: eine harmlose
      # freie Befehlszeile muss abgelehnt werden (Exit 64). Solange der
      # Schlüssel noch frei eingetragen ist, steht hier eine Warnung und der
      # Lauf bleibt grün; scharf gestellt wird der Schritt, wenn die
      # Beschränkung eingetragen und einmal bewiesen ist.
      - name: Ist der Ausliefer-Schlüssel auf das Skript beschränkt?
        run: |
          set -u
          code=0
          out=$(ssh prod 'echo frei' </dev/null 2>/dev/null) || code=$?
          if [ "$out" = "frei" ]; then
            echo "::warning::Der Ausliefer-Schlüssel führt freie Befehle aus — er ist noch nicht auf ops/app-release.sh beschränkt."
          elif [ "$code" = "64" ]; then
            echo "✔ Der Schlüssel führt nur das feste Skript aus (eine freie Befehlszeile wird abgelehnt)."
          else
            echo "::warning::Keine klare Antwort auf die Probe (Exit $code) — nicht geprüft."
          fi

      # Der Schlüssel verlässt die Platte, auch wenn ein Schritt davor rot wurde.
      - name: Schlüssel von der Platte nehmen
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # TLS-Nachkontrolle: liefert JEDER Host noch ein passendes Zertifikat?
  # Die Health-Probe oben prüft nur die Hosts, die gerade deployt wurden —
  # ein zerschossenes Zertifikat auf einem ANDEREN Host (geteilte
  # certbot-Lineage, Vorfall 2026-07-27) bliebe sonst unentdeckt.
  # Läuft auch, wenn ein App-Schritt vorher rot war: dann ist die
  # TLS-Aussage besonders wichtig.
  tls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [plan, deliver]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true'
    steps:
      # Aus OPS_REF (s. Kopf): die Host-Liste des TLS-Wächters ist die von heute.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.OPS_REF }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: TLS aller Hosts prüfen
        run: node scripts/ops/verify-tls.mjs
