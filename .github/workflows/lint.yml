name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:

# Rechte stehen je Job (SEC-041): ohne eigene Angabe hat ein Job keine.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Auf `main` nicht abbrechen — Begründung steht in e2e.yml (dort ist es am
  # 2026-08-18 aufgeschlagen: fünf abgeräumte Läufe hintereinander, das Gate
  # war nicht rot, sondern stumm).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # DER GANZE LINT-LAUF IST EIN BEFEHL (Q18): `pnpm check` fährt die Liste
      # aus scripts/lib/check-steps.mjs (Wächter, Lint, typisierter Lint,
      # Skript-Lint) — lokal genau so. Die Begründung je Schritt steht dort.
      # Hier KEINE einzelnen Schritte nachtragen: der Test
      # packages/core/tests/checkSteps.test.ts hält diesen Job bei genau
      # diesem einen Aufruf.
      - run: pnpm check

  # Schlüssel-Suche (SEC-040/SEC-012). Das Repo ist öffentlich — ein einmal
  # gepushtes Geheimnis steht für immer in der Historie. GitHubs eigene Suche
  # mit Push-Sperre ist seit 2026-11-12 an, kennt aber nur die Muster der
  # großen Anbieter; gitleaks ergänzt allgemeine Muster und liest die GANZE
  # Historie des geprüften Zweigs, nicht nur den neuen Commit. Eigener Job: läuft parallel zu
  # `lint`, braucht kein `pnpm install`, und ein Fund färbt „Lint" rot (und
  # hält damit den Deploy auf).
  #
  # Binärdatei mit Prüfsumme statt einer Action: eine Action wäre fremder
  # Code mit Zugriff auf den Lauf, den ein Tag-Umzug still austauschen kann;
  # die Prüfsumme nagelt genau eine Datei fest.
  # Heben: GITLEAKS_VERSION setzen, GITLEAKS_SHA256 aus der veröffentlichten
  # `gitleaks_<version>_checksums.txt` des Releases übernehmen (Zeile
  # `gitleaks_<version>_linux_x64.tar.gz`), lokal gegenlaufen lassen.
  #
  # Bei einem Fund: Regel im Kopf von `.gitleaksignore` — erst klären, ob es
  # ein echtes Geheimnis ist; ein echtes wird rotiert, nicht eingetragen.
  # `--redact` ist Pflicht: auch die CI-Protokolle sind öffentlich.
  # `--verbose` nennt dazu Datei, Zeile, Regel und Fingerprint — der Wert
  # selbst bleibt geschwärzt.
  # Lokal dasselbe (Installation `brew install gitleaks`):
  #   pnpm check:secrets
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks holen (gepinnt, Prüfsumme)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # NUR DIE HISTORIE DIESES ZWEIGS (CW1 b, Davids Entscheidung 2026-11-18):
      # gelesen wird alles, was von dem geprüften Commit aus erreichbar ist —
      # bei einem Pull Request die ganze Geschichte von `main` plus die
      # Commits des Zweigs, auf `main` die ganze Geschichte von `main`. Vorher
      # las die Prüfung JEDEN Zweig auf origin: ein Fund in einem fremden
      # Zweig färbte jeden Pull Request und `main` rot und hielt jedes
      # Ausliefern auf. Alle Zweige liest weiter der tägliche Lauf
      # `secrets-watch.yml` (meldet als Issue, hält nichts auf).
      - name: gitleaks (Historie dieses Zweigs)
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 --log-opts="--full-history HEAD" .'
