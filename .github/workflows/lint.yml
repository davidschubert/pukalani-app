name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Auf `main` nicht abbrechen — Begründung steht in e2e.yml (dort ist es am
  # 2026-08-18 aufgeschlagen: fünf abgeräumte Läufe hintereinander, das Gate
  # war nicht rot, sondern stumm).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:manifests

      # Nennt die app.config einen i18n-Schlüssel, den die App nicht hat?
      # vue-i18n gibt dann den SCHLÜSSEL zurück — Typecheck, Lint und Unit-
      # Tests sehen davon nichts (ein labelKey ist für sie ein `string`).
      # Vier Tage lang stand deshalb wörtlich „legal.imprint" im Fuß von
      # comments.pukalani.app, am rechtlich wichtigsten Link des Hosts.
      # Reines Lesen, keine Env, keine Dienste.
      - run: pnpm check:i18n-keys

      # Die Produkt-Bilanz (Pool=Silo, Davids Leitprinzip) wird seit dem
      # 2026-08-02 ERZEUGT statt gepflegt — das committete Dokument muss also
      # zum Code passen. Ohne dieses Gate veraltet es wieder, und genau daran
      # ist die handgepflegte Vorgängerin gescheitert (7 von 12 Zeilen falsch).
      - run: pnpm check:bilanz

      # Tote Verweise in der Doku: CLAUDE.md sprach an 14 Stellen von einer
      # Tabelle, die es seit control-030 nicht mehr gibt — das Regelwerk, nach
      # dem hier alle arbeiten. Läuft in ~1 s, reines Lesen.
      - run: pnpm check:doc-links

      # Zwei Kopien einer Kernabhängigkeit brechen Typen oder Build, und WELCHE
      # gewinnt, entscheidet pnpms Hoisting statt des Lockfiles — derselbe
      # Lockfile ist damit auf einer Maschine grün und auf der anderen rot
      # (2026-07-30 genau so passiert: vue → ENAMETOOLONG im Build,
      # h3 → 1102/944/1261 Typfehler).
      - run: pnpm check:single-copy

      # Ein gerades `"` in einem KI-Prompt ist eine Vorlage für genau das
      # Zeichen, das die JSON-Antwort des Modells beendet (BI4: 4 von 52
      # bezahlten Läufen). Typecheck, Lint und Tests sehen davon nichts.
      - run: pnpm check:prompt-quotes

      # 26×11-Theme-Katalog (E6a): committeter Generator-Output muss zum
      # Katalog passen — Regenerieren darf kein Diff erzeugen.
      - run: pnpm --filter @pukalani/themes check:themes

      - run: pnpm -r lint
      # `pnpm -r lint` läuft NUR über die Workspace-Pakete — die 23 Dateien in
      # scripts/ (Migrations-Runner, ops-Wächter, CI-Aufbau) sah bis 2026-08-19
      # kein Linter. Genau dort liegt aber der Code, der Produktionsdaten
      # anfasst. Kostet nichts: beim Einführen war ein einziger Fehler drin.
      - run: pnpm lint:scripts
