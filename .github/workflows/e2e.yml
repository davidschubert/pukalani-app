# E2E gegen eine ECHTE Appwrite-Instanz (OPEN-ITEMS Idee 4): der Runner
# startet den geschnittenen Appwrite-Stack (ci/appwrite/ — traefik, appwrite,
# realtime, geo, worker, mariadb, redis; Rest des offiziellen Compose bleibt
# aus). Seit Appwrite 2.2 gibt es NICHT mehr einen Container je Warteschlange:
# `appwrite-worker` bedient alle (frueher hier: databases- und deletes-Worker).
# Seit 2.6.1 kommen autogravity und exiftool als `depends_on` von `appwrite`
# von selbst mit — die Liste unten bleibt deshalb kurz.
# scripts/ci/appwrite-setup.mjs erledigt die Console-
# Schritte (Account/Projekt/Key/Platform + .env), dann bootstrap --seed und
# die Playwright-Suite — inklusive Realtime-Spec (env-gated, läuft hier,
# weil die .env existiert). themes-visual skippt in CI (Baselines -darwin).
name: E2E (Appwrite)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # ── AUF `main` WIRD NICHT ABGEBROCHEN (2026-08-18) ───────────────────────
  # Auf einem Zweig ist Abbrechen richtig: ein überholter Stand muss nicht zu
  # Ende geprüft werden. Auf `main` ist es das Gegenteil — dort ist jeder
  # Commit ein AUSGELIEFERTER Stand, und sein Prüfergebnis ist die einzige
  # Aussage darüber, ob er trägt.
  #
  # In der Nacht auf den 18. hat das gebissen: mehrere Sitzungen schoben im
  # Minutentakt auf `main`, und FÜNF E2E-Läufe hintereinander wurden vom
  # jeweils nächsten Push abgeräumt („Canceling since a higher priority
  # waiting request … exists"). Ergebnis: stundenlang KEIN abgeschlossener
  # E2E-Lauf auf dem Zweig, der deployt wird — das Gate war nicht rot, es war
  # stumm, und das ist schlechter. Die kurzen Gates (Lint/Test/Typecheck,
  # 1–3 min) trifft es seltener, aber aus demselben Grund gilt hier dieselbe
  # Regel.
  #
  # Preis: bei schneller Folge laufen mehrere Prüfungen parallel. Für ein
  # ÖFFENTLICHES Repo sind die Minuten frei — und Gewissheit über einen
  # ausgelieferten Stand ist billiger als jede gesparte Minute.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Früh starten — mariadb-Erstinitialisierung + Appwrite-Boot laufen
      # parallel zu pnpm install
      # Der Instanz-Schlüssel wird je Lauf ERZEUGT statt im Repo zu liegen —
      # das Repo ist seit 2026-08-03 öffentlich, und ein Klartext-Geheimnis
      # wäre dort ein schlechtes Vorbild, auch wenn die Instanz Wegwerf ist.
      # Anhängen an die Runner-Kopie von ci.env: ALLE compose-Aufrufe dieses
      # Jobs lesen dieselbe Datei, der Schlüssel bleibt also für Logs/Teardown
      # konsistent. Konstant muss er nur je Instanz sein, und die lebt genau
      # einen Lauf.
      - name: Appwrite-Instanzschlüssel erzeugen
        working-directory: ci/appwrite
        run: printf '\n_APP_OPENSSL_KEY_V1=%s\n' "$(openssl rand -hex 16)" >> ci.env

      # IM HINTERGRUND, und das ist der ganze Punkt: von den 40 s dieses
      # Schrittes waren ~33 s reines Herunterladen der Images (gemessen am
      # Zeilenprotokoll eines echten Laufs — die Pulls laufen bereits parallel
      # zueinander, das grosse `appwrite`-Image ist der kritische Pfad). Node,
      # pnpm und `pnpm install` brauchen zusammen ~15 s und haengen von der
      # Instanz NICHT ab; sie standen bisher trotzdem hinter dem Download an.
      #
      # Der Rueckgabewert wandert in eine Datei, weil ein `wait` ueber
      # Schritt-Grenzen hinweg nicht geht (jeder Schritt ist eine eigene
      # Shell). „Auf Appwrite warten" liest sie und ist damit der EINE
      # Synchronisationspunkt: erst wenn compose sauber durch ist, wird auf
      # Gesundheit gepollt. Bricht der Start ab, steht das Protokoll im Log und
      # der Job stirbt dort — nicht 450 s spaeter an einem Zeitablauf, dessen
      # Ursache man dann suchen muesste.
      - name: Appwrite-Stack starten (im Hintergrund)
        working-directory: ci/appwrite
        run: |
          (
            docker compose --env-file ci.env --project-name appwrite-ci up -d \
              traefik appwrite appwrite-realtime appwrite-geo \
              appwrite-worker \
              mariadb redis
            echo $? > "$RUNNER_TEMP/stack.rc"
          ) > "$RUNNER_TEMP/stack.log" 2>&1 &
          echo "Stack-Start laeuft im Hintergrund — Node-Setup und Install ziehen vor."

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ZWEI Wartezeiten hintereinander, mit verschiedenen Gruenden:
      #  1. Ist `compose up` ueberhaupt fertig? (laeuft seit dem Schritt oben)
      #  2. Antwortet Appwrite? — jetzt im Sekundentakt statt alle 5 s. Der
      #     Zeitrahmen bleibt bei 450 s, nur das Raster wird feiner: Appwrite
      #     ist irgendwann INNERHALB eines Fensters bereit, und bei 5 s
      #     verschenkte man im Schnitt 2,5 s davon. Dieselbe Rechnung wie beim
      #     Spalten-Pollen der Migrationen.
      - name: Auf Appwrite warten
        run: |
          for i in $(seq 1 600); do
            if [ -f "$RUNNER_TEMP/stack.rc" ]; then break; fi
            sleep 0.5
          done
          rc=$(cat "$RUNNER_TEMP/stack.rc" 2>/dev/null || echo 'timeout')
          if [ "$rc" != "0" ]; then
            echo '::error::Stack-Start fehlgeschlagen (Rueckgabe '"$rc"')'
            cat "$RUNNER_TEMP/stack.log" || true
            exit 1
          fi
          tail -5 "$RUNNER_TEMP/stack.log" || true

          for i in $(seq 1 450); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health/version || true)
            if [ "$code" = "200" ]; then
              echo "Appwrite bereit: $(curl -s http://localhost:8080/v1/health/version)"
              exit 0
            fi
            sleep 1
          done
          echo '::error::Appwrite nach 450s nicht erreichbar'
          docker compose --env-file ci/appwrite/ci.env --project-name appwrite-ci -f ci/appwrite/docker-compose.yml logs --tail 80 appwrite mariadb
          exit 1

      - name: Console-Setup (Projekt, Key, Platform, .env)
        run: node scripts/ci/appwrite-setup.mjs --endpoint http://localhost:8080/v1 --app apps/comments

      - name: Bootstrap (DB, Bucket, Migrationen) + Seed
        run: pnpm --filter comments run bootstrap --seed

      # Der GELDPFAD gegen die frisch migrierte Instanz (Audit-Befund
      # 2026-08-02). Warum hier und nicht als Unit-Test: `grantEventTicket`
      # schrieb monatelang eine Spalte, die es nach E8-3 nicht mehr gab —
      # Appwrite antwortete 400, es entstand kein Ticket, der Zahlende bekam
      # 403. Die Suite blieb grün, weil sie den Row-Store MOCKT, und ein Mock
      # hat kein Schema. Erst eine echte Datenbank sagt, ob die Felder
      # existieren; genau die steht hier schon.
      - name: Paid-Ticket-Beweis (echtes Schema)
        run: |
          cd packages/events
          node --experimental-strip-types --env-file=../../apps/comments/.env \
            scripts/verify-paid-ticket.mjs

      # ── DIE LIVE-BEWEISE (F30) ────────────────────────────────────────────
      # Im Repo liegen zwei Dutzend `verify-*.mjs`. Bis heute lief davon in CI
      # NUR der Paid-Ticket-Beweis darüber — alles andere prüfte, wer zufällig
      # daran dachte. Genau so blieben ein toter Geldpfad und ein Isolations-
      # Loch wochenlang unentdeckt, OBWOHL es für beide einen Beweis gab.
      #
      # Hier hängen die Beweise, die OHNE zusätzliche Infrastruktur laufen:
      # kein Dev-Server, keine zweite Appwrite, kein Control-Plane-Projekt —
      # sie brauchen nur die frisch migrierte Instanz, die zwei Schritte weiter
      # oben schon steht. Jeder bekommt einen EIGENEN Schritt: ein roter Lauf
      # soll am Schritt-Namen zeigen, WELCHE Zusage gebrochen ist, statt in
      # einem Sammel-Schritt zu verschwinden.
      #
      # Alle fünf sind idempotent und räumen ihre Zeilen selbst wieder weg
      # (auch im Fehlerfall) — sie dürfen deshalb gegen dieselbe Instanz
      # laufen, die gleich die Playwright-Suite benutzt.
      #
      # Was hier NICHT steht, steht in docs/referenz/LIVE-BEWEISE.md mitsamt
      # dem Grund (die meisten brauchen einen Platform-Dev-Server mit den
      # Wegwerf-Communities kunde-a/kunde-b im Control Plane — die gibt es in
      # CI noch nicht).

      - name: Beweis — Mandanten-Isolation comments/reports/pages (DB-Ebene)
        run: |
          cd packages/comments
          node --env-file=../../apps/comments/.env \
            scripts/verify-pool-isolation.mjs

      - name: Beweis — Mandanten-Isolation posts/votes/polls (DB-Ebene)
        run: |
          cd packages/posts
          node --env-file=../../apps/comments/.env \
            scripts/verify-pool-isolation.mjs

      # C18: „sieht ein GAST die Inhalte noch?" — gelesen mit einem echten
      # Gast-Client (Endpoint + Projekt, KEIN Key), also an unserem Code vorbei.
      - name: Beweis — Sichtbarkeit je Community (Gast-Sicht, beide Richtungen)
        run: |
          cd packages/control
          node --experimental-strip-types --env-file=../../apps/comments/.env \
            scripts/verify-audience-flip.mjs

      # A4/A5: die Presence-Grenze, direkt gegen die Presences-API gelesen.
      # PLATFORM_PORT zeigt bewusst auf einen toten Port: „Akt 2" (der Weg durch
      # Middleware + Heartbeat) braucht einen Platform-Dev-Server, den es hier
      # nicht gibt, und wird dann sauber übersprungen. Der Port steht explizit
      # da, damit das Überspringen eine ENTSCHEIDUNG ist und nicht davon
      # abhängt, dass zufällig nichts auf 3006 lauscht.
      - name: Beweis — Presence-Grenze (Akt 1, Mechanismus an der Appwrite-API)
        env:
          PLATFORM_PORT: '39999'
        run: |
          cd packages/core
          node --env-file=../../apps/comments/.env \
            scripts/verify-presence-boundary.mjs

      # Changelog-Einträge (v0.1…): der Smoke-Test prüft die öffentliche
      # Vollhistorie — auf der frischen Instanz sonst leer
      - name: Changelog seeden
        run: node --env-file=apps/comments/.env packages/admin/scripts/seed-changelog.mjs

      # Seit 2026-07-31 GEBÜNDELTES Chromium statt System-Chrome (playwright.
      # config): auf macOS erbten GoogleUpdater/crashpad das stdout-Socketpair
      # des Workers und hängten die lokale Suite. Preis: der Browser ist auf
      # ubuntu-latest NICHT vorinstalliert und braucht diesen Schritt.
      #
      # ── WARUM DER SCHRITT SEIT 2026-08-18 GETEILT UND GEPANZERT IST ──────
      # In der Nacht auf den 18. hing er 30 Minuten und riss den ganzen Job in
      # `timeout-minutes: 30` („exceeded the maximum execution time"): rot,
      # ohne dass ein einziger Test gelaufen war, und der Deploy wartete mit.
      #
      # `install --with-deps` macht ZWEI sehr verschiedene Dinge, und genau das
      # war die Falle. Der erste Panzerungs-Versuch (ein `timeout` + zweiter
      # Anlauf um beides herum) hat es am selben Abend SCHLIMMER gemacht:
      # `apt-get` hing auf dem Azure-Spiegel, `timeout` killte den direkten
      # Kindprozess — aber das von Playwright als ROOT gestartete `apt-get`
      # überlebte und hielt `/var/lib/apt/lists/lock` weiter. Versuch 2 war
      # damit chancenlos („Could not get lock … held by process 7406"). Aus
      # einem langsamen Schritt wurden zwei sichere Fehlschläge.
      #
      # Wiederholt wird deshalb nur, was sich wiederholen LÄSST:
      #
      #  · SYSTEMPAKETE (apt) — EIN Versuch, kein innerer `timeout`. Ein
      #    abgebrochener apt-Lauf hinterlässt eine gesperrte Datei, und der
      #    nächste Versuch scheitert an der Sperre des vorigen. Backstop ist
      #    allein der Schritt-Timeout: dann ist der Job rot, aber ehrlich.
      #  · BROWSER (Download) — gecacht und zweimal versucht. Ein abgebrochener
      #    Download hinterlässt nichts als eine halbe Datei, die Playwright
      #    selbst verwirft; hier ist ein zweiter Anlauf gratis und hilft, weil
      #    ein abgerissener Download die häufigste Störung ist.
      #
      # Der CACHE deckt nur den Browser ab (~/.cache/ms-playwright), niemals
      # apt — Schlüssel ist die Playwright-VERSION, ein Bump im Katalog erzeugt
      # also automatisch einen neuen Eintrag statt einen alten Browser
      # weiterzubenutzen. Kein `continue-on-error`: ohne Browser ist die Suite
      # keine Aussage.
      - name: Playwright-Version bestimmen (Cache-Schlüssel)
        id: playwright-version
        run: |
          echo "version=$(pnpm --filter comments exec node -p \
            "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # v6 und nicht v4: der Runner meldet für v4 „Node.js 20 is deprecated …
      # forced to run on Node.js 24". Die übrigen Actions dieses Repos stehen
      # ohnehin auf der aktuellen Generation (checkout@v7, setup-node@v7).
      - name: Playwright-Browser aus dem Cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # DER AZURE-SPIEGEL FLIEGT VOR DEM APT-LAUF RAUS (2026-08-19, zweimal in
      # einer Nacht erwischt): die ubuntu-Runner lesen ihre Quellen aus einer
      # Spiegel-LISTE (/etc/apt/apt-mirrors.txt), und deren erster Eintrag
      # `azure.archive.ubuntu.com` war nicht erreichbar. apt probiert ihn für
      # JEDE Quelle mehrfach durch (~7 min „Ign:"-Spam), fällt dann zwar auf
      # archive.ubuntu.com zurück, aber das 8-Minuten-Budget ist da schon
      # verbrannt — der Schritt stirbt am eigenen Timeout, nicht an apt. Die
      # Liste vorher auf den Haupt-Spiegel zu drehen kostet im Normalfall
      # nichts (derselbe Inhalt) und macht den Ausfall des Azure-Spiegels
      # unsichtbar. `EIN Versuch` bleibt richtig: apt selbst ist ohne den
      # toten Spiegel zuverlässig (CI-Härtung 2026-08-18).
      - name: apt-Spiegel härten (Azure-Mirror raus)
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Playwright — Systempakete (apt, EIN Versuch)
        timeout-minutes: 8
        run: pnpm --filter comments exec playwright install-deps chromium

      - name: Playwright — Chromium (Download, gecacht, zwei Versuche)
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            if timeout 240 pnpm --filter comments exec playwright install chromium; then
              exit 0
            fi
            echo "::warning::Chromium-Download: Versuch $attempt fehlgeschlagen oder hing (240 s) — neuer Versuch"
            sleep 10
          done
          echo "::error::Chromium liess sich in zwei Versuchen nicht herunterladen."
          exit 1

      - name: Playwright-E2E (inkl. Realtime gegen echte Instanz)
        run: pnpm --filter comments exec playwright test

      - name: Playwright-Artefakte sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/comments/test-results
          retention-days: 7

      # Gate G1/S1 (M4): create-site end-to-end gegen die echte Wegwerf-
      # Instanz — Console-REST (Org→Projekt→Keys→Platform), .env, Bootstrap
      # mit manifest-gefilterten Migrationen, check:manifests als Schlussgate.
      # Console-Zugang = der CI-Account aus appwrite-setup.mjs.
      - name: Gate G1 — create-site (S1, Console-Provisionierung)
        env:
          APPWRITE_CONSOLE_EMAIL: ci@example.com
          APPWRITE_CONSOLE_PASSWORD: ci-console-password-2026
        run: pnpm create-site g1-probe --endpoint http://localhost:8080/v1 --products themes,admin,comments,moderation,activity

      # F19 — der Anstoß am Metadaten-Cache, der die INDEX-Anlage rettet. Genau
      # dieser 400er (`column_not_available` trotz Spalten-Status 'available')
      # hat die CI-E2E schon zweimal live erwischt; `indexStep`/`withIndexRetry`
      # sind die Antwort darauf. Der Beweis stellt den vergifteten Cache-Zustand
      # exakt her (Redis-Eintrag zurück auf 'processing') und fährt BEIDE Fälle:
      # ohne Anstoß muss der Index scheitern, mit Anstoß durchkommen.
      #
      # Steht bewusst GANZ HINTEN: er ist mit ~25 s der langsamste Beweis, und
      # er fasst als einziger die Appwrite-Interna an (Wegwerf-Tabelle + Redis).
      # Die billigen Zusagen sollen vorher scheitern, nicht danach.
      #
      # Den API-Container fragt `docker compose` selbst ab, statt den Namen
      # <projekt>-<dienst>-<n> nachzubauen: eine geratene Konvention wäre eine
      # stille Kopplung an compose, und ein falscher Name würde hier als
      # PRODUKTFEHLER aussehen und jeden Deploy blockieren. Fehlt der
      # Container, bricht der Schritt mit eigener Ansage ab. Seit Appwrite 2.3
      # liegt der Cache als igbinary in Redis — die Vergiftung läuft deshalb
      # als PHP im API-Container, nicht mehr per redis-cli (2026-10-24).
      - name: Beweis — Index-Anstoß überlebt vergifteten Metadaten-Cache (F19)
        run: |
          API=$(docker compose --env-file ci/appwrite/ci.env \
            --project-name appwrite-ci -f ci/appwrite/docker-compose.yml \
            ps -q appwrite)
          if [ -z "$API" ]; then
            echo '::error::API-Container des CI-Stacks nicht gefunden'
            exit 1
          fi
          APPWRITE_API_CONTAINER="$API" \
            node --experimental-strip-types --env-file=apps/comments/.env \
              packages/media/scripts/verify-index-nudge.mjs

      - name: Stack-Logs bei Fehler
        if: failure()
        run: docker compose --env-file ci/appwrite/ci.env --project-name appwrite-ci -f ci/appwrite/docker-compose.yml logs --tail 120 appwrite appwrite-realtime appwrite-worker mariadb
