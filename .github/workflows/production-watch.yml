# Produktions-Wächter: drei Blicke auf dieselbe blinde Stelle — die
# Konfiguration ist falsch, aber nichts wird von selbst rot. Die Apps laufen,
# die Seiten antworten, und trotzdem ist etwas kaputt.
#
#   0. ZERTIFIKATE (`verify-tls.mjs`), ALLE 30 MINUTEN. ploi/certbot teilen
#      sich pro Zone EINE Lineage — eine Anforderung für irgendeine Site kann
#      still das Zertifikat aller anderen ersetzen. platform + demo waren so
#      ~40 Minuten TLS-tot, ohne dass etwas Alarm schlug: nginx lief, die Apps
#      antworteten, nur der Handshake brach (Vorfall 2026-07-27).
#
#   1. FEHLENDE VARIABLEN (`verify-site-env.mjs`), TÄGLICH. `platform.pukalani.app`
#      hatte kein `NUXT_SMTP_*`; damit ging für JEDE Kunden-Community nie eine
#      Benachrichtigungs-Mail raus. Die App lief, die Seiten antworteten, nur
#      die Mail blieb aus — das sieht aus wie ein bewusst abgeschaltetes
#      Produkt (F44). Prüft zusätzlich, ob die lokalen Migrations-Dateien aufs
#      richtige Projekt zeigen; in der CI fehlen die und werden übersprungen,
#      ohne als Befund zu zählen.
#
#   2. TOTE ZUGÄNGE (`verify-stale-keys.mjs --strict`, s. u.), TÄGLICH.
#
#   3. VERWAISTE INSTANZ (`verify-instance-admins.mjs --strict`), TÄGLICH.
#      „Registrierung aus" ist nur so lange harmlos, wie es noch jemanden
#      gibt, der sie wieder anschalten kann (Davids Einwand 2026-08-23). Ohne
#      Admin-Konto ist das Dashboard für niemanden bedienbar; ist zusätzlich
#      die Registrierung zu, kommt dort überhaupt niemand mehr hinein. Auf dem
#      Schreibweg im Produkt ist das gesichert (`assertNotLastAdmin`) — dieser
#      Blick deckt ab, was daran vorbei entsteht: Console-Klicks, Skripte,
#      eine frisch aufgesetzte Instanz ohne Label-Vergabe.
#
#   4. ERREICHBARKEIT (`verify-health.mjs`), ALLE 30 MINUTEN (MON1, 2026-10-28).
#      Vom 2026-10-16 bis 2026-10-24 antworteten ALLE Apps auf `/api/health`
#      mit `ok:false` (Appwrite-Zertifikat abgelaufen) — acht Tage, kein
#      Alarm. Dieser Blick fragt jeden Host, was er WIRKLICH sagt (ok:true,
#      Appwrite-Version), nicht nur, ob er antwortet.
#
#   5. MAIL-MISSBRAUCH (`verify-mail-breaker.mjs`), TÄGLICH (MON1). Vorfall
#      2026-10-25/27: die Registrierung wurde als Mail-Relais missbraucht,
#      bemerkt NUR über Resends eigene Limit-Mail. Jetzt: Notbremsen-Zeile
#      (`auth.mail_route_breaker`) im Server-Log der letzten 25 h ⇒ rot;
#      mit Secret `PRODUCTION_WATCH_RESEND_KEY` zusätzlich Resends eigener
#      Zähler (≥ 80 Mails in 24 h ⇒ rot, also VOR dem 100er-Limit).
#
# ── DER ALARMWEG (Job `alarm`) — WARUM ER DAS WICHTIGSTE HIER IST ──────────
# Der TLS-Wächter hat den Vorfall vom Oktober GESEHEN: ab 2026-10-05 („läuft
# in 11 Tagen ab") war jeder Lauf rot — rund 900 Stück bis zum 2026-10-24,
# alle 30 Minuten. Niemand hat es bemerkt. Ein roter Lauf in GitHub Actions
# ist nur dann ein Alarm, wenn jemand die Benachrichtigung bekommt UND liest;
# das war nicht der Fall. Deshalb macht der Job `alarm` aus dem Lauf-Ergebnis
# einen ZUSTAND, der nicht untergehen kann:
#   · rot  ⇒ EIN offenes Issue mit Label `produktions-alarm` (kein zweites,
#            solange es offen ist; alle 12 h ein Kommentar „weiterhin rot")
#   · grün ⇒ das offene Issue bekommt „Entwarnung" und wird geschlossen
#   · dazu, wenn eingerichtet: Mail bei JEDEM Wechsel (Resend-Secret) und
#     ein Heartbeat-Ping bei jedem grünen Lauf (UptimeRobot-Heartbeat —
#     bleibt der Ping aus, schlägt UptimeRobot an: das deckt auch den Fall
#     „der Workflow läuft gar nicht mehr", den kein Job hier sehen kann).
# PROBEALARM: `workflow_dispatch` mit `alarm_drill` macht den Health-Blick
# sicher rot und prüft damit die ganze Kette (Issue, Mail, Heartbeat-Ausfall);
# der nächste Lauf ohne Schalter räumt wieder auf. Runbook mit Klickliste:
# docs/runbooks/PRODUKTIONS-ALARM.md
#
# Die beiden täglichen laufen IMMER beide, auch wenn der erste rot wird
# (`if: always()`) — sonst verdeckt ein Befund den anderen und man repariert
# zweimal hintereinander.
#
# ── ZWEI TAKTE IN EINER DATEI ─────────────────────────────────────────────
# GitHub kennt keinen Zeitplan JE JOB: jeder `cron` löst den GANZEN Workflow
# aus. Die Trennung läuft deshalb über `github.event.schedule`, und der
# TLS-Blick braucht dafür weder ssh noch ein Secret (reines `node:tls`) — er
# bleibt ein eigener Job und damit auch in einem Fork harmlos.
#
# DIESE TRENNUNG IST FRAGIL, und das steht hier, damit es niemanden überrascht:
# ändert jemand eine `cron`-Zeile, passt der Vergleich unten nicht mehr, und
# der tägliche Teil liefe nie wieder — lautlos. Dagegen steht der Schritt
# „Zeitplan bekannt?": er macht aus dem stillen Nichtstun einen roten Lauf.
# Wer einen cron ändert, ändert also auch die Liste dort.
#
# ── ZU 2: TOTE ZUGÄNGE ────────────────────────────────────────────────────
# Prüft, ob auf dem Server ein Appwrite-Schlüssel liegt, dessen PROJEKT es
# nicht mehr gibt.
#
# WARUM (2026-08-19): ein Umzug benennt Dinge um, die Schlüssel dazu bleiben
# liegen. An EINEM Tag tauchten Zugänge zu gelöschten Projekten an drei Orten
# auf — darunter ein Sicherungsordner auf dem Server mit demselben
# Stripe-Schlüssel wie in der Produktion, 24 Tage unbemerkt. Nichts davon wurde
# rot: ein toter Schlüssel verhält sich wie ein ungenutzter.
#
# Und es ist nicht nur eine Aufräum-Frage. Auf dem Server liegen die AKTIVEN
# .env der Sites; zeigt eine davon auf ein totes Projekt, ist die Site kaputt
# (Befund E1b: apps/platform/.env.production verwies nach dem Account-Cutover
# noch auf das eingefrorene `pool`). Dieser Lauf sieht beides.
#
# ER FASST NICHTS AN. Das Skript liest, prüft und berichtet — gelöscht wird
# ausschliesslich von Hand, nach der zweiten Frage, die kein Skript beantworten
# kann („gibt es diesen Wert nirgends sonst?", siehe Runbook).
#
# WERTE VERLASSEN DEN SERVER NIE: das Skript kopiert sich hinüber und läuft
# dort; zurück kommt nur der Bericht (Dateiname, Projekt, Status).
#
# Rot wird der Lauf NUR bei einem toten Zugang. „Unklar" (Netz weg, Instanz
# gerade nicht erreichbar) bleibt grün — ein Wächter, der bei jedem Aussetzer
# schreit, wird nach der dritten Fehlmeldung ignoriert.

name: Produktions-Wächter

on:
  schedule:
    # Alle 30 Minuten: nur die Zertifikate.
    - cron: '*/30 * * * *'
    # Täglich 04:17 UTC: zusätzlich die beiden Server-Blicke. Abseits der
    # vollen Stunde, damit der Lauf nicht mit den Deploy-Wellen konkurriert.
    - cron: '17 4 * * *'
  workflow_dispatch:
    # ── APPWRITE-ZERTIFIKAT (Vorfall 2026-10-16, s. Job `appwrite-cert`) ──
    # Drei Schalter, alle standardmäßig AUS. Ohne Schalter verhält sich ein
    # manueller Start wie bisher (tls + server). Mit Schalter laufen NUR die
    # Appwrite-Schritte — die Wächter-Jobs bleiben dann still.
    inputs:
      alarm_drill:
        description: 'PROBEALARM: Health-Blick absichtlich rot — prüft Issue/Mail/Heartbeat; nächster Lauf ohne Haken räumt auf'
        type: boolean
        default: false
      appwrite_probe:
        description: 'appwrite-prod: nur lesen (Erreichbarkeit, Container, Zertifikat)'
        type: boolean
        default: false
      appwrite_renew:
        description: 'appwrite-prod: Zertifikat für api.pukalani.app erneuern (ssl-Kommando)'
        type: boolean
        default: false
      appwrite_reset_account:
        description: 'appwrite-prod: veraltetes Let''s-Encrypt-Konto beiseitelegen, dann erneuern'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Ein manueller Appwrite-Lauf darf den Halbstunden-Takt nicht abschießen
  # (und umgekehrt): eigene Gruppe je Auslöser.
  group: production-watch-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ── ALLE 30 MINUTEN ──────────────────────────────────────────────────────
  # Braucht bewusst KEIN Secret und kein ssh: reiner TLS-Handshake von aussen.
  # Deshalb ein eigener Job — er soll nicht daran scheitern können, dass ein
  # Deploy-Schlüssel fehlt.
  tls:
    runs-on: ubuntu-latest
    if: >
      github.event.repository.fork == false &&
      !(inputs.appwrite_probe || inputs.appwrite_renew || inputs.appwrite_reset_account)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Macht aus einem stillen Nichtstun einen roten Lauf: passt der Zeitplan
      # zu keinem bekannten cron, hat jemand oben eine Zeile geändert, ohne die
      # Bedingungen mitzuziehen — dann liefe der tägliche Teil nie wieder.
      - name: Zeitplan bekannt?
        if: github.event_name == 'schedule'
        env:
          PLAN: ${{ github.event.schedule }}
        run: |
          set -u
          case "$PLAN" in
            '*/30 * * * *'|'17 4 * * *') echo "Zeitplan: $PLAN" ;;
            *)
              echo "::error::Unbekannter Zeitplan '$PLAN' — cron geändert, aber die Bedingungen in diesem Workflow nicht. Der tägliche Teil läuft so nie."
              exit 1 ;;
          esac

      - name: Zertifikate prüfen
        run: node scripts/ops/verify-tls.mjs

      # `always()`: ein TLS-Befund darf den Health-Blick nicht verdecken — im
      # Oktober war BEIDES kaputt, und man will beides im selben Lauf sehen.
      # `alarm_drill` ist nur bei workflow_dispatch gesetzt; im Zeitplan ist
      # `inputs.*` leer und der Ausdruck ergibt '0'.
      - name: Erreichbarkeit prüfen (ok:true auf jedem Host)
        if: always()
        env:
          PUKALANI_HEALTH_DRILL: ${{ inputs.alarm_drill && '1' || '0' }}
        run: node scripts/ops/verify-health.mjs

  # ── TÄGLICH ──────────────────────────────────────────────────────────────
  server:
    runs-on: ubuntu-latest
    # NEGATIV formuliert, und das ist Absicht: „alles ausser dem
    # Halbstunden-Takt" überlebt eine Änderung der TÄGLICHEN cron-Zeile. Stünde
    # hier `== '17 4 * * *'`, liefe dieser Job nach einer Verschiebung der
    # Uhrzeit nie wieder — lautlos. So bleibt genau EINE Zeichenkette
    # bedeutungstragend, und die prüft der Schritt „Zeitplan bekannt?" oben.
    if: >
      github.event.repository.fork == false &&
      github.event.schedule != '*/30 * * * *' &&
      !(inputs.appwrite_probe || inputs.appwrite_renew || inputs.appwrite_reset_account)
    env:
      SERVER: '49.13.211.173'
      SERVER_HOSTKEY: '49.13.211.173 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAVud82T4BSPvg5wH84jnRuP+JdG2hP52FAf+h9ckcCe'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: SSH einrichten (gepinnter Host-Key)
        env:
          SSH_KEY: ${{ secrets.PLOI_SSH_KEY }}
        run: |
          set -u
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret PLOI_SSH_KEY fehlt — der Produktions-Wächter kann den Server nicht erreichen."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ops_key
          chmod 600 ~/.ssh/ops_key
          printf '%s\n' "$SERVER_HOSTKEY" > ~/.ssh/known_hosts
          printf 'IdentityFile ~/.ssh/ops_key\nIdentitiesOnly yes\n' >> ~/.ssh/config

      - name: Env-Variablen der Sites prüfen
        env:
          PUKALANI_OPS_SSH: ploi@49.13.211.173
        run: node scripts/ops/verify-site-env.mjs

      # `always()`: ein Befund oben darf den zweiten Blick nicht verdecken.
      - name: Zugänge auf gelöschte Projekte prüfen
        if: always()
        env:
          PUKALANI_OPS_SSH: ploi@49.13.211.173
        run: node scripts/ops/verify-stale-keys.mjs --ssh --strict

      - name: Hat jede Instanz noch ein Admin-Konto?
        if: always()
        env:
          PUKALANI_OPS_SSH: ploi@49.13.211.173
        run: node scripts/ops/verify-instance-admins.mjs --ssh --strict

      # Blick 1 liest die pm2-Fehlerlogs auf app-prod (nur die Event-Zeile,
      # kein Request-Inhalt). Blick 2 zählt bei Resend — ohne das Secret wird
      # er übersprungen und bleibt grün (Klickliste im Runbook).
      - name: Mail-Missbrauch? (Notbremse im Log, Resend-Zähler)
        if: always()
        env:
          PUKALANI_OPS_SSH: ploi@49.13.211.173
          RESEND_API_KEY: ${{ secrets.PRODUCTION_WATCH_RESEND_KEY }}
        run: node scripts/ops/verify-mail-breaker.mjs --ssh --resend --strict

  # ── ALARMWEG: AUS EINEM ROTEN LAUF EINEN ZUSTAND MACHEN ─────────────────
  # Läuft nach JEDEM Wächter-Lauf (nicht nach den manuellen Appwrite-Jobs).
  # `always()`: gerade wenn oben etwas rot ist, muss dieser Job laufen.
  # `!cancelled()`: ein von der Concurrency abgebrochener Lauf ist kein
  # Befund und darf weder ein Issue öffnen noch eines schließen.
  alarm:
    runs-on: ubuntu-latest
    needs: [tls, server]
    if: >
      always() && !cancelled() &&
      github.event.repository.fork == false &&
      !(inputs.appwrite_probe || inputs.appwrite_renew || inputs.appwrite_reset_account)
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: produktions-alarm
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TLS_RESULT: ${{ needs.tls.result }}
      SERVER_RESULT: ${{ needs.server.result }}
      DRILL: ${{ inputs.alarm_drill && '1' || '0' }}
    steps:
      # Ergebnis der Wächter in EINEN Zustand übersetzen. `skipped` ist kein
      # Fehler (der tägliche Job läuft im Halbstunden-Takt nicht).
      - name: Issue öffnen, bestätigen oder schließen
        id: issue
        run: |
          # STRENG: bricht dieser Schritt ab, ist der Lauf rot und der
          # Heartbeat bleibt aus — ein kaputter Alarmweg darf nicht grün
          # aussehen (der erste Probealarm, 2026-10-28, starb genau so: ein
          # `null` aus jq, ein Rechenfehler, Job trotzdem grün).
          set -euo pipefail
          rot=""
          [ "$TLS_RESULT" = "failure" ] && rot="$rot Zertifikate/Erreichbarkeit (alle 30 min)"
          [ "$SERVER_RESULT" = "failure" ] && rot="$rot Server-Blicke (täglich: Env, Zugänge, Admin-Konto, Mail)"
          echo "tls=$TLS_RESULT server=$SERVER_RESULT rot='${rot# }' drill=$DRILL"

          # Label einmalig sicherstellen (--force: vorhandenes nur aktualisieren).
          gh label create "$LABEL" --color B60205 --force \
            --description 'Produktions-Wächter rot — offen = Alarm aktiv, zu = Entwarnung' >/dev/null

          # Leere Liste ⇒ leere Zeichenkette (NICHT "null null" — Probealarm 1).
          offen=$(gh issue list --label "$LABEL" --state open --limit 1 --json number,updatedAt \
            --jq 'if length > 0 then "\(.[0].number) \(.[0].updatedAt)" else "" end')
          nummer="${offen%% *}"; zuletzt="${offen#* }"
          stand=$(date -u +'%Y-%m-%d %H:%M UTC')
          wechsel="keiner"

          if [ -n "$rot" ] && [ -z "$nummer" ]; then
            probe=""; [ "$DRILL" = "1" ] && probe=" (Probealarm)"
            titel="🔴 Produktions-Alarm${probe}:${rot} — $stand"
            {
              echo "Der Produktions-Wächter ist ROT. Betroffen:**${rot}**."
              echo
              echo "- Lauf: $RUN_URL"
              echo "- Was zuerst tun: \`docs/runbooks/PRODUKTIONS-ALARM.md\`, Abschnitt „Wenn ein Alarm kommt\" (Appwrite-Zertifikat, ok:false, Mail-Missbrauch)."
              echo "- Dieses Issue schließt der Wächter SELBST, sobald ein Lauf wieder grün ist. Solange es offen ist, ist der Alarm aktiv."
              [ "$DRILL" = "1" ] && echo "- **PROBEALARM**: absichtlich ausgelöst über \`alarm_drill\`; der nächste Lauf ohne Schalter räumt auf."
              echo
              echo "_Erzeugt vom Job \`alarm\` in \`.github/workflows/production-watch.yml\` (MON1)._"
            } > /tmp/issue-body.md
            url=$(gh issue create --title "$titel" --label "$LABEL" --body-file /tmp/issue-body.md)
            echo "Issue geöffnet: $url"
            wechsel="alarm"
          elif [ -n "$rot" ]; then
            # Weiterhin rot: alle 12 h ein Lebenszeichen, nicht alle 30 min.
            alt=$(( $(date -u +%s) - $(date -u -d "$zuletzt" +%s) ))
            if [ "$alt" -ge 43200 ]; then
              gh issue comment "$nummer" --body "Weiterhin rot ($stand):${rot}. Lauf: $RUN_URL" >/dev/null
              echo "Issue #$nummer: weiterhin rot, Kommentar gesetzt (zuletzt vor $((alt / 3600)) h)."
            else
              echo "Issue #$nummer ist offen (zuletzt vor $((alt / 60)) min) — nichts zu tun."
            fi
          elif [ -n "$nummer" ]; then
            gh issue comment "$nummer" --body "✅ Entwarnung ($stand): alle Wächter wieder grün. Lauf: $RUN_URL" >/dev/null
            gh issue close "$nummer" --reason completed >/dev/null
            echo "Issue #$nummer geschlossen (Entwarnung)."
            wechsel="entwarnung"
          else
            echo "Alles grün, kein offenes Alarm-Issue."
          fi
          # Die Folge-Schritte prüfen EXPLIZIT auf diese Werte: fehlen sie
          # (Schritt abgebrochen), läuft weder Mail noch Heartbeat.
          echo "wechsel=$wechsel" >> "$GITHUB_OUTPUT"
          echo "rot=${rot# }" >> "$GITHUB_OUTPUT"
          [ -z "$rot" ] && echo "gruen=1" >> "$GITHUB_OUTPUT" || echo "gruen=0" >> "$GITHUB_OUTPUT"

      # Mail NUR bei einem Wechsel (Alarm / Entwarnung) — nie im Takt.
      # Ohne Secret+Variable: sichtbar übersprungen, nicht rot (das Fehlen
      # eines Alarmwegs ist in diesem Lauf kein Vorfall — aber im Runbook
      # eine offene Klickzeile).
      - name: Mail bei Alarm oder Entwarnung (Resend)
        if: steps.issue.outputs.wechsel == 'alarm' || steps.issue.outputs.wechsel == 'entwarnung'
        env:
          WECHSEL: ${{ steps.issue.outputs.wechsel }}
          ROT: ${{ steps.issue.outputs.rot }}
          RESEND_KEY: ${{ secrets.PRODUCTION_ALARM_RESEND_KEY }}
          MAIL_TO: ${{ vars.PRODUCTION_ALARM_MAIL_TO }}
        run: |
          set -u
          if [ -z "$RESEND_KEY" ] || [ -z "$MAIL_TO" ]; then
            echo "::warning::Mail-Alarm nicht eingerichtet (Secret PRODUCTION_ALARM_RESEND_KEY + Variable PRODUCTION_ALARM_MAIL_TO) — Klickliste: docs/runbooks/PRODUKTIONS-ALARM.md"
            exit 0
          fi
          if [ "$WECHSEL" = "alarm" ]; then
            betreff="🔴 Produktions-Alarm: $ROT"
            text="Der Produktions-Wächter ist rot: $ROT. Lauf: $RUN_URL — Issue-Liste: ${{ github.server_url }}/${{ github.repository }}/issues?q=label%3Aproduktions-alarm"
          else
            betreff="✅ Entwarnung: Produktions-Wächter wieder grün"
            text="Alle Wächter sind wieder grün. Lauf: $RUN_URL"
          fi
          jq -n --arg to "$MAIL_TO" --arg s "$betreff" --arg t "$text" \
            '{from: "Produktions-Wächter <noreply@pukalani.app>", to: [$to], subject: $s, text: $t}' \
            > /tmp/mail.json
          code=$(curl -sS -o /tmp/mail-out.json -w '%{http_code}' -m 20 \
            -H "Authorization: Bearer $RESEND_KEY" -H 'Content-Type: application/json' \
            --data @/tmp/mail.json https://api.resend.com/emails)
          if [ "$code" != "200" ]; then
            echo "::error::Resend antwortet HTTP $code — Alarm-Mail NICHT raus (Schlüssel widerrufen?):"; cat /tmp/mail-out.json; echo
            exit 1
          fi
          echo "Mail an $MAIL_TO: $betreff"

      # Heartbeat NUR bei grün — bleibt er aus (rot ODER Workflow läuft gar
      # nicht mehr), meldet UptimeRobot nach dem dort eingestellten Fenster.
      - name: Heartbeat (nur bei grün)
        if: steps.issue.outputs.gruen == '1'
        env:
          HEARTBEAT_URL: ${{ secrets.PRODUCTION_WATCH_HEARTBEAT_URL }}
        run: |
          set -u
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "::warning::Heartbeat nicht eingerichtet (Secret PRODUCTION_WATCH_HEARTBEAT_URL) — Klickliste: docs/runbooks/PRODUKTIONS-ALARM.md"
            exit 0
          fi
          curl -fsS -m 20 -o /dev/null "$HEARTBEAT_URL" && echo "Heartbeat gesendet."

  # ── NUR MANUELL: APPWRITE-ZERTIFIKAT ─────────────────────────────────────
  # Vorfall 2026-10-16: das Let's-Encrypt-Zertifikat von api.pukalani.app lief
  # ab, weil Appwrites Erneuerung seit dem 2026-09-17 an „Unable to validate
  # JWS :: Account … not found" scheiterte (das gespeicherte ACME-Konto
  # existiert bei Let's Encrypt nicht mehr). Jede App ruft Appwrite per
  # Node-fetch auf → TLS-Fehler → /api/health 502 auf demo, portfolio,
  # control, comments. Dieser Job ist der Hebel, wenn niemand am Mac sitzt.
  #
  # Zugang: derselbe Deploy-Key wie oben (PLOI_SSH_KEY). Ob er auf appwrite-
  # prod freigeschaltet ist, zeigt die Probe — sie scheitert dann sichtbar.
  # Host-Key von appwrite-prod ist NICHT gepinnt (es gibt keinen bekannten
  # Wert im Repo); `accept-new` ist hier bewusst — die Probe gibt den
  # Fingerprint aus, damit er beim nächsten Mal gepinnt werden kann.
  appwrite-cert:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      (inputs.appwrite_probe || inputs.appwrite_renew || inputs.appwrite_reset_account)
    env:
      APPWRITE_SERVER: '188.245.61.155'
      APPWRITE_DOMAIN: 'api.pukalani.app'
      APP_SERVER: '49.13.211.173'
      APP_SERVER_HOSTKEY: '49.13.211.173 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAVud82T4BSPvg5wH84jnRuP+JdG2hP52FAf+h9ckcCe'
    steps:
      - name: SSH einrichten
        env:
          SSH_KEY: ${{ secrets.PLOI_SSH_KEY }}
        run: |
          set -u
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret PLOI_SSH_KEY fehlt."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ops_key
          chmod 600 ~/.ssh/ops_key
          printf '%s\n' "$APP_SERVER_HOSTKEY" > ~/.ssh/known_hosts
          printf 'IdentityFile ~/.ssh/ops_key\nIdentitiesOnly yes\nBatchMode yes\nConnectTimeout 20\n' >> ~/.ssh/config
          printf 'Host appwrite-prod\n  HostName %s\n  User ploi\n  StrictHostKeyChecking accept-new\n' "$APPWRITE_SERVER" >> ~/.ssh/config
          printf 'Host app-prod\n  HostName %s\n  User ploi\n' "$APP_SERVER" >> ~/.ssh/config

      - name: Zertifikat von außen (vorher)
        run: |
          echo | openssl s_client -connect "$APPWRITE_DOMAIN:443" -servername "$APPWRITE_DOMAIN" 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates || echo "kein Zertifikat lesbar"

      - name: Probe
        if: inputs.appwrite_probe
        run: |
          set -u
          echo "Host-Key appwrite-prod (zum Pinnen):"
          ssh-keyscan -t ed25519 -T 10 "$APPWRITE_SERVER" 2>/dev/null | sed 's/^/  /' || true
          echo
          echo "::group::Direkt: ploi@appwrite-prod"
          if ssh appwrite-prod 'hostname; uptime; df -h / | tail -1; cd ~/appwrite && docker compose ps --format "{{.Name}}\t{{.Status}}" | sort'; then
            echo "DIREKT: ok"
          else
            echo "DIREKT: fehlgeschlagen (Key dort nicht freigeschaltet oder Host nicht erreichbar)"
          fi
          echo "::endgroup::"
          echo "::group::Hop über app-prod"
          ssh app-prod 'ls -la ~/.ssh 2>/dev/null; echo "--- config ---"; cat ~/.ssh/config 2>/dev/null; echo "--- hop ---"; ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new ploi@188.245.61.155 hostname' \
            || echo "HOP: fehlgeschlagen"
          echo "::endgroup::"
          echo "::group::Zertifikats-Worker (letzte 40 Zeilen)"
          ssh appwrite-prod 'cd ~/appwrite && SVC=$(docker compose ps --services | grep -E "^appwrite-worker(-certificates)?$" | head -1) && echo "Worker-Dienst: $SVC" && docker compose logs --tail 40 "$SVC"' || true
          echo "::endgroup::"

      - name: Let's-Encrypt-Konto beiseitelegen
        if: inputs.appwrite_reset_account
        run: |
          set -u
          ssh appwrite-prod 'set -u; cd ~/appwrite
            SVC=$(docker compose ps --services | grep -E "^appwrite-worker(-certificates)?$" | head -1)
            echo "Worker-Dienst: $SVC"
            grep -c "^_APP_SYSTEM_SECURITY_EMAIL_ADDRESS=.\+" .env >/dev/null || { echo "::error::_APP_SYSTEM_SECURITY_EMAIL_ADDRESS fehlt in .env — ohne Adresse kann certbot kein neues Konto anlegen."; exit 1; }
            DIRS=$(docker compose exec -T "$SVC" sh -c "find / -maxdepth 8 -type d -name acme-v02.api.letsencrypt.org -path \"*accounts*\" 2>/dev/null")
            if [ -z "$DIRS" ]; then echo "Kein gespeichertes ACME-Konto gefunden — nichts beiseitezulegen."; exit 0; fi
            for D in $DIRS; do
              echo "Lege beiseite: $D -> $D.alt-$(date +%Y%m%d%H%M)"
              docker compose exec -T "$SVC" sh -c "mv \"$D\" \"$D.alt-$(date +%Y%m%d%H%M)\""
            done'

      - name: Zertifikat erneuern
        if: inputs.appwrite_renew || inputs.appwrite_reset_account
        run: |
          set -u
          ssh appwrite-prod 'set -u; cd ~/appwrite
            SVC=$(docker compose ps --services | grep -E "^appwrite-worker(-certificates)?$" | head -1)
            echo "ssl --domain='"$APPWRITE_DOMAIN"'"
            docker compose exec -T appwrite ssl --domain="'"$APPWRITE_DOMAIN"'" || true
            echo "warte 60 s auf den Worker …"; sleep 60
            echo "::group::Worker-Log"; docker compose logs --since 3m "$SVC"; echo "::endgroup::"'

      - name: Zertifikat von außen (nachher) — muss gültig sein
        if: inputs.appwrite_renew || inputs.appwrite_reset_account
        run: |
          set -u
          NOT_AFTER=$(echo | openssl s_client -connect "$APPWRITE_DOMAIN:443" -servername "$APPWRITE_DOMAIN" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          echo "notAfter: $NOT_AFTER"
          END=$(date -d "$NOT_AFTER" +%s); NOW=$(date +%s)
          if [ "$END" -le "$NOW" ]; then
            echo "::error::Zertifikat ist weiterhin abgelaufen — siehe Worker-Log oben."
            exit 1
          fi
          echo "Gültig noch $(( (END - NOW) / 86400 )) Tage."
          for H in demo.pukalani.app portfolio.pukalani.app comments.pukalani.app; do
            printf '%-26s ' "$H"; curl -s -o /dev/null -w '%{http_code}\n' "https://$H/api/health" || echo "?"
          done
