# DIE BÜHNE (OPS-009): der echte Kundenpfad im Pool, automatisch.
#
# Die E2E-Suite (e2e.yml) fährt die Einzel-Instanz `apps/comments` — eine App
# ohne Mandanten. Die häufigste Fehlerklasse liegt aber dort, wo VIELE
# Communities in einem Projekt leben: eine Route, die nicht fragt, ob jemand
# hierher gehört. Dieser Lauf baut deshalb auf derselben Wegwerf-Appwrite
# zwei Projekte (`admin` = Control Plane, `account` = Pool), startet die
# Betreiber-App und den Platform-Server aus dem Checkout, legt zwei
# Probe-Communities mit Konten je Rolle an (`pnpm buehne up`) und fährt die
# Beweise dagegen. Am Ende wird alles wieder abgebaut und NACHGEZÄHLT.
#
# NACHTS KOMMT EIN DRITTES PROJEKT DAZU: `comments` mit `apps/comments` als
# Einzel-Instanz (ohne Mandanten, mit Demo-Daten) auf eigenem Port. Die
# Beweise, die sie brauchen (`braucht: ['einzel']`), räumen selbst auf und
# zählen nach; an Pull Requests und auf main steht sie nicht.
#
# NACHTS KOMMT AUCH EIN VIERTES PROJEKT DAZU (seit 2026-11-18, BT1 a):
# `branding` mit `apps/branding` (branding.supply) auf eigenem Port. Der
# Server läuft dort mit GESTELLTEN ANTWORTEN (`BRAND_DEV_STUB_*`,
# `MARKET_DEV_STUB`) und darf fremde Websites nur auf dem eigenen Rechner
# abrufen (`BRAND_SITE_FETCH_ALLOW_LOOPBACK`, die Beweise liefern ihre
# Probe-Seiten selbst aus). Kein KI-Schlüssel, kein Stripe-Schlüssel in der
# `.env` — ein echter Aufruf wäre ohne Schlüssel gar nicht möglich.
#
# KEIN TOR FÜRS AUSLIEFERN: `deploy.yml` hört auf „Test" und „E2E (Appwrite)",
# nicht auf diesen Lauf, und er ist keine Pflicht-Prüfung am Pull Request (das
# wäre eine GitHub-Einstellung). Er läuft NEBEN den Pflicht-Prüfungen, ein
# Pull Request wartet deshalb nicht länger.
#
# WELCHE BEWEISE LAUFEN, steht an EINER Stelle: `scripts/buehne/beweise.mjs`
# (eine Zeile je Skript: e2e · buehne · nacht · hand mit Grund). Der Läufer
# `pnpm buehne run` fährt sie und schreibt eine Tabelle in die
# Zusammenfassung des Laufs. Ein neues Skript ohne Einteilung macht
# `pnpm check:live-beweise` und einen Test rot.
#
# ROT AUF main ODER NACHTS ⇒ ALARM: der Job `alarm` öffnet das Issue
# `buehne-alarm` (offen = Alarm, der nächste grüne Lauf schließt es; kam der
# Alarm aus dem Nacht-Lauf, schließt ihn nur ein grüner Nacht-Lauf) — derselbe
# Weg wie beim Produktions-Wächter (docs/runbooks/PRODUKTIONS-ALARM.md), ohne
# Secret. Ein roter Lauf an einem Pull Request öffnet nichts; er steht dort.
#
# WAS DIESER LAUF NICHT BEWEIST (steht auch in .claude/rules/tests.md):
#  · Production hat die direkten Anmelde-Wege der Datenbank AUS, die CI hat
#    sie AN — dass niemand an unserer Anmeldung vorbeikommt, zeigt er nicht.
#  · Die Server laufen als Entwicklungs-Server, nicht als gebauter Stand, und
#    hinter keinem Webserver (keine Kopfzeilen des Proxys, keine 60-s-Frist).
#  · Die Datenbank ist leer: keine Bestands-Communities, keine alten Zeilen.
#  · Kein Fremddienst: kein Stripe, keine KI, kein Mail-Versand nach draußen.
#
# Die Schritte bis „Auf Appwrite warten" sind dieselben wie in e2e.yml — dort
# stehen die Begründungen (Start im Hintergrund, Instanz-Schlüssel je Lauf).
name: Bühne (Kundenpfad)

on:
  push:
    branches: [main]
  pull_request:
  # NACHTS die langen Beweise (Skripte mit Wartezeiten, ab rund einer Minute).
  # Welche das sind, steht in `scripts/buehne/beweise.mjs` (`lauf: 'nacht'`).
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      lauf:
        description: 'Welche Beweise: buehne (kurz) oder nacht (kurz + lang)'
        type: choice
        options: [buehne, nacht]
        default: buehne
      alarm_drill:
        description: 'Probealarm: tut so, als wäre der Lauf rot (öffnet das Alarm-Issue)'
        type: boolean
        default: false

# Rechte stehen je Job (SEC-041): ohne eigene Angabe hat ein Job keine.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Wie in e2e.yml: auf einem Zweig darf ein überholter Stand abgebrochen
  # werden, auf `main` nicht.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  buehne:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Der nächtliche Lauf fährt auch die langen Beweise.
    timeout-minutes: 60
    env:
      PLATFORM_PORT: '3150'
      CONTROL_PORT: '3004'
      # Die Einzel-Instanz (nur nachts): derselbe Port wie in e2e.yml.
      EINZEL_PORT: '3001'
      # branding.supply (nur nachts): der Port aus den Köpfen der Beweis-Skripte.
      BRANDING_PORT: '3016'
      CONTROL_HOST: app.localhost
      SMTP_PORT: '1025'
      # Zeitplan ⇒ nacht; von Hand ⇒ die Eingabe; sonst (Pull Request, Push) ⇒ buehne.
      LAUF: ${{ github.event_name == 'schedule' && 'nacht' || inputs.lauf || 'buehne' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lokaler Briefkasten für ALLE Mails dieses Laufs (Einladung, Hinweis,
      # Zahlungswarnung der Apps; Anmelde-Code der Datenbank): nichts verlässt
      # den Runner. Über Version UND Prüfsumme festgelegt, wie die Actions
      # über einen Commit. Steht VOR dem Stack, weil die Datenbank seine
      # Adresse beim Start braucht.
      - name: Briefkasten starten (Mailpit)
        run: >
          docker run -d --name buehne-mailpit
          -p "$SMTP_PORT:1025" -p 8025:8025
          axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce

      # Der Instanz-Schlüssel je Lauf (wie in e2e.yml) — und der MAIL-WEG DER
      # DATENBANK: ohne Mail-Server bietet Appwrite den Anmelde-Code per Mail
      # nicht an, der passwortlose Weg antwortete dann anders als auf
      # Production. Die Container erreichen den Briefkasten über die Adresse
      # des Docker-Hosts (aus dem Standard-Netz gelesen, nicht geraten).
      - name: Appwrite-Instanzschlüssel und Mail-Weg setzen
        working-directory: ci/appwrite
        run: |
          gateway=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          if [ -z "$gateway" ]; then
            echo '::error::Adresse des Docker-Hosts nicht gefunden'
            exit 1
          fi
          {
            printf '\n_APP_OPENSSL_KEY_V1=%s\n' "$(openssl rand -hex 16)"
            printf '_APP_SMTP_HOST=%s\n' "$gateway"
            printf '_APP_SMTP_PORT=%s\n' "$SMTP_PORT"
          } >> ci.env

      - name: Appwrite-Stack starten (im Hintergrund)
        working-directory: ci/appwrite
        run: |
          (
            docker compose --env-file ci.env --project-name appwrite-ci up -d \
              traefik appwrite appwrite-realtime appwrite-geo \
              appwrite-worker \
              mariadb redis
            echo $? > "$RUNNER_TEMP/stack.rc"
          ) > "$RUNNER_TEMP/stack.log" 2>&1 &
          echo "Stack-Start laeuft im Hintergrund — Node-Setup und Install ziehen vor."

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Auf Appwrite warten
        run: |
          for i in $(seq 1 600); do
            if [ -f "$RUNNER_TEMP/stack.rc" ]; then break; fi
            sleep 0.5
          done
          rc=$(cat "$RUNNER_TEMP/stack.rc" 2>/dev/null || echo 'timeout')
          if [ "$rc" != "0" ]; then
            echo '::error::Stack-Start fehlgeschlagen (Rueckgabe '"$rc"')'
            cat "$RUNNER_TEMP/stack.log" || true
            exit 1
          fi
          for i in $(seq 1 450); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health/version || true)
            if [ "$code" = "200" ]; then
              echo "Appwrite bereit: $(curl -s http://localhost:8080/v1/health/version)"
              exit 0
            fi
            sleep 1
          done
          echo '::error::Appwrite nach 450s nicht erreichbar'
          docker compose --env-file ci/appwrite/ci.env --project-name appwrite-ci -f ci/appwrite/docker-compose.yml logs --tail 80 appwrite mariadb
          exit 1

      # Zwei Projekte, zwei .env-Dateien, ein Naht-Geheimnis je Lauf. Die
      # Ausgabe nennt nur Schritte und Zahlen — das Protokoll ist öffentlich.
      - name: Bühnen-Setup (Projekte admin + account, nachts auch comments + branding)
        run: >
          node scripts/ci/buehne-setup.mjs
          --endpoint http://localhost:8080/v1
          --control-port "$CONTROL_PORT"
          --platform-port "$PLATFORM_PORT"
          --control-host "$CONTROL_HOST"
          --smtp-port "$SMTP_PORT"
          ${{ env.LAUF == 'nacht' && '--einzel-port "$EINZEL_PORT" --branding-port "$BRANDING_PORT"' || '' }}

      # Beide Datenbanken NEBENEINANDER: verschiedene Projekte, dieselbe
      # Instanz. Die Protokolle wandern in Dateien und werden nacheinander
      # gezeigt, sonst wäre nicht lesbar, welcher Lauf welche Zeile schrieb.
      - name: Bootstrap beider Projekte (DB, Buckets, Migrationen)
        run: |
          node --env-file=apps/control/.env scripts/bootstrap.mjs --app control > "$RUNNER_TEMP/bootstrap-control.log" 2>&1 &
          control_pid=$!
          node --env-file=apps/platform/.env scripts/bootstrap.mjs --app platform > "$RUNNER_TEMP/bootstrap-platform.log" 2>&1 &
          platform_pid=$!
          control_rc=0
          platform_rc=0
          wait "$control_pid" || control_rc=$?
          wait "$platform_pid" || platform_rc=$?
          echo "── Control Plane (admin): Rueckgabe $control_rc"
          tail -n 15 "$RUNNER_TEMP/bootstrap-control.log"
          echo "── Pool (account): Rueckgabe $platform_rc"
          tail -n 15 "$RUNNER_TEMP/bootstrap-platform.log"
          if [ "$control_rc" != "0" ] || [ "$platform_rc" != "0" ]; then
            echo '::error::Bootstrap fehlgeschlagen — vollstaendige Protokolle folgen'
            cat "$RUNNER_TEMP/bootstrap-control.log" "$RUNNER_TEMP/bootstrap-platform.log"
            exit 1
          fi

      # Dieselben Anmelde-Regeln wie in Production (P29), für das Projekt
      # aller Konten. Nach dem Bootstrap, mit Zurücklesen.
      - name: Anmelde-Regeln setzen (Pool-Projekt)
        run: node --env-file=apps/platform/.env scripts/ops/appwrite-auth-policies.mjs --apply

      # ── DIE EINZEL-INSTANZ (nur nachts) ─────────────────────────────────
      # Ein DRITTES Projekt auf derselben Wegwerf-Appwrite: `apps/comments`
      # als Einzel-Instanz ohne Mandanten, wie in e2e.yml (Projekt `comments`
      # — die Id ist nicht frei, der Migrations-Runner prüft sie gegen
      # `site.manifest.ts`), mit Demo-Daten. Projekt und `.env` legt schon das
      # Bühnen-Setup an (`--einzel-port`, nur nachts): die Console lässt nur
      # EINEN Account zu, ein zweites Setup-Skript scheiterte mit 501. Die
      # Beweise mit `braucht: ['einzel']` in `scripts/buehne/beweise.mjs`
      # laufen gegen sie; ohne sie meldet der Läufer sie als „übersprungen".
      # Nur bei LAUF=nacht, damit der Lauf an Pull Requests und auf main nicht
      # länger wird.
      - name: Einzel-Instanz — Bootstrap mit Demo-Daten, Anmelde-Regeln
        if: env.LAUF == 'nacht'
        run: |
          pnpm --filter comments run bootstrap --seed
          node --env-file=apps/comments/.env scripts/ops/appwrite-auth-policies.mjs --apply

      # ── BRANDING.SUPPLY (nur nachts) ────────────────────────────────────
      # Das VIERTE Projekt: `branding` (die Id ist nicht frei, s. o.). Die App
      # hat keine Demo-Daten und braucht keine — jeder Beweis legt an, was er
      # prüft, und räumt es wieder ab. `bootstrap` läuft hier über das
      # Wurzel-Skript: `apps/branding` hat kein eigenes `bootstrap`-Skript.
      - name: branding.supply — Bootstrap, Anmelde-Regeln
        if: env.LAUF == 'nacht'
        run: |
          node --env-file=apps/branding/.env scripts/bootstrap.mjs --app branding
          node --env-file=apps/branding/.env scripts/ops/appwrite-auth-policies.mjs --apply

      # ZWEI ENTWICKLUNGS-SERVER aus dem Checkout. Gewartet wird auf
      # `/api/health` — die Betreiber-App antwortet mit 200, der
      # Platform-Server zusätzlich mit `ok: true` (ohne die vier
      # Control-Variablen lehnte er jede Anfrage ab, SEC-025). Nitro bündelt
      # die API-Routen beim Start; Seiten kompiliert der Server erst beim
      # ersten Zugriff, deshalb prüfen die Beweise hier Routen, keine Seiten.
      #
      # EINTRITTSKARTE (PK1 E1c): NACHTS läuft der Platform-Server im Modus
      # `write` mit einem je Lauf zufällig erzeugten Schlüssel — kein
      # Geheimnis im Repo, keins in den Secrets, verfällt mit dem Lauf. So
      # laufen die Beweise nachts so, wie Production nach dem Einschalten
      # läuft (Anmelden je Host, `verify-site-card`). Pull Requests und `main`
      # bleiben `off` wie Production heute. Runbook:
      # docs/runbooks/PK1-EINSCHALTEN.md.
      - name: Betreiber-App und Platform-Server starten
        run: |
          (cd apps/control && nohup pnpm exec nuxi dev --port "$CONTROL_PORT" > "$RUNNER_TEMP/control.log" 2>&1 &)
          if [ "$LAUF" = 'nacht' ]; then
            SITE_CARD_KEY="$(openssl rand -base64 32)"
            echo "::add-mask::$SITE_CARD_KEY"
            (cd apps/platform && NUXT_SITE_CARD_MODE=write NUXT_SITE_CARD_KEY="$SITE_CARD_KEY" nohup pnpm exec nuxi dev --port "$PLATFORM_PORT" > "$RUNNER_TEMP/platform.log" 2>&1 &)
            unset SITE_CARD_KEY
            echo 'Platform-Server im Modus write (Eintrittskarte, Schlüssel je Lauf).'
          else
            (cd apps/platform && nohup pnpm exec nuxi dev --port "$PLATFORM_PORT" > "$RUNNER_TEMP/platform.log" 2>&1 &)
          fi
          # Der Entwicklungs-Server gibt JSON eingerückt aus ("ok": true) —
          # deshalb der Vergleich ohne Leerzeichen. Verlangt wird je Server
          # `ok` UND der Datenbank-Stand `ok` (alle Migrationen sind da).
          ready() {
            curl -s -m 5 "http://localhost:$1/api/health" | tr -d ' \n' | grep -q '"ok":true.*"state":"ok"'
          }
          # Nachts verlangt die Bereit-Prüfung zusätzlich die Karte im Modus
          # write mit Schlüssel — sonst liefen die Beweise still im alten Modus.
          card_ready() {
            [ "$LAUF" != 'nacht' ] && return 0
            curl -s -m 5 "http://localhost:$PLATFORM_PORT/api/health" | tr -d ' \n' | grep -q '"siteCard":{"mode":"write","cards":true'
          }
          for i in $(seq 1 240); do
            if ready "$CONTROL_PORT" && ready "$PLATFORM_PORT" && card_ready; then
              echo "Beide Server bereit nach ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo '::error::Die Server sind nach 240s nicht bereit'
          echo '── Antwort Betreiber-App'; curl -s -m 5 "http://localhost:$CONTROL_PORT/api/health" || true
          echo '── Antwort Platform-Server'; curl -s -m 5 "http://localhost:$PLATFORM_PORT/api/health" || true
          exit 1

      # Dritter Entwicklungs-Server, nur nachts. Danach einmal die Seiten
      # aufrufen, die die Beweise zuerst brauchen: der Server kompiliert jede
      # Seite beim ersten Zugriff (kalt 25 s und mehr), und das soll nicht in
      # der Zeitgrenze des ersten Beweises landen. Erst wenn alles steht, sagt
      # EINZEL_READY dem Läufer, dass er `--einzel-port` bekommt.
      - name: Einzel-Instanz starten (apps/comments)
        if: env.LAUF == 'nacht'
        run: |
          (cd apps/comments && nohup pnpm exec nuxi dev --port "$EINZEL_PORT" > "$RUNNER_TEMP/einzel.log" 2>&1 &)
          ready() {
            curl -s -m 5 "http://localhost:$EINZEL_PORT/api/health" | tr -d ' \n' | grep -q '"ok":true.*"state":"ok"'
          }
          for i in $(seq 1 240); do
            if ready; then
              echo "Einzel-Instanz bereit nach ${i}s."
              for page in / /discussions /courses /events; do
                code=$(curl -s -o /dev/null -m 120 -H 'accept: text/html' -w '%{http_code}' "http://localhost:$EINZEL_PORT$page" || true)
                echo "  vorgewärmt: $page → $code"
              done
              echo 'EINZEL_READY=1' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo '::error::Die Einzel-Instanz ist nach 240s nicht bereit'
          curl -s -m 5 "http://localhost:$EINZEL_PORT/api/health" || true
          exit 1

      # Vierter Entwicklungs-Server, nur nachts — mit GESTELLTEN ANTWORTEN:
      # `BRAND_DEV_STUB_*` und `MARKET_DEV_STUB` ersetzen jeden KI-Aufruf durch
      # eine feste Antwort (sie wirken nur außerhalb von Production),
      # `BRAND_SITE_FETCH_ALLOW_LOOPBACK` erlaubt dem Abruf fremder Websites
      # ausschließlich den eigenen Rechner — dort liefern die Beweise ihre
      # Probe-Seiten selbst aus. Kein Schlüssel für KI oder Stripe liegt in der
      # `.env`. Danach die Seiten aufrufen, die die Beweise zuerst brauchen
      # (kalt 25 s und mehr je Seite); erst dann sagt BRANDING_READY dem
      # Läufer, dass er `--branding-port` bekommt.
      - name: branding.supply starten (apps/branding, gestellte Antworten)
        if: env.LAUF == 'nacht'
        env:
          BRAND_DEV_STUB_CHECK: '1'
          BRAND_DEV_STUB_REVIEW: '1'
          BRAND_DEV_STUB_VISION: '1'
          BRAND_DEV_STUB_DNA: '1'
          BRAND_DEV_STUB_MARK: '1'
          BRAND_DEV_STUB_IMAGE: '1'
          MARKET_DEV_STUB: '1'
          BRAND_SITE_FETCH_ALLOW_LOOPBACK: '1'
        run: |
          (cd apps/branding && nohup pnpm exec nuxi dev --port "$BRANDING_PORT" > "$RUNNER_TEMP/branding.log" 2>&1 &)
          ready() {
            curl -s -m 5 "http://localhost:$BRANDING_PORT/api/health" | tr -d ' \n' | grep -q '"ok":true.*"state":"ok"'
          }
          for i in $(seq 1 240); do
            if ready; then
              echo "branding.supply bereit nach ${i}s."
              for page in / /de /erstgespraech /de/erstgespraech /brand-check/methodik /market-bot; do
                code=$(curl -s -o /dev/null -m 180 -H 'accept: text/html' -w '%{http_code}' "http://localhost:$BRANDING_PORT$page" || true)
                echo "  vorgewärmt: $page → $code"
              done
              echo 'BRANDING_READY=1' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo '::error::branding.supply ist nach 240s nicht bereit'
          curl -s -m 5 "http://localhost:$BRANDING_PORT/api/health" || true
          exit 1

      # Zwei Beweise der Einzel-Instanz tippen in einem echten Browser
      # (Erwähnungen), und die Browser-Tests auf der Bühne (`buehne.mjs e2e`,
      # weiter unten) brauchen ihn auch. Dieselben drei Schritte wie in
      # e2e.yml (Begründungen dort), ohne Cache — nachts zählt die Minute nicht.
      - name: Playwright — Systempakete und Chromium (nur nachts)
        if: env.LAUF == 'nacht'
        timeout-minutes: 12
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          pnpm --filter comments exec playwright install-deps chromium
          for attempt in 1 2; do
            if timeout 240 pnpm --filter comments exec playwright install chromium; then
              exit 0
            fi
            echo "::warning::Chromium-Download: Versuch $attempt fehlgeschlagen oder hing (240 s) — neuer Versuch"
            sleep 10
          done
          echo "::error::Chromium liess sich in zwei Versuchen nicht herunterladen."
          exit 1

      - name: Bühne aufbauen (zwei Communities, Konten je Rolle)
        run: node scripts/buehne/buehne.mjs up --platform-port "$PLATFORM_PORT" --control-host "$CONTROL_HOST"

      - name: Beweis — Rollen auf der Bühne (Anmelden, Mitglied, fremd, entfernt, Anlage über die echte Route)
        run: node scripts/buehne/buehne.mjs smoke

      # ALLE eingeteilten Beweise, einer nach dem anderen. Je Skript eine
      # aufklappbare Gruppe im Protokoll; die Tabelle (Skript, Ergebnis,
      # Zählung, Dauer) steht in der Zusammenfassung des Laufs. Ein roter
      # Beweis hält die übrigen nicht auf, der Schritt endet dann rot.
      # Ohne EINZEL_READY bzw. BRANDING_READY (Pull Request, main) kein
      # `--einzel-port` und kein `--branding-port`: die Beweise dieser zwei
      # Server stehen ohnehin nur auf `nacht`.
      - name: Beweise auf der Bühne (Einteilung aus scripts/buehne/beweise.mjs)
        # Nachts MUSS die Karte im Modus write laufen: verify-site-card ist
        # dann rot statt „übersprungen", wenn sie es nicht tut (PK1 E1c).
        env:
          EXPECT_SITE_CARD: ${{ env.LAUF == 'nacht' && 'write' || '' }}
        run: node scripts/buehne/buehne.mjs run --lauf "$LAUF" --control-port "$CONTROL_PORT" ${EINZEL_READY:+--einzel-port "$EINZEL_PORT"} ${BRANDING_READY:+--branding-port "$BRANDING_PORT"}

      # Acht Test-Dateien prüfen die Trennung der Communities gegen eine
      # ECHTE Datenbank und werden ohne sie übersprungen — in `test.yml` also
      # immer. Hier steht die Datenbank; verlangt wird: nichts übersprungen.
      - name: Isolations-Tests gegen die echte Datenbank (sonst übersprungen)
        run: |
          lauf() {
            envfile="$1"; shift
            ( set -a; . "$envfile"; set +a; "$@" ) | tee "$RUNNER_TEMP/isolation.log"
            if grep -Eq 'Tests .*skipped' "$RUNNER_TEMP/isolation.log"; then
              echo '::error::Ein Isolations-Test wurde übersprungen — die Datenbank-Umgebung fehlt ihm.'
              exit 1
            fi
          }
          set -o pipefail
          lauf apps/platform/.env pnpm --filter @pukalani/activity --filter @pukalani/comments --filter @pukalani/media exec vitest run tests/tenant-isolation.test.ts
          lauf apps/platform/.env pnpm --filter @pukalani/core exec vitest run tests/notification-tenant-isolation.test.ts
          lauf apps/control/.env pnpm --filter @pukalani/control exec vitest run tests/community-authz-isolation.test.ts tests/communityHostResolver.test.ts tests/communityJoinDatesResolver.test.ts tests/tenants-resolver.test.ts

      # ZWEI BROWSER-TESTS AUF DER BÜHNE (nur nachts, BT1 a): die entfernte
      # Person im Pool (`apps/comments/e2e/community-removed.spec.ts`, gegen
      # den Platform-Server) und die E2E-Datei der Betreiber-App
      # (`apps/control/e2e/smoke.spec.ts`). Kein neuer Server — beide laufen
      # schon; die Variablen leitet `pnpm buehne e2e` aus dem Stand der Bühne
      # ab. Chromium kommt aus dem Schritt oben (`--filter comments`, beide
      # Apps nehmen dieselbe Playwright-Version aus dem Katalog). Die
      # Rechtsseiten der Betreiber-App sind auf der leeren Datenbank nicht
      # da; ohne sie überspränge sich die Hälfte der Smoke-Datei, und ein
      # übersprungener Test macht diesen Schritt ROT — deshalb erst die
      # Platzhalter-Seiten anlegen (Wegwerf-Datenbank).
      - name: Browser-Tests auf der Bühne (nur nachts)
        if: env.LAUF == 'nacht'
        run: |
          node --env-file=apps/control/.env packages/pages/scripts/seed-demo.mjs --single-tenant
          node scripts/buehne/buehne.mjs e2e --control-port "$CONTROL_PORT"

      # Abbau mit Nachzählen: bleibt eine Zeile oder ein Konto der Bühne
      # übrig, endet der Schritt rot. Läuft auch nach einem roten Beweis.
      - name: Bühne abbauen und nachzählen
        if: always()
        run: |
          if [ -f .buehne/state.json ]; then
            node scripts/buehne/buehne.mjs down
          else
            echo 'Keine Bühne aufgebaut — nichts abzubauen.'
          fi

      - name: Server- und Stack-Protokolle bei Fehler
        if: failure()
        run: |
          echo '── Betreiber-App'; tail -n 60 "$RUNNER_TEMP/control.log" || true
          echo '── Platform-Server'; tail -n 60 "$RUNNER_TEMP/platform.log" || true
          if [ -f "$RUNNER_TEMP/einzel.log" ]; then echo '── Einzel-Instanz'; tail -n 60 "$RUNNER_TEMP/einzel.log" || true; fi
          if [ -f "$RUNNER_TEMP/branding.log" ]; then echo '── branding.supply'; tail -n 60 "$RUNNER_TEMP/branding.log" || true; fi
          docker compose --env-file ci/appwrite/ci.env --project-name appwrite-ci -f ci/appwrite/docker-compose.yml logs --tail 80 appwrite appwrite-worker mariadb || true

  # ── ALARM ───────────────────────────────────────────────────────────────
  # Ein roter Lauf ist nur eine Farbe (Oktober 2026: ein Wächter war 19 Tage
  # rot, niemand sah es). Auf main und nachts wird daraus ein Issue.
  alarm:
    runs-on: ubuntu-latest
    needs: [buehne]
    if: >
      always() && !cancelled() &&
      github.event.repository.fork == false &&
      (github.event_name == 'schedule' || github.event_name == 'push' || inputs.alarm_drill)
    # Kein Checkout, kein Secret: nur Issues lesen und schreiben.
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: buehne-alarm
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.buehne.result }}
      DRILL: ${{ inputs.alarm_drill && 'ja' || 'nein' }}
      ANLASS: ${{ github.event_name }}
      # Dieselbe Rechnung wie im Job `buehne`: welche Beweise liefen?
      LAUF: ${{ github.event_name == 'schedule' && 'nacht' || inputs.lauf || 'buehne' }}
      # ROT NACHTS ⇒ dieses zweite Label (BT1 c, 2026-11-27): der kurze Lauf
      # auf `main` fährt die Nacht-Skripte nicht. Am 2026-11-26 schloss er
      # das Issue #614 trotzdem („wieder grün"), obwohl das rote Skript
      # (`verify-brand-sessions`) gar nicht gelaufen war.
      NACHT_LABEL: buehne-alarm-nacht
      ALARM_ASSIGNEE: ${{ github.repository_owner }}
    steps:
      - name: Issue öffnen, bestätigen oder schließen
        run: |
          # STRENG: bricht dieser Schritt ab, ist der Lauf rot — ein kaputter
          # Alarmweg darf nicht grün aussehen.
          set -euo pipefail
          stand=$(date -u '+%Y-%m-%d %H:%M UTC')
          # Nur ein ECHTES Ergebnis zählt. Ein verdrängter oder abgebrochener
          # Lauf („cancelled", „skipped") sagt nichts über das Produkt: weder
          # Alarm noch Entwarnung.
          case "$RESULT" in
            success) zustand=gruen ;;
            failure) zustand=rot ;;
            *) zustand=unklar ;;
          esac
          if [ "$DRILL" = "ja" ]; then zustand=rot; fi
          if [ "$zustand" = "unklar" ]; then
            echo "Ergebnis des Laufs: $RESULT — kein Alarm, keine Entwarnung."
            exit 0
          fi
          gh label create "$LABEL" --color B60205 --description 'Die Bühne (Tests über den echten Kundenpfad) ist rot' >/dev/null 2>&1 || true
          gh label create "$NACHT_LABEL" --color D93F0B --description 'Rot im Nacht-Lauf — nur ein grüner Nacht-Lauf gibt Entwarnung' >/dev/null 2>&1 || true
          nummer=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          hinweis=''
          if [ "$DRILL" = "ja" ]; then hinweis=' (PROBEALARM — nichts ist kaputt)'; fi
          if [ "$zustand" = "rot" ]; then
            if [ -z "$nummer" ]; then
              {
                echo "Die Bühne ist rot$hinweis."
                echo
                echo "- Lauf: $RUN_URL"
                echo "- Anlass: $ANLASS · Stand: $stand"
                echo
                echo 'Was zu tun ist: den Lauf öffnen. Die Zusammenfassung zeigt je Beweis-Skript, ob es bestanden hat; der rote Schritt nennt die letzten Zeilen. Ein roter Beweis heißt: eine Zusage des Kundenpfads hält gerade nicht, oder das Skript ist veraltet. Einteilung und Aufruf von Hand: docs/referenz/LIVE-BEWEISE.md.'
                echo
                echo 'Dieses Issue schließt sich von selbst, sobald ein Lauf auf main oder der nächtliche Lauf wieder grün ist — kam der Alarm aus dem Nacht-Lauf (Label buehne-alarm-nacht), nur ein grüner Nacht-Lauf.'
              } > /tmp/issue-body.md
              nummer=$(gh issue create --title "Bühne rot: Tests über den echten Kundenpfad$hinweis" --label "$LABEL" --assignee "$ALARM_ASSIGNEE" --body-file /tmp/issue-body.md | sed -n 's#.*/issues/\([0-9]*\)$#\1#p')
              echo "Alarm-Issue #$nummer geöffnet."
            else
              gh issue comment "$nummer" --body "Weiter rot$hinweis ($stand, Anlass: $ANLASS). Lauf: $RUN_URL" >/dev/null
              echo "Alarm-Issue #$nummer bestätigt."
            fi
            if [ "$LAUF" = "nacht" ] && [ -n "$nummer" ]; then
              gh issue edit "$nummer" --add-label "$NACHT_LABEL" >/dev/null
            fi
          elif [ -n "$nummer" ] && [ "$LAUF" != "nacht" ] \
            && gh issue view "$nummer" --json labels --jq '.labels[].name' | grep -x "$NACHT_LABEL" >/dev/null; then
            gh issue comment "$nummer" --body "Kurzer Lauf grün ($stand, Anlass: $ANLASS) — der Alarm kam aus dem Nacht-Lauf, dessen Skripte hier nicht liefen. Offen bis zum nächsten grünen Nacht-Lauf. Lauf: $RUN_URL" >/dev/null
            echo "Alarm-Issue #$nummer bleibt offen (Nacht-Alarm, kurzer Lauf)."
          elif [ -n "$nummer" ]; then
            gh issue comment "$nummer" --body "✅ Entwarnung ($stand): die Bühne ist wieder grün. Lauf: $RUN_URL" >/dev/null
            gh issue close "$nummer" --reason completed >/dev/null
            echo "Alarm-Issue #$nummer geschlossen."
          else
            echo 'Grün, kein offenes Alarm-Issue.'
          fi
